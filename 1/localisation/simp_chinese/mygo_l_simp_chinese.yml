 MYGO_TO_TSUKINOMORI_HOSTILE_GREETING_05:0 "不要转移话题。"
 MYGO_TO_TSUKINOMORI_WAR_GREETING_01:0 "丰川祥子，有话快说。"
 MYGO_TO_TSUKINOMORI_WAR_GREETING_02:0 "你要我堂堂正正击败你。好，我正在这里。"
 MYGO_TO_TSUKINOMORI_WAR_GREETING_03:0 "不用再替迷子号计算该往哪里逃。我会击溃你的一切。"
 MYGO_TO_TSUKINOMORI_WAR_GREETING_04:0 "祥子，别用现在逃开过去。"
 MYGO_TO_TSUKINOMORI_WAR_GREETING_05:0 "舰队继续锁定。"
 MYGO_TO_TSUKINOMORI_DOW_PROPOSE_01:0 "“最后通牒时限结束。”\n\n“祥子，我会以迷子号执政官的身份承担这个决定！你也以月之森企业代表的身份回答吧。”\n\n“战争将继续延续！迷子号将与你们进入战争状态。”"
 MYGO_TO_TSUKINOMORI_DOW_ACCEPT_01:0 "“宣战书收到。”\n\n“你说我的领导不差，对吧？那就看着我怎么拦住你，祥祥。”"
 MYGO_TO_TSUKINOMORI_PEACE_PROPOSE_01:0 "撤军线、伤员交换和赔付方案都在附件里。祥子，确认以后停火。"
 MYGO_TO_TSUKINOMORI_PEACE_CONSIDER_01:0 "你等我的答案。"
 MYGO_TO_TSUKINOMORI_PEACE_ACCEPT_01:0 "条件有效。迷子号会按协议停火。祥子，把你的人带回去！"
 MYGO_TO_TSUKINOMORI_PEACE_DECLINE_01:0 "这不是那么轻易的事情。迷子号拒绝。"
 mygo_to_tsukinomori_second_war.desc:0 "§L开始作战。祥子，这次谁也不要先移开视线。§!"
 mygo_to_tsukinomori_postwar_first_contact.desc:0 "普通频道恢复了。祥子，你说。"
 MYGO_TO_TSUKINOMORI_TRADE_PROPOSE_01:0 "价格、交付窗口和违约责任都写好了。祥子，请过目！"
 MYGO_TO_TSUKINOMORI_TRADE_CONSIDER_01:0 "条件确实不错……等一下，不要直接告诉我名字签哪里，让我看完！"
 MYGO_TO_TSUKINOMORI_TRADE_ACCEPT_01:0 "合同成立。祥祥！别露出那种“果然会同意”的表情。"
 MYGO_TO_TSUKINOMORI_TRADE_DECLINE_01:0 "收益不足以覆盖迷子号的运输风险。驳回。嗯！是不是没想到？"
 MYGO_TO_TSUKINOMORI_GIFT_ACCEPT_01:0 "谢谢……祥子。"
 MYGO_TO_TSUKINOMORI_GIFT_PROPOSE_01:0 "收下它们，祥祥。"
 MYGO_TO_TSUKINOMORI_OPEN_BORDERS_01:0 "我允许月之森船只进入迷子号控制区。"
 MYGO_TO_TSUKINOMORI_CLOSE_BORDERS_01:0 "通行许可撤销。宽限期结束前离境，祥子。"
 MYGO_TO_TSUKINOMORI_EMBASSY_PROPOSE_01:0 "迷子号愿意设置月之森常驻使馆。派你的人过来。"
 MYGO_TO_TSUKINOMORI_EMBASSY_ACCEPT_01:0 "使馆申请通过。人员和设备按清单登记。那个，你本人来的话……提前告诉我。"
 MYGO_TO_TSUKINOMORI_EMBASSY_DECLINE_01:0 "现在不接受常驻使馆。现在你也能找到我。"
 MYGO_TO_TSUKINOMORI_RECALL_EMBASSY_01:0 "迷子号使馆将在四十八小时内撤回。工作人员必须全须全尾地回来！"
 MYGO_TO_TSUKINOMORI_RESEARCH_PROPOSE_01:0 "你说CRYCHIC号没有什么是你不知道的。那就和迷子号现在的数据一起核对。"
 MYGO_TO_TSUKINOMORI_RESEARCH_CONSIDER_01:0 "权限目录里缺了好几段。祥祥，你知道缺的是什么，对吧？"
 MYGO_TO_TSUKINOMORI_RESEARCH_ACCEPT_01:0 "协议生效。嗯……你是不是也想念Tomorin了，祥子……祥祥？"
 MYGO_TO_TSUKINOMORI_RESEARCH_DECLINE_01:0 "你要求的权限超过合作范围。迷子号拒绝开放。"
 MYGO_TO_TSUKINOMORI_RESEARCH_BREAK_01:0 "联合项目停止。资料全部撤回。"
 MYGO_TO_TSUKINOMORI_COMMERCIAL_PROPOSE_01:0 "固定采购、演出结算、维修窗口，祥子，这份合作对双方都有好处。"
 MYGO_TO_TSUKINOMORI_COMMERCIAL_CONSIDER_01:0 "流程很完整。嗯……后台休息室里的M豆颜色为什么也写进强制条款了？"
 MYGO_TO_TSUKINOMORI_COMMERCIAL_ACCEPT_01:0 "商业协议通过。祥子，迷子号商业区已经改过了，不许直接照旧规范接管！"
 MYGO_TO_TSUKINOMORI_COMMERCIAL_DECLINE_01:0 "条件不够好。不要以为我会少看两页！"
 MYGO_TO_TSUKINOMORI_COMMERCIAL_BREAK_01:0 "协议终止。坏账和未交付项目分别清算。"
 MYGO_TO_TSUKINOMORI_MIGRATION_PROPOSE_01:0 "当年想下船是她们的事，现在想回来也正常。一起建立往返程序吧。"
 MYGO_TO_TSUKINOMORI_MIGRATION_CONSIDER_01:0 "祥祥……我懂你的意思。"
 MYGO_TO_TSUKINOMORI_MIGRATION_ACCEPT_01:0 "协议通过。……或许你可以想点开心的事，祥祥。"
 MYGO_TO_TSUKINOMORI_MIGRATION_DECLINE_01:0 "现在不能开放。顺遂您的意愿。"
 MYGO_TO_TSUKINOMORI_MIGRATION_BREAK_01:0 "停止受理新申请。遂您心意。"
 MYGO_TO_TSUKINOMORI_NAP_PROPOSE_01:0 "祥子……祥祥！我们之间不可能打仗，对吧~？"
 MYGO_TO_TSUKINOMORI_NAP_ACCEPT_01:0 "协议成立。别担心，我签字前每一页都看完了。"
 MYGO_TO_TSUKINOMORI_NAP_DECLINE_01:0 "现在签字还没有意义。"
 MYGO_TO_TSUKINOMORI_NAP_BREAK_01:0 "互不侵犯协议终止。祥祥……这是挑衅吗？"
 MYGO_TO_TSUKINOMORI_DEFENSIVE_PROPOSE_01:0 "我打算保护你，祥祥！哎呀，我知道这是共同防御啦。"
 MYGO_TO_TSUKINOMORI_DEFENSIVE_ACCEPT_01:0 "共同防御成立。我们站在同一边，但各自指挥自己的舰队。"
 MYGO_TO_TSUKINOMORI_DEFENSIVE_DECLINE_01:0 "你要求的调度权限太高。"
 MYGO_TO_TSUKINOMORI_DEFENSIVE_BREAK_01:0 "防御义务解除。联合部署按计划撤回。祥子，别弄乱我的方案。"
 MYGO_TO_TSUKINOMORI_FEDERATION_INVITE_01:0 "祥祥，和我一起建立新的联盟……新CRYCHIC？不是不是。我们的席位并排。"
 MYGO_TO_TSUKINOMORI_FEDERATION_ACCEPT_01:0 "迷子号同意加入。祥子，我信任你。"
 MYGO_TO_TSUKINOMORI_FEDERATION_DECLINE_01:0 "我们之间仍有太多只由一方知道答案。现在不能加入。"
 MYGO_TO_TSUKINOMORI_FEDERATION_LEAVE_01:0 "退出程序已经提交。祥子，这次是我决定离开，不像你，我会亲自把理由说完。"
 MYGO_TO_TSUKINOMORI_WAYSTATION_PROPOSE_01:0 "给我留一个迷子号固定泊位。谢谢。"
 MYGO_TO_TSUKINOMORI_WAYSTATION_ACCEPT_01:0 "驿站选址通过。你们可以在这里补给。祥子本人不需要预约。"
 MYGO_TO_TSUKINOMORI_WAYSTATION_DECLINE_01:0 "暂时拒绝。抱歉。"
 MYGO_TO_TSUKINOMORI_WAYSTATION_BREAK_01:0 "驿站合同终止。设备按宽限期撤离。祥子，你和小睦可以留下……别人算了。"
 MYGO_TO_TSUKINOMORI_SUBJUGATE_PROPOSE_01:0 "接受迷子号的统一保护与对外调度。现在，试着相信我的指挥。"
 MYGO_TO_TSUKINOMORI_SUBJUGATE_DECLINE_01:0 "丰川祥子，你不是迷子号的舰长。过去不是你替我签字的理由，现在也不是。"
 MYGO_TO_TSUKINOMORI_BECOME_SUBJECT_ACCEPT_01:0 "协议通过。祥祥，听候您的差遣。"
 MYGO_TO_TSUKINOMORI_ACCEPT_SUBJECT_01:0 "从现在起，迷子号承担保护义务。祥子，舰队调度听我的。……你可以随时指出我错在哪里。"
 MYGO_TO_TSUKINOMORI_RELEASE_SUBJECT_01:0 "监管期限结束。祥子，下一步由你自己决定。"
 MYGO_TO_TSUKINOMORI_ASK_RELEASE_01:0 "祥子，迷子号已经能够独立承担结果。相信你对我的评价，结束从属条款。"
 MYGO_TO_TSUKINOMORI_SECRET_FEALTY_01:0 "祥子，帮帮我……帮帮我。"
 MYGO_TO_TSUKINOMORI_RIVAL_PROPOSE_01:0 "祥子，从现在起，我会正面击败你。"
 MYGO_TO_TSUKINOMORI_RIVAL_END_01:0 "宿敌声明撤销。祥子……"
 MYGO_TO_TSUKINOMORI_INSULT_01:0 "祥子，你从一开始就不是一个合格的领袖。你永远也没法超越我。"
 MYGO_TO_TSUKINOMORI_GUARANTEE_01:0 "任何针对你们的入侵都会收到迷子号回应。你不是孤军奋战。从来不是。"
 MYGO_TO_TSUKINOMORI_SUPPORT_INDEPENDENCE_01:0 "撤离坐标、补给点和接应舰队已经准备好。祥子，决定行动时，直接叫我的名字。"

