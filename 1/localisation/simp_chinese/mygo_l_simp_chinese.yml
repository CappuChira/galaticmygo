 mygo.611.desc:0 "“又是这样。”\n\n户山香澄按下舰队频道：“开始战斗。”"
 mygo.612.name:0 "停火：闪耀花园"
 mygo.612.desc:0 "闪耀花园外围的防线停止射击。几艘运输船还在沿紧急航路撤离，尾焰从通讯窗后一闪而过。\n\n“我们会履行停战条件。”香澄说，“你真是糟糕透了……爱音。”"
 mygo.613.name:0 "停火：迷子号"
 mygo.613.desc:0 "Poppin'Party的公共频道先公布了停火边界，随后是一串迷子号伤员的坐标。\n\n香澄出现在最后。\n\n“把还活着的人先带回去。带到popipa，带到没有她们的恐怖压迫的地方。”"
 mygo.615.name:0 "全线停火"
 mygo.615.desc:0 "全线停火。\n\n香澄把一份失踪人员名单传了过来。\n\n“如果迷子号找到这些船，通知我们。”\n\n等到文件确认接收，她切断频道。"
 mygo_popipa_war_event.a:0 "关闭频道。"

 mygo_story.420.name:0 "军需处"
 mygo_story.420.desc:0 "执政官，军需处汇报。推进剂库存充足，常规推进器改装方案已经通过，但由于缺乏合金，目前只能停留在图纸阶段。完毕。"
 mygo_story.420.a:0 "目前大概能发挥多少的作战性能？"
 mygo_story.420.a.response:0 "现阶段若突发接敌，我们的方舟大概能发挥……633点战斗力。"
 mygo_story.420.b:0 "rikki~搞得好认真嘛！"
 mygo_story.420.b.response:0 "……要求我认真工作是理所当然的……这种话怎么想也不该从你嘴里说出来吧！"
 mygo_story.421.name:0 "领地巡游"
 mygo_story.421.desc:0 "嘶……头又痛了。\n\n脑子里只剩下怎么操作这艘破船的基础信息，每次试图去回想记忆，头就会像针扎一样疼。\n\n昨天试着问soyorin和tomorin登船之前的事情……结果她们也是一片空白。\n\n算了……反正每天光是对付这艘破船就够忙的了。"
 mygo_story.421.a:0 "关闭终端，去做一点实际的事情吧！"
 mygo_story.422.name:0 "设施巡视"
 mygo_story.422.desc:0 "作为执政官，你认为自己有必要去确认一下飞船的运行状况。\n\n站在舰桥中央那台巨大的屏幕和投影前，各种仪器发出微弱的嗡鸣。那些复杂的数据流在全息投影中交织，你认为这就是这艘飞船跳动的心脏。\n\n"
 mygo_story.422.a:0 "检查航行日志。"
 mygo_story.422.a.response:0 "§H【权限拒绝】§!——屏幕上弹出了冰冷的红色警告。\n\n你有点摸不着头脑。"
 mygo_story.422.b:0 "去尾部甲板看看吧。"
 mygo_story.422.b.response:0 "万事要从基础开始，你决定前往维生系统所在的尾部甲板。"
 mygo_story.423.name:0 "设施巡视"
 mygo_story.423.desc:0 "穿过漫长且失重的连接通道，你来到了飞船的维生循环区。\n\n这里的空气不再像舰桥那样弥漫着机油味。气态巨星的冰冷光芒透过狭窄的舷窗打在水培农场的培养皿上，那是一些用无机盐催生出来的抹茶色合成藻类。\n\n尽管试图伪造出一种鲜活的错觉，但只要回头看一眼窗外那深不见底的真空，回忆一下刚刚吃过的饭，就会立刻清醒过来——它们真的很难吃。"
 mygo_story.423.a:0 "查看合成藻类的产出率。"
 mygo_story.423.a.response:0 "产能稳定，但你大概一辈子也忘不了，它们的口感极其糟糕。你发誓，迟早要找到一颗富含真正有机质的行星——如果能找到别的文明，大家一起举办派对享受美食，就更好了。"
 mygo_story.423.b:0 "还是前往居住区吧。"
 mygo_story.423.b.response:0 "你开始想要回到自己的舱室了。"
 mygo_story.424.name:0 "设施巡视"
 mygo_story.424.desc:0 "居住区是为了产生1G重力而设计的旋转大圆环，在其间穿行需要费一番功夫。推开居住区的气密门，属于你自己的房间和记忆中的模样并无差别，依旧是一片混乱。\n\n杂七杂八的物品散落在地毯上，或许是时候整理一下了。"
 mygo_story.424.a:0 "收拾一下？"
 mygo_story.424.a.response:0 "在某个视线的死角，你发现了一把落灰的吉他。完全没有任何相关的记忆，你甚至不知道自己什么时候学过弹吉他。\n\n你试着拨动琴弦，发出了一阵轻轻的杂音。"
 mygo_story.424.b:0 "结束巡视，返回工作岗位吧。"
 mygo_story.425.name:0 "独立勘探员"
 mygo_story.425.desc:0 "今天，你试着接通RAANA的通讯。\n\n全息投影的画面在剧烈地晃动，没有任何声音。那个娇小身影直接倒挂在飞船外部的检修把手上。她的手里捏着一把断了一半的古代短刀，面无表情地盯着镜头看了三秒，一扭头走了。\n\n看起来RAANA并不打算和你说话。"
 mygo_story.425.a:0 "喂！至少说一句话吧——"
 mygo_story.425.a.response:0 "§H【连接失败】§!——画面里的白发少女似乎察觉到了你的强制接入。她如同野猫般警觉地眯起眼睛，随后直接切断了外部摄像头的信号源。\n屏幕瞬间变成了一片雪花。"
 mygo_story.425.b:0 "……由她去吧。给她发一艘科研船。"
 mygo_story.425.b.response:0 "系统已将 RAANA 标记为可用状态。\n\n备注：记得给她一包深煎煎茶糖。"
 mygo_story.430.name:0 "雨声"
 mygo_story.430.desc:0 "§H内政总管 【SOYO】§!\n\nANON……不，千早阁下。科学团队刚刚递交的解密报告，我已经在行政终端上看过了。\n\n告诉我，你还知道些什么？我们到底……遗忘了什么？"
 mygo_story.430.a:0 "……"
 mygo_story.430.a.response:0 "……我明白了。你不想说的事情，我不会勉强你。"
 mygo_story.430.b:0 "这艘船的秘密，我会查清楚的。"
 mygo_story.430.b.response:0 "是吗……那么，就继续拜托您了。请务必……不要让我们失望哦，千早阁下。"
 mygo_story.440.name:0 "通讯接入：内政总管"
 mygo_story.440.desc:0 "§H内政总管 【SOYO】§!\n\n不要出声，先听我说，ANON。事情有些超出控制，我已经用内政主管的权限把那段录音彻底隔离了，小灯也被我提前支开了，不会有第三个人看到它。\n\n（屏幕上的素世她微微低着头，唇角带着一抹甚至有些宠溺的微笑。）\n\n原来……是爱音你做的事情呢。我居然会哭得那么狼狈地去求你……真是不像样呢。\n\n但是，不要紧的哦。请不要露出那种快要坏掉的表情，也不要有什么负担。你当时一定也是为了让我们活下去，为了这艘船的存续，才不得不做出那么痛苦的决定的吧？\n\n过去的事情，我们早晚会全部了解清楚的。现在的你，是那个带着大家在星海里努力活下去的ANON。所以……想开一点吧，我不会怪你的。"
 mygo_story.440.a:0 "真的不怪我吗……素世？"
 mygo_story.440.a.response:0 "没关系的呢。那些痛苦的、会让人坏掉的记忆，就算不要了也没关系。只要现在，你还需要我来帮你管理内政，不就足够了吗？"
 mygo_story.440.b:0 "谢谢你，soyorin……真的谢谢你。"
 mygo_story.440.b.response:0 "都说了……请不要再叫这种奇怪的绰号了。不过，偶尔听一次……似乎也并不坏呢。只要ANON……小爱音，以后不管做什么决定，都绝对不要放开我的手……这就足够了。"
 mygo_story.450.name:0 "失重的红茶"
 mygo_story.450.desc:0 "时间已经过去了数个周期。\n\n舰桥的全息投影依旧闪烁着冰冷的光芒，但主控台前的那个位置，最近却经常陷入长久的死寂。你发现自己开始害怕触碰那些推杆，哪怕只是规划一条普通的航线，脑海里都会浮现出上一世的自己将大家格式化时的冰冷白光。\n\n今天你又一次在决策中途恍神了。为了逃避这种窒息感，你漫无目的地走在居住区的环形长廊上。走廊尽头是一处狭窄的观景舱，星系中央那颗垂死的白矮星正散发着惨淡的蓝白荧光。\n\n“——在这种地方吹冷风，可不符合执政官的作息表呢，小爱音。”\n\n一抹熟悉的棕色身影不知何时站在了你的身侧。长崎素世手里端着两个保温杯，将其中一个递到了你的面前。"
 mygo_story.450.a:0 "我只是，突然不知道该怎么这样下去了。"
 mygo_story.450.a.response:0 "现在的小爱音，连笑起来都像是在哭呢。因为那些烧毁的数据而害怕了吗？觉得这艘飞船上的所有人，都是被你握在手里的牵线木偶？"
 mygo_story.450.b:0 "如果我再次按下去……你们是不是又会把我忘掉？"
 mygo_story.450.b.response:0 "（她将手中的杯子放下，身体微微向你倾斜，伸出双手轻柔却不容拒绝地捧住了你的脸颊。她的手心很温暖。）\n\n不会的。我保证，绝对不会发生那种事。\n\n就算你真的再次按了下去，就算大家把一切都忘了……我们也一定会像现在这样，重新找到你，重新站在你身边。\n\n所以，不要再露出这种表情了。茶要凉了，喝完它，然后……像以前那样，自信地带我们走下去吧，元首阁下？"
 mygo_story.460.name:0 "下午茶"
 mygo_story.460.desc:0 "为了打破前段时间发掘报告带来的压抑气氛，你决定以执政官的最高名义，举办第一届【红茶与藻类品鉴茶话会】。\n\n此刻，在休息舱的金属料理台前，你正和科学官tomorin大眼瞪小眼。盘子里摆放着你们的劳动成果——一种用合成蛋白质、水培抹茶藻类以及……不知道灯从哪里敲下来的‘富钠矿物质结晶粉末’混合而成的墨绿色糕点。它散发着一种难以言喻的、如同星际废料般的诡异微光。\n\n“那个……小爱。”灯有些不安，“……大家，会喜欢吗？”"
 mygo_story.460.a:0 "放心吧灯！这绝对是超越时代的宇宙神级料理！"
 mygo_story.460.a.response:0 "“超、超越时代吗……”灯的眼睛亮了一下，有些羞涩地笑了起来，“太好了。不过……总觉得这个颜色，很像立希生气时的脸色呢……”"
 mygo_story.460.b:0 "其实……我也有点虚，这东西真的不会吃坏肚子吗？"
 mygo_story.460.b.response:0 "“呜……如果让全舰拉肚子的话，小素世绝对会生气的吧？”"
 mygo_story.460.c:0 "拍张照上传到主控网，起名叫“ANON PIE”。"
 mygo_story.460.c.response:0 "【系统提示】：动态已发送。"
 mygo_story.460.d:0 "不管了！强行接入其他人的终端，命令她们立刻过来吃！"
 mygo_story.460.d.response:0 "……"
 mygo_story.461.name:0 "受害者们"
 mygo_story.461.desc:0 "两分钟内，休息舱的气密门被粗暴地推开了。\n\n“千早爱音！你发红色级别的紧急召集令居然是为了——”在看到盘子里那一坨散发着诡异绿光的糕点时，她的声音戛然而止，脸确实变得和糕点一个颜色。\n\n长崎素世紧随其后。她看了一眼料理台，唇角的微笑变得僵硬：“……真是不敢轻易动刀呢。”"
 mygo_story.461.a:0 "rikki，别那么凶嘛，这可是用了精准的配比哦！"
 mygo_story.461.a.response:0 "“哈？！”立希暴躁地揉着太阳穴，“灯，你不要总是跟着这家伙胡闹……”"
 mygo_story.461.b:0 "soyorin，快来尝尝，这绝对是顶级口感！"
 mygo_story.461.b.response:0 "“……”素世的身体却微妙地往后退了一步，“……让小乐奈来试一下？”"
 mygo_story.461.c:0 "乐奈怎么还没来……"
 mygo_story.461.c.response:0 "砰的一声，通风口格栅被粗暴踢开！！"
 mygo_story.462.name:0 "野猫突袭"
 mygo_story.462.desc:0 "一抹白色的身影从天而降，如同野猫般精准地落在了料理台上。\n\n是乐奈。她那双毫无波澜的眼睛在房间里扫了一圈，最后死死地钉在了那盘墨绿色的糕点上。抽了抽鼻子后，乐奈甚至连招呼都没打，直接伸手抓起最大的一块，在众人的目光中塞进了嘴里。\n\n“喂！野猫！那个不能随便——”立希伸出手试图阻止，但已经来不及了。"
 mygo_story.462.a:0 "怎、怎么样？超级好吃的对吧？！"
 mygo_story.462.a.response:0 "乐奈的表情突然皱成了一团。\n“难吃。不是抹茶。”乐奈转过头，死死盯着爱音，“爱音，糖，漱口。”"
 mygo_story.462.b:0 "呜哇！我的心血！rikki你快看她啦！"
 mygo_story.462.b.response:0 "“活该，谁让你做这种怪东西的。”"
 mygo_story.462.c:0 "还有最后一块点心……"
 mygo_story.462.c.response:0 "众人的目光缓缓移到了你的脸上，笑容逐渐深邃。"
 mygo_story.463.name:0 "光盘行动"
 mygo_story.463.desc:0 "“好了，小爱音。”素世端起盘子里最后那块散发着微光的糕点，极其优雅地递到了你的嘴边，“就请您怀着激动的心情，全部吃下去吧？”\n\n立希双手抱胸，冷笑着在一旁围观。灯则和乐奈在一旁亮晶晶地看着你。\n\n看着那块闪烁着幽光的糕点，你咽了口唾沫，深知今天这一关是无论如何也躲不过去了。"
 mygo_story.463.a:0 "……呜哇！真的好难吃啊！"
 mygo_story.463.a.response:0 "随着你痛苦的咀嚼和惨叫，休息舱里爆发出了久违的喧闹声。立希一边骂你笨蛋，一边急忙和灯去接过滤水，素世长叹一口气，而在弥留之际，你似乎听到有人在夸你是“有趣的女人”……\n\n不仅点心极其失败，在这一刻，你也离死没多远了……"
  mygo_story.470.name:0 "查寝"
 mygo_story.470.desc:0 "你正躺在自己舱室的床上无所事事，房间的门突然发出一声刺耳的脆响。\n\n立希手里拿着一块平板电脑，黑着脸大步跨了进来。她的目光甚至没有在你身上停留，而是直接死死地盯着你那堆满了过期零食袋，椅子上还散落着换洗制服的梳妆台。\n\n“爱音，备件库的清单上少了一个电子干扰仪。我查了监控，那个小东西黏在你的衣服上了。它现在在哪？”"
 mygo_story.470.a:0 "Rikki！进女孩子的房间之前要先敲门啊！"
 mygo_story.470.a.response:0 "“哈？！我对你的隐私没兴趣。”立希扬了扬手里的平板电脑，“快点，你的衣服都堆在这了吗？”"
 mygo_story.470.b:0 "怎么可能啦，那种东西能黏在衣服上吗？"
 mygo_story.470.b.response:0 "“不愿意找我就替你来。”椎名立希推开面前堆积的空罐子，“闪开，我自己找。”"
 mygo_story.470.c:0 "等等！你别乱翻我的桌子！"
 mygo_story.470.c.response:0 "你试图用身体挡住桌子，阻止她把你的全部家当翻个底朝天。"
 mygo_story.471.name:0 "梦想改造家"
 mygo_story.471.desc:0 "几分钟后，毫无进度的椎名立希看着眼前这间堪比废料堆的房间，深深地叹了一口气。\n\n“你每天就睡在这种地方？”椎名立希把平板电脑往床上一扔，“那我来教你怎么收拾房间。”\n\n还没等你反应过来，她已经开始把地上的衣服粗暴地分类，然后扔进收纳箱里。"
 mygo_story.471.a:0 "别动那个！你动了我就找不见啦——"
 mygo_story.471.a.response:0 "椎名立希头也不回，随手把一件外套拍在你的脸上。"
 mygo_story.471.b:0 "Rikki最好了！那就，顺便帮我把床单也铺一下吧？"
 mygo_story.471.b.response:0 "“千早爱音！你真以为我是来给你当免费女仆的吗？！”椎名立希猛地转过头狠狠瞪了你一眼，但手上的动作倒是完全没有停下来的意思。"
 mygo_story.471.c:0 "这件我等下还要穿——"
 mygo_story.471.c.response:0 "床底下的某个东西被碰了一下，发出了沉闷的金属撞击声。"
 mygo_story.472.name:0 "古老遗产"
 mygo_story.472.desc:0 "椎名立希疑惑地蹲下身，直接从你的床底下拖出了一个落满灰尘的旧铁盒。\n\n“这是什么……”椎名立希一边嘀咕着，一边打开了生锈的锁扣。铁盒盖弹开，露出了里面厚厚的一叠。\n\n你和她同时看清了最上面的那张画——那是线条极其抽象的人物画像，旁边还用极其显眼的艺术字歪歪扭扭地写着：【超级天才爱音酱】。在画像的下面，其他画纸上画着各种奇怪的东西——\n\n包括一根木棍串起来一片柠檬的奇怪物体，旁边的文字说这东西就是迷子号。"
 mygo_story.472.a:0 "哇啊啊啊！不准看！快还给我！"
 mygo_story.472.a.response:0 "已经晚了。椎名立希的动作比你更快，她已经把那厚厚的一叠拿在了手里。"
 mygo_story.472.b:0 "……那个，这其实是……这是什么呀，我也没见过哦……"
 mygo_story.472.b.response:0 "椎名立希缓缓抬起头，用一种看傻子一样的眼神看着你：“千早爱音，你……还算有艺术细胞？”"
 mygo_story.472.c:0 "可能是我小时候画的吧……但是我完全没印象了！"
 mygo_story.472.c.response:0 "“原来你小时候写字也这么丑吗……”椎名立希的眼神里充满了怀疑。她把那厚厚的一叠画纸重新放回铁盒里，锁上了锁扣。"
 mygo_story.473.name:0 "竣工"
 mygo_story.473.desc:0 "椎名立希把铁盒塞回了你的怀里，随后默默地把清理好的收纳箱推到了墙角。房间此刻变得前所未有的整洁干净。\n\n“啊，那个小仪器在这。”椎名立希把它捡起来，拿起平板电脑往门外走去。在踏出门舱的前一刻，她停下脚步，微微侧过头，虽然极力压制，但唇角还是忍不住抽动了一下。\n\n“超级天才爱音酱……”\n\n门舱在眼前缓缓合上。你抱着那个铁盒坐在干净的地板上，觉得自己的尊严……已经消失殆尽。"
 mygo_story.473.a:0 "可恶……Rikki！！！"
 mygo_story.473.a.response:0 "你躺回床上，大脑一片空白。"
 mygo_story.480.name:0 "真空中的荧光"
 mygo_story.480.desc:0 "今天‘迷子号’停靠在一片彗星带边缘进行破冰作业。\n\n你刚批完手头的行政报告，休息舱的传呼器里就响起了高松灯的声音：“小爱……看观景甲板……外面在闪闪发光！”\n\n你赶到全景舷窗前。在切割巨大冰体时，无数碎冰化作的冰晶在真空中逸散开来。在恒星光线的折射下，无数细小的荧光颗粒在方舟外围静谧地漂流，形成了一场铺天盖地的七彩星尘海。"
 mygo_story.480.a:0 "哇！好漂亮！"
 mygo_story.480.a.response:0 "“嗯……看上去有点像，舞台。”站在你身边的灯把脸贴在冰冷的玻璃上，眼里倒映着彩色的荧光，“总觉得……它们好温柔，在这么冷、这么黑的太空里，也想要努力发光。”"
 mygo_story.480.b:0 "tomorin，这好浪漫啊……"
 mygo_story.480.b.response:0 "“嗯……”灯看得入了迷。"
 mygo_story.480.c:0 "谢谢你叫我来看，心情好多了。"
 mygo_story.480.c.response:0 "高松灯羞涩地笑了笑，随后像是想起了什么，从兜里摸出一个装标本的小玻璃瓶。"
 mygo_story.481.name:0 "石头、冰粒与闪闪发光的眼泪"
 mygo_story.481.desc:0 "灯抬起手，用玻璃瓶比着窗外缓缓翻滚的彩色冰粒。\n\n“小爱……这些在宇宙里死掉的、闪闪发光的眼泪，如果飘走了，是不是就再也找不到了？如果能留住它们的话……”"
 mygo_story.481.a:0 "可能美丽的东西总是稍纵即逝吧，就像烟花……唔……烟花……？"
 mygo_story.481.a.response:0 "“这样啊……”高松灯有些失落地垂下头，“也是呢。我总是想收集这些留不住的东西……”"
 mygo_story.481.b:0 "用玻璃瓶收集它们吗？"
 mygo_story.481.b.response:0 "“不用了。即便是收集起来，它们以后，也不会像现在一样闪闪发光了。”"
 mygo_story.481.c:0 "唔……"
 mygo_story.481.c.response:0 "一转身，你看到独立勘探员乐奈正提着一把吉他站在门口。"
 mygo_story.482.name:0 "无声星海与随性音符"
 mygo_story.482.desc:0 "一转身，你看到独立勘探员乐奈正提着一把吉他站在门口。要乐奈根本没有理会你和高松灯惊讶的目光。\n\n她大大咧咧地在舷窗边的地板上盘腿坐了下来。手指抚上琴弦，一阵极其清脆、毫无章法却极其高亢自由的吉他音符瞬间在空旷的观景甲板上爆开。\n\n外面是死寂、无声、静谧漂流的折射冰晶；里面是乐奈随性且激烈的扫弦。高松灯先是愣了一下，随后一屁股坐在乐奈身边，合着吉他的拍子小声地、一句一句地哼唱起来。"
 mygo_story.482.a:0 "小乐奈！你居然会弹吉他啊！"
 mygo_story.482.a.response:0 "要乐奈连眼皮都没抬一下，指尖疯狂扫弦，嘴里咬着煎茶糖，含糊不清地回了一句：“吉他说，它想唱歌。”"
 mygo_story.482.b:0 "（索性也坐了下来）我也加入！"
 mygo_story.482.b.response:0 "你试着一边拍打着金属墙壁当打击乐，一边跟着灯的声音瞎哼哼。要乐奈听到你的古怪节奏，唇角往上勾了勾，吉他的旋律瞬间变得更加欢快。"
 mygo_story.482.c:0 "音乐和哼唱在甲板上回荡，窗外的荧光渐渐远去……"
 mygo_story.482.c.response:0 "直到观景台逐渐转到看不到冰荧光海的位置，恒星的光芒被方舟的阴影遮挡，这场即兴演出才慢慢平息下来。"
 mygo_story.483.name:0 "迷星叫"
 mygo_story.483.desc:0 "要乐奈松开手，将吉他往你怀里一推，站了起来：“肚子饿了。”说完，她就像来时一样，轻快地溜出了观景舱。\n\n灯还坐在地上，她抬起头看着你，星光落在她的眸子里，明亮耀眼：“小爱……虽然我们不知道以前是谁，但只要像现在这样大家在一起，一起走下去，就一定能找到更多关于过去的事情！”\n\n你看向恢复黑暗的深空。"
 mygo_story.483.a:0 "我，我也要弹吗？"
 mygo_story.483.a.response:0 "你抱着吉他，试着拨弄几下琴弦。\n\n果然还是好难听。\n\n§H新的星尘信标解锁了§!。"
 mygo_story.490.name:0 "迷路的星际果冻"
 mygo_story.490.desc:0 "此刻，这只半透明、像果冻一样柔软的外星生物正被关在生物隔离舱里，缓慢地蠕动着。灯已经趴在玻璃上盯了它整整两个小时。\n\n“小爱……”Tomorin转过头，声音里带着一种难以掩饰的激动，“我们……能收养它吗？”"
 mygo_story.490.a:0 "这东西真的安全吗？不会突然喷酸液吧？"
 mygo_story.490.a.response:0 "“它是……食草系的。”灯急忙拿出数据板，“而且它的触角看起来很软……”"
 mygo_story.490.b:0 "好啊！既然要在船上长住，那我们就给它起个名字吧！"
 mygo_story.491.name:0 "泡泡！"
 mygo_story.491.desc:0 "“既然它长得圆乎乎、软趴趴的，还会吐泡泡……”你双手叉腰，极其自信地宣布了你的方案，“我决定叫它【泡泡】！”\n\n“不行！”一向温顺的灯极其罕见地反驳了你。她把日记本举过头顶，眼神异常坚定：“它是在宇宙的黑夜里流浪的孩子！应该叫【司夜女神】！”\n\n“难听。”一直蹲在旁边的乐奈突然站了起来，指着玻璃窗里那团半透明果冻，“叫【毛球】。”\n\n你和灯同时看向乐奈。那玩意到底哪里像毛球了？！"
 mygo_story.491.a:0 "Tomorin，‘司夜女神’对于一只虫子来说太沉重了吧！"
 mygo_story.491.a.response:0 "“才不沉重！它在发光，就像星星一样……”灯执拗地抱着本子，“小爱的‘泡泡’听起来像是一戳就破的洗洁精……”\n\n你感觉自己的品味受到了挑战。"
 mygo_story.491.b:0 "小乐奈，不管怎么看它都不是毛茸茸的啊！"
 mygo_story.491.b.response:0 "乐奈双手抱在脑后，理直气壮地回了一句：“就是毛球。泡泡难听。”\n\n她怎么是这样想的！"
 mygo_story.491.c:0 "那就召开投票表决！"
 mygo_story.492.name:0 "一定要叫它泡泡吗？"
 mygo_story.492.desc:0 "关于“泡泡”、“司夜女神”和“毛球”的争执已经持续了十五分钟。立希和素世被你强行拉进了连线会议。\n\n椎名立希：“千早爱音！你是不是太闲了？为了给一只太空变形虫起名字？叫‘阿米巴原虫1号’！”\n\n长崎素世：“我倒是觉得，由发现的人自己命名最为妥当哦。”\n\n最终计票结果：\n泡泡——1票\n司夜女神——1票\n毛球——1票\n\n这场轰轰烈烈的命名大作战，因为没人能拿到多数票而彻底陷入了僵局。"
 mygo_story.492.a:0 "（叹气）算了……"
 mygo_story.492.a.response:0 "虽然名字没有定下来，但这只太空变形虫就这样在迷子号上安了家。\n\n也许在这个冰冷的宇宙里，多一个迷路的同伴，也不是什么坏事。"
 mygo_story.493.name:0 "舰内日常：深空水族馆"
 mygo_story.493.desc:0 "迷子号驶入了一片未知的电磁星云。\n\n当你在走廊上巡视时，发现舷窗外那深邃、冰冷的绝对黑暗消失了。取而代之的，是一种无边无际的、泛着柔和微光的蔚蓝色。整个观景甲板都被这层梦幻般的荧光笼罩着。\n\n高松灯正趴在全景玻璃前。她平时总是微微瑟缩的背影，此刻在蓝光的勾勒下显得格外宁静。她回过头，那双眼睛里倒映着一整片缓缓流动的发光星海。"
 mygo_story.493.a:0 "Tomorin，在这里看什么呢？"
 mygo_story.493.a.response:0 "“小爱……”高松灯的声音很轻，害怕惊碎了这场悬浮在真空中的梦，“外面……变成了蓝色的。好安静，好漂亮……”"
 mygo_story.493.b:0 "（走到她身边，一起趴在冰凉的玻璃上）"
 mygo_story.494.name:0 "舰内日常：悬浮的梦境"
 mygo_story.494.desc:0 "你学着高松灯的样子，把额头抵在冰凉的玻璃上。巨大的蓝色星云在飞船外缓慢地流淌，偶尔有细碎的陨石划过雾气，带起一串极其轻柔的银色涟漪。\n\n“这里……好像水族馆。”高松灯看着外面那些蓝色的雾气，有些痴迷地呢喃，“在我那些朦胧的记忆里……我好像，去过一个到处都是蓝色的地方。那里有很多在水里游动的鱼，黑色的小动物露着白肚皮从我头顶游过。它们不会说话，只是静静地陪着我……”\n\n她的呼吸在玻璃上氤氲出一小片白雾，将外面的星云晕染得更加温柔。"
 mygo_story.494.a:0 "那Tomorin记忆里的水族馆，有现在这么漂亮吗？"
 mygo_story.494.a.response:0 "高松灯轻轻摇了摇头：“我不记得了……记忆里的水族馆，好像也像现在这样，身边有这么温暖的……”"
 mygo_story.494.b:0 "不管是星星还是水族馆，现在我们都在一起看哦。"
 mygo_story.495.name:0 "舰内日常：一期一会的相遇"
 mygo_story.495.desc:0 "高松灯微微睁大眼睛，随后，她转过头，极其认真地看着你。蓝色的星云光芒落在她的发丝和脸颊上，美得有些不真实。\n\n“嗯……哪怕宇宙这么大，哪怕这片蓝色的星云飞过去就再也见不到了……”\n\n灯伸出小拇指，轻轻拉起你放在玻璃上的手：\n\n“但只要和小爱一起，这种‘一期一会’的相遇，就不会消失。它会变成新的记忆，绝对不会再被删掉。”\n\n她看着你，露出了笑容：“小爱，下次……也要一起看。”"
 mygo_story.495.a:0 "（勾紧她的小指）一辈子都一起看。"
 mygo_story.495.a.response:0 "深蓝色的星云，在你们身前缓缓转动。"

 mygo_story.500.name:0 "往日的幻影"
 mygo_story.500.desc:0 "迷子号曾经拥有另一个名字——CRYCHIC。\n\n你盯着舰桥玻璃上倒映出的自己，忽然产生了一个想法：为什么船名会在悄无声息间被改掉？又是否应该把船名改回去？\n\n你有点想买一张改名卡。CRYCHIC这个名字听起来似乎比“迷子号”有气势多了吧？"
 mygo_story.500.a:0 "好好想想，要改名吗……"
 mygo_story.500.a.response:0 "如果更改舰名的话，需要重印全部识别牌，重置数据库里的各种变量名，还容易造成不少混乱。你忽然理解了素世为什么一直没有向你提这件事——它似乎，确实不怎么有可行性。\n\n但是为什么，这艘船的名字要从CRYCHIC改成迷子号呢？"
 mygo_story.500.b:0 "这种事情，还是先问问大家吧。"

 mygo_story.501.name:0 "改名卡"
 mygo_story.501.desc:0 "爽世把她的终端推到你面前：\n“CRYCHIC是过去的名字。现在这艘船上的居民，是把迷子号当作家生活下来的。所以……”\n\n灯一直盯着CRYCHIC几个字，小声重复着它们的发音。\n\n“CRY……CHIC。”"
 mygo_story.501.a:0 "更改舰名的花费，具体是多少？"
 mygo_story.501.a.response:0 "爽世的指尖在终端上滑动两下：“至少需要3天的协调，还需要作废一大批物料。民众的习惯更是很难改过来的。我觉得……”"
 mygo_story.501.b:0 "嗯……"

 mygo_story.502.name:0 "双子星"
 mygo_story.502.desc:0 "“CRYCHIC……是我们忘记的名字。迷子号……是我们忘记以后，一起走到这里的名字。”\n\n灯想了很久，最终在笔记本上画了两个嵌套的环。\n\n迷子号的名字不会再改回去。\n\n但是你们永远也不会忘掉CRYCHIC这个名字了。"
 mygo_story.502.a:0 "迷子号继续前进，CRYCHIC也在这里。"

 mygo_story.510.name:0 "广播频段"
 mygo_story.510.desc:0 "在进行常规自检时，技术团队发现了一个隐藏的广播频道：§YMAIGO LIVE INTERNAL§!。\n\n这个频道拥有高于普通通讯的权限，却没有任何关闭记录。不过，主要让人感兴趣的还是它的名字。"
 mygo_story.510.a:0 "听起来好像是又一处历史遗产。"
 mygo_story.510.a.response:0 "事实也是如此。这个频道的存在，说明迷子号曾经有一支很不错的乐队。"
 mygo_story.510.b:0 "找个人测试一下就知道了。"

 mygo_story.511.name:0 "全舰都听见了"
 mygo_story.511.desc:0 "“测试……测试。这里是……迷子。”\n\n灯的声音从广播中传出，穿过居住环，维生区，引擎舱……连舰桥也在播放。她可能以为只有你们能听见，于是继续念起刚写在本子上的句子。\n\n直到她隐隐约约听到居住区方向响起掌声，她才意识到事情好像不太对。"
 mygo_story.511.a:0 "Tomorin，你刚刚在全舰朗诵哦。"
 mygo_story.511.a.response:0 "灯整个人僵在麦克风前，随后迅速缩到控制台下，只剩头顶还露在外面。"
 mygo_story.511.b:0 "广播效果这么好，不能浪费！"

 mygo_story.512.name:0 "临时决定"
 mygo_story.512.desc:0 "舰内网络很快堆满了要求重播的留言。有人说灯的声音让长期夜班没那么难熬，也有人询问什么时候会再次广播。\n\n你头脑一热，接过麦克风，宣布迷子号将举办一场内部Live。"
 mygo_story.512.a:0 "我们有会弹吉他的乐奈，会念诗的灯。不会有问题！"

 mygo_story.520.name:0 "MAIGO 1st LIVE"
 mygo_story.520.desc:0 "迷子号最大的备用货舱被清空。你们搭建了临时舞台，用维修灯制造光效。\n\n万事俱备，不过一点小小的问题在于，货舱里显然没有观众席。真正的听众都在各自岗位上，只能通过旧广播频道收听。"
 mygo_story.520.a:0 "看不到观众的话，真的能算Live吗？"
 mygo_story.520.a.response:0 "灯摸了摸麦克风：“只要有人在听……声音能够到达……就是Live。”"
 mygo_story.520.b:0 "开始布置吧！就由我亲自担任舞台监督！"

 mygo_story.521.name:0 "MAIGO 1st LIVE"
 mygo_story.521.desc:0 "“乐奈已经坐在最高的货箱上试琴，灯抱着诗站在舞台中央。你们的Live策略简单粗暴：由乐奈伴奏，而灯为大家朗诵她的诗。\n\n立希和素世在舞台两侧，一个监控音效，另一个摄像。你则坐在控制台前，负责调试广播和舞台监督。\n\n一切准备就绪，Live正式开始。”"
 mygo_story.521.a:0 "Soyorin！拍我拍我！"
 mygo_story.521.a.response:0 "“小爱音今天头发好像有点乱呢。”\n她的全息摄制扫过你的方向。\n你看到她掩抑不住的笑意，自己也不由地感到心潮澎湃。"
 mygo_story.521.b:0 "马上就要开始了！"

 mygo_story.522.name:0 "MAIGO 1st LIVE"
 mygo_story.522.desc:0 "乐奈率先弹出一段分解和弦。灯则闭上眼睛，把那段新写下的句子唱了出来。\n\n你站在台下，一瞬间竟然也感受到了心潮澎湃。\n\n你想起来了你卧室里的那把吉他。\n\n迷子号上，所有人！都在听着这场Live！"
 mygo_story.522.a:0 "我也……想当主唱！"
 mygo_story.522.a.response:0 "如果要组建一支MAIGO乐队，你想要站在中间，想要让自己的声音在群星中回响。\n\n不只是迷子号，你想让全银河系所有人都听见。"
 mygo_story.522.b:0 "闪闪发光，心动不已……"

 mygo_story.523.name:0 "MAIGO 1st LIVE"
 mygo_story.523.desc:0 "最后一个音在空货舱里结束了。舰内网络的实时回应不断滚动，铺满主屏幕。\n\n值守中的舰员从每个舱段发来同一句话：ENCORE！\n\n灯看着那些不断增加的信号，一下子慌了神，只知道一股劲地说“谢谢，谢谢”。"
 mygo_story.523.a:0 "下一次……下一次！就安排在下周吧！"

 mygo_story.530.name:0 "定番"
 mygo_story.530.desc:0 "Live自此成为了休息日的迷子号上不可或缺的一部分。\n立希说她想学学打鼓，这两天一直在筹备着如何加入Live的进程。\n素世则说工作实在太忙，没时间一起排练，推辞了下来。\n\n至于你……\n\n你已经开始偷偷练习吉他了，没准能很快成为一名优秀的吉他主唱。"
 mygo_story.530.a:0 "在我不唱歌的时候，也可以为tomorin伴奏~完美计划！"
 mygo_story.530.a.response:0 "你开始幻想着自己和灯一起站在舞台中央，万千光束汇聚于你们身上。还有你独自拿着吉他弹出超酷solo的场景——\n\n全舰的舰员们簇拥着，你会成为迷子号的超级偶像！"
 mygo_story.530.b:0 "继续练习吉他……嘿嘿~"

 mygo_story.531.name:0 "同行者"
 mygo_story.531.desc:0 "行政部报告。\n素世在数据库的一大堆无用文件中发现，系统AI居然自动生成了一份属于你们演出的节目报告。\n\n报告前面写着CRYCHIC，AI在其中详细分析了每个节目的演出效果，对成员们进行了毫不吝啬的夸赞，并自动附有两个外部通讯校验码。\n\n你们的演出为什么会自动附带上两个外部通讯？这件事有些离奇。"
 mygo_story.531.a:0 "AI疯了？"
 mygo_story.531.a.response:0 "这个事实让你们队自己的过往更加好奇。或许你们的过去不仅有人离开，也曾有人赶来与你们相见。"
 mygo_story.531.b:0 "AI应该没疯……"

 mygo_story.540.name:0 "下一场，在更远的星星见"
 mygo_story.540.desc:0 "灯带着写满整页的推算，跌跌撞撞地来到舰桥找你。对之前AI生成报告的研究结果最后凝练成短短的一句话：\n\n§L“下一场，在更远的星星见！”§!\n\n这句话后面附带了一个星系的坐标。"
 mygo_story.540.a:0 "约会地点？"
 mygo_story.540.a.response:0 "“不，不是！”灯的脸涨得通红，“是这个星系！这个星系里，肯定会有线索的！”"
 mygo_story.540.b:0 "那让我们开启导航……出发吧！"

 mygo_story.541.name:0 "约定仍在等待"
 mygo_story.541.desc:0 "候选坐标距离迷子号并不遥远，迷子号将沿着一份约定前往那里。"
 mygo_story.541.a:0 "新的星尘信标，我们来了！"

 mygo_story.550.name:0 "重逢"
 mygo_story.550.desc:0 "与昔日同伴的重逢，让你们陷入了不小的混乱。\n\n要不要把航线调转到和她们更近的地方，新的路径该如何规划以避开采矿无人机；\n\n船上的乘员们都期待着去看看其他的人类星球是什么样子，大家都已经很久没有站在真正的星球上，脚踏实地地感受不是被模拟出来的重力了；\n\n不过，该如何面对那些新认识的……旧朋友们，成了你们最难以抉择的重要问题。"
 mygo_story.551.name:0 "倒不如选择信任她们好了"
 mygo_story.551.desc:0 "你们还是决定把自己失去了所有记忆的事情告诉她们。\n\n尽管出于安全与底细的考量，这么做是把自己的一大软肋交了出去——但你们很显然也很难在这群熟悉你们的人面前伪装下去。\n\n倒不如选择信任她们好了。\n\n户山香澄的表情在听到这句话的一瞬间变成了惊愕：\n\n“欸？！不会吧！小爱音？你没有在开玩笑吗？”\n\n你花了很长时间和她解释。关于你们的事情拼拼凑凑，你把从记忆中断点到现在的故事简要叙述。\n\n看着她亮晶晶的眼神，你犹豫了一下，把星尘信标的事情也说了出来——\n\n关于三艘方舟的分离，你们在星云间的航行，唯独跳过了关于内乱和方舟解体的那件事，最后来到了记忆的清零。\n\n她一直安静地听着，影像上她的脸随着呼吸而一动一动，时不时地因为你的叙述而皱起眉毛，露出揪心的表情。\n\n“小爱音……”她最后说，“虽然不知道为什么会变成这样，但Poppin'Party绝对会无条件地支持你们的！以后有什么难处尽管直接和我说！呜呜真的好感人……有咲——你快过来——”"
 mygo_story.551.a:0 "好的……"
 mygo_story.552.name:0 "感谢我们的再次相遇"
 mygo_story.552.desc:0 "和morfonica的通话则是由二叶筑紫出面的，她解释说真白正在忙于其他事情。在得知你们已经什么都不记得了之后，她小小的身板叹了口气，随后用严肃认真的眼神看着你，和你讲了一大堆关于过去的事情：\n\n“小真白她之前天天会和灯在一起，两个人分别抱着一个笔记本窃窃私语呢。我们不知她们在聊什么，但是每次灯回去以后真白都会把自己锁在房间里偷偷哭，边哭边喊‘我这种人，我这种人！怎么就没有灯那么有创意——’这种话……\n\n“Popipa，Monica，还有CryChiC，我们三个是并行方舟呢。Roselia和RAS一同行驶到了另外一个方向，至于HelloHappy、PP和Afterglow，她们在刚出发的时候就和我们失去联系了呢……\n\n“小真白最近还在找更多关于并行方舟时代的资料呢。我们定居下来以后，那些资料遭遇过一次自然飓风，好在抢救工作还算及时。那可能需要一点时间，等完成之后我们再说更多吧。\n\n“宇宙很大，感谢我们的再次相遇。有什么需要尽管和我提！”"
 mygo_story.552.a:0 "谢谢！"
 mygo_story.553.name:0 "不要再继续追寻"
 mygo_story.553.desc:0 "你犹豫了很久，最后还是接通了丰川祥子。\n\n“清除记忆了吗。”她显得有点无可奈何，“那就证明过去的事情对你来说已经不再重要了，爱音。想那么多没意义的事情，只会妨碍你继续做出正确的决策。\n\n“你能带着方舟从必死的绝境里逃出来，还能发展得像今天这么好，这证明了你在管理与领导上的才能。继续带着大家前进吧。”\n\n“我说了，不要再继续追寻那些虚无缥缈的事情了！”\n\n在你的再三追问下，她终于开始显得有些不耐烦：\n\n“当年到底发生了什么真的很重要吗？如果你愿意把我作为‘那个逃掉的人’，‘敌对方’之类的角色看待，那就这么做吧。\n\n“我不是很愿意再和你继续讨论这些。如果你要继续和我讨论关于在我方星域演出的事宜，我还是很有兴趣继续和你谈下去的——如果你还有空重新拿起你的吉他的话。”"
 mygo_story.553.a:0 "那就……这样吧。"


# BEGIN REVIEWED IMPORT localisation from mygo-reviewed-joint-live-bridge.txt
 mygo_story.554.name:0 "琴弦"
 mygo_story.554.desc:0 "你的吉他已经不再落灰了。\n\n五弦和六弦开始发黑，手指尖一开始还会感觉疼，现在已经习惯了。过去几个月，你会在休息日Live结束以后留在货舱，按照谱子偷偷练习。你也不知道自己在做什么。\n\n没有人知道，你也不想让她们知道。\n\n§L如果你还有空重新拿起你的吉他的话。§!\n\n你又想起来这句话。摇摇头，试图把这句话从自己脑子里划走。\n\n§H重新拿起你的吉他。§!\n\n等再练习几周，就和她们一起去演奏吧。"
 mygo_story.554.a:0 "先换弦吧。"
 mygo_story.555.name:0 "日常练习"
 mygo_story.555.desc:0 "货仓——现在是你的练习室了。\n\n你开始对着联合Live录像练习。实话讲，看着一个自己在台上演出的感觉真的很奇怪，但为了纠正自己的指法，让左手指在琴上立起来而不是趴下去、护弦更干净避免杂音，这些录像最好还是看一看——千早爱音，弹得真的很不错。\n\n今天的练习时间差不多也要结束了。就在你收拾好琴准备起身的时候——灯就站在门口。"
 mygo_story.555.a:0 "“Tomorin？怎么不叫我？”"
 mygo_story.556.name:0 "乐队邀约"
 mygo_story.556.desc:0 "“小爱……来一起演出！”\n\n高松灯抱着笔记本：\n\n“就演奏之前的曲子，我们曾经一同演奏过的，大家一起……\n\n“来组乐队！”\n\n灯吐气的声音在这个房间里清楚地回响。"
 mygo_story.556.a:0 "一起组乐队吧！"
 mygo_story.557.name:0 "Poppin'邀请"
 mygo_story.557.desc:0 "香澄再次接通通讯时，正抱着一只装满东西的箱子。\n\n“小爱音！有没有什么需要我帮忙的？食物、合金、航路图？虽然有咲刚刚说不可以全部答应但是我会偷偷全部塞给你——”\n\n箱子好像在画面外撞到了门框。香澄喊了声“哎呀”，手忙脚乱地先把视频挂掉了。\n\n“呐呐小爱音，要不要一起演出？”\n\n再接通时，她的第一句话变成了这个。"
 mygo_story.557.a:0 "演出……？"
 mygo_story.558.name:0 "Poppin'邀请"
 mygo_story.558.desc:0 "“演出~！我们最近也在开Live哦！呐呐小爱音，组乐队最能加深大家关系了~让大家全都Kirakira地在一起，做什么都会变得KiraKira的！”\n\n“来吧来吧！绝对没问题的！”香澄说，“我们从一起排练开始~！”\n\n说着，她就开始在日历上建立共享排期。popipapa地一阵乱点，很快这份预约就发送了过来——\n\n“太棒了小爱音！到时候大家都会很开心，呜耶！”户山香澄似乎要激动地原地转个圈，“哦对了！小爱音有什么事要找我吗？”"
 mygo_story.558.a:0 "嗯……我找你有什么事来着……"
 mygo_story.559.name:0 "望海临江战役"
 mygo_story.559.desc:0 "爽世把终端放在舰桥桌面上。屏幕朝向你，那是之前你和户山香澄……“敲定”……好的日程表。\n\n“我也要去吗？”她显得有些头疼与无奈。"
 mygo_story.559.a:0 "只是排练而已啦。再说，我们一直都在开Live吧？"
 mygo_story.560.name:0 "望海临江战役"
 mygo_story.560.desc:0 "“是你们四个人在开哦。”"
 mygo_story.560.a:0 "Soyorin也一直有在帮忙录像——"
 mygo_story.561.name:0 "望海临江战役"
 mygo_story.561.desc:0 "“所以你就擅自替我决定了？\n\n“先说好，我绝对不去。\n\n“演奏名单里不要写我。我不想弹，弹得也不好，我就给你们提供场外支援就可以了。”\n\n“……你就不怕到时候我把你强行拽到台上，Tomorin把贝斯塞给你，我再撩一下你的头发，然后你莫名其妙地就站在那里开始弹，最后大家一起哭这种事情发生吗？”\n\n你不知道从哪突然冒出来了这个创意，\n\n“我们的念诗就突然变成了演奏，大家围成一圈开始哭着即兴演奏，场面非常感人非常难忘，之后我们决定组一辈子乐队再也不分开……”\n\n“这是什么剧情啦？！”长崎素世脸上的表情完全控制不住了，“这么蠢的事情，亏你能想得出来。”"
 mygo_story.561.a:0 "总之不想让它发生的话就加入排练吧！"
 mygo_story.562.name:0 "望海临江战役"
 mygo_story.562.desc:0 "“……不要用CRYCHIC的名字。不要弹录像里的曲子。”\n\n她把终端推到一旁，眼睛死死地盯住你，\n\n“爱音，你想让祥子看见你还会弹吉他，那是你的事。\n\n“但是她肯定回不来了。CRYCHIC的旧时光也肯定回不来了！”\n\n你没有回答。\n\n“只参加这一次。”"
 mygo_story.562.a:0 "……好。"
 mygo_story.563.name:0 "排练"
 mygo_story.563.desc:0 "你们接通了Poppin'party的通讯。\n\n香澄离镜头特别近，只能看见她的半张脸。通讯接通的一瞬间，她爆发出了惊人的活力，简直要通过屏幕扑过来！\n\nPoppin'Party的练习室比迷子号的货舱窄一点，看上去也像是一个大仓库。\n\n墙上贴着很多便签，背景里甚至有很多盆栽和贴满了各种标签的纸盒。\n\n盆栽在这种环境里是怎么长大的？\n\n“听得到吗——小爱音——”"
 mygo_story.563.a:0 "非常清楚！"
 mygo_story.564.name:0 "排练"
 mygo_story.564.desc:0 "“呐呐！我现在在想，等我们一起举办live了，我和小灯要在天上飞起来~！”户山香澄突然开始眉飞色舞，“然后然后，我们就在观众的头顶上开始抛巧克力螺！弹到solo段的时候要开始喷火！嗷呜——”\n\n“香澄！！！！”画面对面的键盘手似乎有些拿她没办法，“非常抱歉，大家，我们开始排练吧……”"
 mygo_story.564.a:0 "我们开始吧……？"
 mygo_story.565.name:0 "旧日记"
 mygo_story.565.desc:0 "筑紫从Morfonica的档案修复室发来通讯。\n\n“我们找到一点有意思的东西——灯的手写笔记！\n\n“很抱歉，但是飓风影响……它受损有点严重。上面写的东西很混乱，有些页连前后顺序都不确定，我们这边没法完整整理出来。\n\n“可以请你们一起确认吗？”"
 mygo_story.565.a:0 "Tomorin——有人找你！"
 mygo_story.566.name:0 "大魔典"
 mygo_story.566.desc:0 "来自Morfonica的通讯。\n\n画面上，扫描光从纸面左侧缓慢移过。\n\n风暴带来的水痕遮住了纸面上的大部分句子，剩下的部分也全部都充斥着杂乱的线条，简笔画，不成语句又团在一起的词语。\n\n这是灯的旧笔记。\n\n真白抱着另一本旧册子坐在频道另一端。封皮受过潮，四角向上翘着：\n\n“以前小灯写完以后，会把本子推给我看哦。”\n\n灯看向屏幕里的册子。\n\n“欸？我，我那时候，都写了什么？”\n\n真白翻了几页，纸页摩擦的声音传过来。\n\n“很多哦。石头、走廊、星群，还有巨大的黑洞！”\n\n“真白写了什么？”\n\n“这个……”\n\n她突然涨红了脸。\n\n“这个……这个这个……”\n\n画面里，二叶筑紫憋着笑，冲着你做手势示意赶紧离开，把频道留给她们两个秘密交谈。"
 mygo_story.566.a:0 "血色玫瑰人生……"
 mygo_story.567.name:0 "终点？"
 mygo_story.567.desc:0 "灯和仓田真白的通话有一些意外收获。\n\n在旧笔记的零碎记录里，真白和灯发现了一份旧航路表。在一颗特殊的恒星附近，有一个奇怪的标记。\n\n旧地图上写着的设施名称是：\n\n§Y第一太空休息区。§!\n\n“啊，是这里……！”\n\n真白显得有些激动，\n\n“好怀念！好久没有回去过了……那里有什么呢~这个我要保密！你们有时间的话就去看一看吧！\n\n“唔，就当是替我们回去看啦。”"
 mygo_story.567.ask:0 "欸？小真白你们不一起吗？"
 mygo_story.567.ask.response:0 "我这边还在救灾当中啦，实在抱歉！\n\n而且，既然已经定居下来了，我们的活动就没那么自由啦。小灯有时间一定要过来玩！\n\n好怀念过去的时光~！"
 mygo_story.567.a:0 "向着下一个星尘信标，迷子号前进！"
# END REVIEWED IMPORT localisation from mygo-reviewed-joint-live-bridge.txt

# BEGIN REVIEWED IMPORT: Earth aftermath and MyGO renaming
 NAME_MyGO_Renamed_Country:0 "MyGO"
 mygo_story.640.name:0 "我们是不是变聪明了"
 mygo_story.640.desc:0 "今天，召开了地球探索结束后的第一次舰桥会议。\n\n主屏幕上只有四个词：\n\n§YHappy！Lucky！Smile！Yeah！§!\n\n“这是什么？”立希问。\n\n你清了清嗓子：\n\n“我们今后的国家战略。”\n\n爽世把椅子往后挪了一点：“这是从哪抄袭来的？”\n\n“显而易见。地球已经收不到任何广播了！那些写在节目单、广告牌和旧影像里的话，再也等不到原来的听众，连蟑螂都没剩下。”\n\n你把巡演星图调出来。已建立通讯的国家亮在航路两侧，还有更多恒星挤在地图边缘，\n\n“我们要去巡演！把目标定得大一点，要像前辈们那样，把这份能量……带给所有人！”\n\n灯抬起头：“要怎么……带给所有人？”\n\n“演奏！开live！一起变得闪闪发光心动不已——”\n\n“……小爱音……散会后，陪我去检查一下脑科。”长崎素世的嘴角在疯狂抽搐。\n\n乐奈趴在桌边，朝她看了一会儿：\n\n“live！”"
 mygo_story.640.a:0 "巡演是我们的重点项目！！！"
 mygo_story.641.name:0 "迷茫也没问题……"
 mygo_story.641.desc:0 "会议议程进入第二项。你把屏幕切到下一页：\n\n那是一个大大的名字，§YMAIGO§!。\n\n你盯着那五个字母看了一会儿，删掉了中间的AI。\n\n§YMyGO§!\n\n“有什么区别？”立希问。\n\n“不觉得更酷了吗？这么好的创意！香澄学姐她们不在自己的国家外live，小真白忙得没法演出，更别说小祥……现在这个银河的舞台是我们的了！所以是My go！！”\n\n“你刚刚才想到的吧。”\n\n“但就是很酷，对吧对吧？”\n\n灯在自己的笔记本上照着写了一遍，小写的y拖出很长一笔。\n\n乐奈从她身后探出头：“MyGO。好听。”\n\n爽世看着登记表：“那后面的五个感叹号又是什么？”\n\n“我们有五个人。”"
 mygo_story.641.a:0 "MyGO！！！！！"
 mygo_story.642.name:0 "迷茫也要前行！"
 mygo_story.642.desc:0 "“这里是MyGO!!!!!。”\n\n频道状态栏下方，旧的§YMAIGO LIVE INTERNAL§!闪烁两次，更新成了§YMYGO LIVE INTERNAL§!。\n\n这一刻，历史发生了剧变……\n\n你知道，以前的乐队少女们现在正被各种俗世事务积压，难以重返舞台。\n\n所以是时候由你们再重新开启大少女乐团时代了！\n\n以“纵使迷茫也要前进”作为你们的信条，把音乐播撒到全银河吧！"
 mygo_story.642.a:0 "下一站也会有人听见！"
# END REVIEWED IMPORT: Earth aftermath and MyGO renaming

# BEGIN REVIEWED IMPORT localisation from mygo-reviewed-earth-beacon.txt
 mygo.201.a:0 "开始降落吧。"
 mygo.202.a:0 "那就去RiNG看一看吧。"
 mygo.203.a:0 "去防灾中心看看吧。"
 mygo.204.name:0 "防灾中心"
 mygo.204.desc:0 "旧防灾中心看起来像一个巨大的鸡蛋壳。这个比喻非常准确，因为我们发现那个时候防灾中心还有一个别名，叫作§Y东京巨蛋§!。\n\n防灾中心的内部有规模巨大的避难所，还有负责接收离港方舟定期回传的数据中心。数据中心一直运作到方舟驶离地球的几年后。\n\n我们找到了关于迷子号的档案。在贴在墙上的设计图里，迷子号看上去就像一根长长的木棍，上面穿着一只柠檬。\n\n从图纸上看，迷子号被剥离出去的A3到A7区段在设计上就是用于主动脱离并寻找新殖民地的。但这与我们后来在内乱中出现的爆破分离自相矛盾。"
 mygo.204.a:0 "小祥……头好疼……"
 mygo.205.name:0 "毁灭日"
 mygo.205.desc:0 "我们找到了很多关于灾难发生的影像资料。\n\n火光在大地上四起，流动的焰从地面飞上高空。\n\n雨从脚下向天上倒流，飞到半空就变成了赤焰，重重地砸向云端。\n\n哭喊声，落石，在轰鸣中倒塌的废墟。\n\n铁锈味充斥起鼻腔。那是混杂着灰尘与烟的味道，是这座城市最后的气息——\n\n也是这颗星球最后的气息。\n\n人类所能做的最后一件事，是在灾难中把人们送上太空，送到比地球更安全的方舟之上。"
 mygo.205.a:0 "……"
 mygo.206.name:0 "方舟开拔之日"
 mygo.206.desc:0 "方舟开拔之日，晴空万里，但方舟自己就能将太阳光遮蔽。\n\n在地球轨道上的方舟一望无际。每一条方舟都能装下一整个文明，装下音乐，装下对未来的小小期待，装下启程的每一个人。\n\n爱音舰长意气风发，仿佛启航时就已经把一切困难全部扫平了。\n\n新世界是什么样？没有人知道。但所有人都相信，在少女乐队的带领下，人类会延续下去的。"
 mygo.206.a:0 "而今天，我们回来了。"
 mygo_story.207.name:0 "爆破栓"
 mygo_story.207.desc:0 "§H丰川祥子。千早爱音。§!\n\n§L爆破栓。§!\n\n自从重新想起了丰川祥子的事，你的头一天比一天疼了。\n\n被剥离出去的区段。\n\n§L“如果必须要有人来当这个坏人，那我希望，这个人是我。”§!\n\n是什么时候？谁说了这样的话？\n\n杂乱的人群，火光，喊声，巨大的爆炸声——\n\n以及爆炸在真空中断开，戛然而止的瞬间。\n\n这些声音在你的耳畔反复出现，一遍又一遍。\n\n你掐住了自己的太阳穴。"
 mygo_story.207.a:0 "我没事……"
# END REVIEWED IMPORT localisation from mygo-reviewed-earth-beacon.txt

# APPROVED DIPLOMACY IMPORT: Morfonica
 MYGO_MORFONICA_NEUTRAL_GREETING_01:0 "迷子号的识别信号很清楚哦。请问这次需要Morfonica做什么？"
 MYGO_MORFONICA_NEUTRAL_GREETING_02:0 "月之森财团和我们之间没什么关系，还请不要误会……"
 MYGO_MORFONICA_NEUTRAL_GREETING_03:0 "小灯最近还在写吗？如果她愿意的话，可以把新的那一本也给我看看。"
 MYGO_MORFONICA_NEUTRAL_GREETING_04:0 "苍蝶高原今天有强侧风。没什么，只是想让你知道。"
 MYGO_MORFONICA_NEUTRAL_GREETING_05:0 "透子说小爱音直接飞过来看她也没关系，但请不要听她的！"
 MYGO_MORFONICA_FRIENDLY_GREETING_01:0 "小灯在吗？我写到一半，有一部分不知道该不该留下来……想先给她看看。"
 MYGO_MORFONICA_FRIENDLY_GREETING_02:0 "小爱音！客房已经整理好了。窗外能看到高原的云层……晚上会很冷，多带一件衣服。快来。"
 MYGO_MORFONICA_FRIENDLY_GREETING_03:0 "今天透子说，她有点想你了。"
 MYGO_MORFONICA_FRIENDLY_GREETING_04:0 "月之森财团和我们之间没什么关系。我也很讨厌那群人，是她们胁迫了小祥……"
 MYGO_MORFONICA_FRIENDLY_GREETING_05:0 "好怀念过去和你一起的时光……"
 MYGO_MORFONICA_HOSTILE_GREETING_01:0 "……早，爱音小姐。"
 MYGO_MORFONICA_HOSTILE_GREETING_02:0 "爱音小姐，月之森财团企业的那帮家伙和我们之间没什么关系，还请不要误会并做出敌对行为。"
 MYGO_MORFONICA_HOSTILE_GREETING_03:0 "我不想把以前的相遇拿来替你现在的行为辩解。"
 MYGO_MORFONICA_HOSTILE_GREETING_04:0 "小灯的频道不会被关闭，和你的频道是另一回事。"
 MYGO_MORFONICA_HOSTILE_GREETING_05:0 "你没有过去的爱音好。一点也不如。"
 MYGO_MORFONICA_WAR_GREETING_01:0 "就算是我这种人，也不会屈服于你们的！"
 MYGO_MORFONICA_WAR_GREETING_02:0 "我很害怕。但Morfonica的舰队会执行防御命令！"
 MYGO_MORFONICA_WAR_GREETING_03:0 "不要靠近居民区。那里没有你们要找的答案。"
 MYGO_MORFONICA_WAR_GREETING_04:0 "如果小灯也在舰桥上，告诉她离舷窗远一点。"
 MYGO_MORFONICA_WAR_GREETING_05:0 "我会永远记住这一刻，爱音。"
 MYGO_MORFONICA_DOW_PROPOSE_01:0 "“最后一份交涉记录已经封存。”\n\n“Morfonica将与你们进入战争状态。我们会保护自己，哪怕代价是你们的全部！”"
 MYGO_MORFONICA_DOW_ACCEPT_01:0 "“我知道了。”\n\n“我不想在这种时候提起从前。舰队已经进入防御位置，哪怕是我这种人！我不会让你们越过哪怕一座炮台！”"
 MYGO_MORFONICA_PEACE_PROPOSE_01:0 "“伤员转运和失踪船只的搜寻都需要稳定航道。”\n\n“请停火，哪怕是为了迷子号的船员们！”"
 MYGO_MORFONICA_PEACE_CONSIDER_01:0 "“请稍等。筑紫和瑠唯正在核对边界、撤离时限和人员交换名单。”"
 MYGO_MORFONICA_PEACE_ACCEPT_01:0 "“协议通过了。所有舰队会在确认对方撤离后停火。”\n\n“爱音小姐……至少今天，不会再有人因为我们下达的命令受伤了。”"
 MYGO_MORFONICA_PEACE_DECLINE_01:0 "“我们不能接受！我们会继续战斗，直到彻底打败你，粉色的怪物！”"
 mygo_morfonica_war_status_quo_first.desc:0 "“小灯的名字不在伤员上面。”\n\n“我们的未来是可以修复的，爱音小姐。”"
 mygo_morfonica_war_lost_first.desc:0 "“Morfonica会履行停战条款。爱音……我不想再看见你。”"
 mygo_morfonica_war_won_first.desc:0 "“条款不会再追加。把受损的船带走吧，爱音。”"
 mygo_morfonica_second_war.desc:0 "“我们的怒火，马上要烧到你的甲板上！”\n\n“超空间引擎，启动！”"
 mygo_morfonica_postwar_first_contact.desc:0 "“爱音。你们有什么事？”"
 MYGO_MORFONICA_TRADE_PROPOSE_01:0 "小爱音，这是我们提出的方案！"
 MYGO_MORFONICA_TRADE_CONSIDER_01:0 "请等一下。七深说这个价格很普通，但她说的普通……有时候不太可信呢。"
 MYGO_MORFONICA_TRADE_ACCEPT_01:0 "核对完成。谢谢你，小爱音。"
 MYGO_MORFONICA_TRADE_DECLINE_01:0 "很抱歉，这些超出了Morfonica的承受范围。"
 MYGO_MORFONICA_GIFT_ACCEPT_01:0 "真的可以收下吗？谢谢你们，谢谢你，爱音！"
 MYGO_MORFONICA_OPEN_BORDERS_01:0 "民用航道已经向迷子号开放。欢迎你来。"
 MYGO_MORFONICA_CLOSE_BORDERS_01:0 "边境暂时关闭。已经入境的船只可以沿原航线离开。"
 MYGO_MORFONICA_EMBASSY_ACCEPT_01:0 "使馆用房在档案馆外侧。那里很安静，放心休息，爱音。"
 MYGO_MORFONICA_EMBASSY_DECLINE_01:0 "嗯……再考虑一下，小爱音？"
 MYGO_MORFONICA_RECALL_EMBASSY_01:0 "工作人员和私人资料会安全送回，爱音，注意接收。"
 MYGO_MORFONICA_RESEARCH_PROPOSE_01:0 "我很希望能再听到小灯的声音。她的想法很有价值……"
 MYGO_MORFONICA_RESEARCH_ACCEPT_01:0 "协议通过。谢谢你，小爱音！"
 MYGO_MORFONICA_RESEARCH_DECLINE_01:0 "唔，暂时不行，抱歉。"
 MYGO_MORFONICA_RESEARCH_BREAK_01:0 "共享终端将在本周期结束后关闭。小灯……"
 MYGO_MORFONICA_COMMERCIAL_PROPOSE_01:0 "要交换演出无料吗？"
 MYGO_MORFONICA_COMMERCIAL_ACCEPT_01:0 "可以哦。要注意一下！透子负责的宣传页需要另外送审，千万不能直接发布！"
 MYGO_MORFONICA_COMMERCIAL_DECLINE_01:0 "暂时不行。希望爱音你能理解。"
 MYGO_MORFONICA_COMMERCIAL_BREAK_01:0 "我觉得，自己处理自己的事情比较好……"
 MYGO_MORFONICA_MIGRATION_PROPOSE_01:0 "迷子号的大家要是累了，随时来高原定居！"
 MYGO_MORFONICA_MIGRATION_ACCEPT_01:0 "高原昼夜温差很大，请把适应说明一起发给居民。"
 MYGO_MORFONICA_MIGRATION_DECLINE_01:0 "现在不能答应。爱音，希望你能理解。"
 MYGO_MORFONICA_MIGRATION_BREAK_01:0 "移民协议会终止的。虽然我不想这么做。"
 MYGO_MORFONICA_NAP_ACCEPT_01:0 "其实我觉得，我们之间不需要签这个！"
 MYGO_MORFONICA_NAP_DECLINE_01:0 "有一些事还没有得到解释，爱音。现在签字太早了。"
 MYGO_MORFONICA_NAP_BREAK_01:0 "互不侵犯协议已经终止。爱音……你们会攻击我吗？"
 MYGO_MORFONICA_DEFENSIVE_ACCEPT_01:0 "小爱音！有你在，我们都会更安全的！"
 MYGO_MORFONICA_DEFENSIVE_DECLINE_01:0 "Morfonica不会接受这份条约……抱歉。"
 MYGO_MORFONICA_DEFENSIVE_BREAK_01:0 "共同防御义务到此结束。爱音，我们之间。"
 MYGO_MORFONICA_FEDERATION_INVITE_01:0 "恢复我们过去的友情吧！迷子号，愿意加入吗？"
 MYGO_MORFONICA_FEDERATION_ACCEPT_01:0 "成员表决已经完成！Morfonica愿意加入。"
 MYGO_MORFONICA_FEDERATION_DECLINE_01:0 "我们目前不能加入。还不可以。"
 MYGO_MORFONICA_FEDERATION_LEAVE_01:0 "退出程序已经启动。又一次分开了，爱音……"
 MYGO_MORFONICA_WAYSTATION_PROPOSE_01:0 "迷子号驿站！听起来很棒~"
 MYGO_MORFONICA_WAYSTATION_ACCEPT_01:0 "选址通过。我们会协助补给和维修窗口！"
 MYGO_MORFONICA_WAYSTATION_DECLINE_01:0 "暂时不行，爱音。"
 MYGO_MORFONICA_WAYSTATION_BREAK_01:0 "驿站许可已撤销，爱音，你们的设备可在宽限期内拆除转运。"
 MYGO_MORFONICA_SUBJUGATE_PROPOSE_01:0 "这份协议会为迷子号居民提供长期保护。请完整阅读！"
 MYGO_MORFONICA_SUBJUGATE_DECLINE_01:0 "Morfonica暂时还不会把自己的居民和档案交给迷子号管理。"
 MYGO_MORFONICA_BECOME_SUBJECT_ACCEPT_01:0 "表决已经通过。靠你了，小爱音。"
 MYGO_MORFONICA_ACCEPT_SUBJECT_01:0 "我们会履行保护义务。站在我的身后，小爱音！"
 MYGO_MORFONICA_RELEASE_SUBJECT_01:0 "小爱音，我们之间的协议暂时解除了。"
 MYGO_MORFONICA_ASK_RELEASE_01:0 "那个，小爱音！我们请求结束从属条款！"
 MYGO_MORFONICA_SECRET_FEALTY_01:0 "小爱音……我们偷偷地……"
 MYGO_MORFONICA_RIVAL_PROPOSE_01:0 "爱音！你把以前我们的同行看成什么了？"
 MYGO_MORFONICA_RIVAL_END_01:0 "爱音，谢谢你没有忘掉我们的过去……"
 MYGO_MORFONICA_INSULT_01:0 "爱音小姐，连透子都比你现在可靠！"
 MYGO_MORFONICA_GUARANTEE_01:0 "我们不会独自面对入侵！"
 MYGO_MORFONICA_SUPPORT_INDEPENDENCE_01:0 "救命！！"
 contract_mygo_composition_issued_morfonica:0 "Morfonica发来一批刚从受潮档案中分离出来的纸页。扫描件满是水痕、折角。看来真白的旧歌词只剩下几个能够辨认的句子了。她们需要灯帮忙识别歌词。\n\n瑠唯在说明末尾写道：§L“请以现存片段完成一份可以演奏的新稿。”§!"
 mygo_morfonica_composition_accept.desc:0 "真白把两本册子并排放在扫描台上。\n\n“帮我看看这个！”"
 contract_mygo_composition_completed_morfonica:0 "谢谢你！我们马上就演奏这首歌！"
 contract_mygo_composition_failed_morfonica:0 "受损纸页重新回到恒湿匣。或许没人能知道它们是什么了。\n\n最后一栏写着：§L等待下一次可用扫描。§!"
 contract_mygo_performance_issued_morfonica:0 "飓风修复后的礼堂需要一场新的live来振奋人心。\n\n“我们想用一次真正的演出来重新启动它！如果迷子号愿意来的话。”"
 mygo_morfonica_performance_accept.desc:0 "筑紫把场地、泊位和排练时间逐项确认好了。\n\n就等你们来。"
 contract_mygo_performance_completed_morfonica:0 "最后一个音落下后，礼堂的回声沿新修复的侧墙返回舞台。\n\n真白站在幕布后听着观众席连绵不绝的掌声。"
 contract_mygo_performance_failed_morfonica:0 "预定演出未能举行，礼堂恢复为空载测试模式，舞台灯一排排熄灭。\n\n人们都很失望。已经印好的节目单被收进下一场活动的纸箱底部，用来防潮。"
 contract_mygo_tour_issued_morfonica:0 "Morfonica把数座高原殖民地列入巡演路线。部分站点仍在重建，主要的舞台包括正式礼堂、临时风障舞台和档案馆中庭。\n\n“要来吗，和我们一起演奏！”"
 mygo_morfonica_tour_accept.desc:0 "巡演路线确认！真白上传了一份空白记录册，Morfonica将暂时与你们一同前行。\n\n“联合live！真让人期待……”"
 contract_mygo_tour_completed_morfonica:0 "巡演圆满完成。真白的眼角泛着泪水。安可曲目更是见证着你们一路的笑与泪。\n\n真白和灯久久不愿意分开：§L下一次也要一起演出！§!"
 contract_mygo_tour_failed_morfonica:0 "未抵达站点的页面，路线状态旁标注了“暂时中止活动”。\n\n你知道，对少女乐队来说，“暂时”的意思就是“永远”了。"

# APPROVED DIPLOMACY IMPORT: Tsukinomori
 MYGO_TSUKINOMORI_NEUTRAL_GREETING_01:0 "迷子号的频道已接入。说明来意吧，爱音。"
 MYGO_TSUKINOMORI_NEUTRAL_GREETING_02:0 "我们正在处理本周期排期。你们若要靠港，现在提交申请。"
 MYGO_TSUKINOMORI_NEUTRAL_GREETING_03:0 "航行状态报告收到了。有什么不懂的可以找我问。"
 MYGO_TSUKINOMORI_NEUTRAL_GREETING_04:0 "如果是旧事，不必开口。"
 MYGO_TSUKINOMORI_NEUTRAL_GREETING_05:0 "爱音，你继续说。"
 MYGO_TSUKINOMORI_FRIENDLY_GREETING_01:0 "爱音，不要迟到。我等你。"
 MYGO_TSUKINOMORI_FRIENDLY_GREETING_02:0 "还是想问关于过去的事？那好吧……你想知道什么？"
 MYGO_TSUKINOMORI_FRIENDLY_GREETING_03:0 "灯的新词我看过了。写得还是那么好。"
 MYGO_TSUKINOMORI_FRIENDLY_GREETING_04:0 "为什么国家名要叫月之森？那和Morfonica其实没有很大关系……"
 MYGO_TSUKINOMORI_FRIENDLY_GREETING_05:0 "你最近的吉他没有退步。仅此而已。"
 MYGO_TSUKINOMORI_HOSTILE_GREETING_01:0 "爱音。你想说什么？"
 MYGO_TSUKINOMORI_HOSTILE_GREETING_02:0 "爱音，把舰队撤出边界。不要让我重复。"
 MYGO_TSUKINOMORI_HOSTILE_GREETING_03:0 "过去不能替你们抵扣现在造成的损失。"
 MYGO_TSUKINOMORI_HOSTILE_GREETING_04:0 "如果迷子号准备继续试探底线，至少先计算自己能否承担结果。"
 MYGO_TSUKINOMORI_HOSTILE_GREETING_05:0 "爱音，你还有一次把话说清楚的机会。"
 MYGO_TSUKINOMORI_WAR_GREETING_01:0 "爱音，停火条件走军事频道。有话快说。"
 MYGO_TSUKINOMORI_WAR_GREETING_02:0 "迷子号的航行习惯没有变。不要总以为下一次还能从缺口逃出去。"
 MYGO_TSUKINOMORI_WAR_GREETING_03:0 "爱音，指挥你的舰队。来击败我。"
 MYGO_TSUKINOMORI_WAR_GREETING_04:0 "爱音，堂堂正正在战场上打败我。"
 MYGO_TSUKINOMORI_WAR_GREETING_05:0 "你想谈就提交条件；想战斗就关闭频道。"
 MYGO_TSUKINOMORI_DOW_PROPOSE_01:0 "“最后通牒的时限已经结束。”\n\n“月之森企业联盟将与你们进入战争状态。爱音，这一次的决定和过去无关。看清现在的舰队，再作出你的判断。”"
 MYGO_TSUKINOMORI_DOW_ACCEPT_01:0 "“宣战书收到。”\n\n“你既然以迷子号执政官的身份作出决定，我就以月之森代表的身份回答。”\n\n“舰队，进入战斗位置。”"
 MYGO_TSUKINOMORI_PEACE_PROPOSE_01:0 "“继续交战不会改善任何一方的条件。”\n\n“爱音，停火方案已经发送。确认边界、交换伤员，然后结束这场战争。”"
 MYGO_TSUKINOMORI_PEACE_CONSIDER_01:0 "“董事会正在核对你们是否有能力履行这些条件。等结果。”"
 MYGO_TSUKINOMORI_PEACE_ACCEPT_01:0 "“条件有效。舰队将在撤离确认后停止射击。”\n\n“爱音，来把你的人带回去。”"
 MYGO_TSUKINOMORI_PEACE_DECLINE_01:0 "“爱音，这份条件我们拒绝。”"
 mygo_tsukinomori_war_status_quo_first.desc:0 "“战争结束。爱音，谁也没有赢。”"
 mygo_tsukinomori_war_lost_first.desc:0 "“条款会执行。”\n\n“你赢了，爱音。但是记住，胜利不是你的答案。”"
 mygo_tsukinomori_war_won_first.desc:0 "“带着还能航行的船离开。爱音，停战条款已经足够。我不会再追加。”"
 mygo_tsukinomori_second_war.desc:0 "“开始作战，爱音。堂堂正正战胜我。”"
 mygo_tsukinomori_postwar_first_contact.desc:0 "“普通频道已经恢复，爱音。”"
 MYGO_TSUKINOMORI_TRADE_PROPOSE_01:0 "爱音，价格、交付窗口和违约责任都在附件里。确认你们的仓储能力以后再签。"
 MYGO_TSUKINOMORI_TRADE_CONSIDER_01:0 "我个人认为，这是不错的提议。"
 MYGO_TSUKINOMORI_TRADE_ACCEPT_01:0 "条件可以执行。合同成立。"
 MYGO_TSUKINOMORI_TRADE_DECLINE_01:0 "爱音，收益不足以覆盖护航和延误风险。驳回。"
 MYGO_TSUKINOMORI_GIFT_ACCEPT_01:0 "谢谢。如果是念及旧情的救济，就不必了……但是谢谢。"
 MYGO_TSUKINOMORI_OPEN_BORDERS_01:0 "迷子号获准使用月之森财团的民用航道。"
 MYGO_TSUKINOMORI_CLOSE_BORDERS_01:0 "通行许可已经撤销。宽限期结束前离境。"
 MYGO_TSUKINOMORI_EMBASSY_ACCEPT_01:0 "使馆申请通过。人员名单和设备清单请提前登记。欢迎你来，爱音。"
 MYGO_TSUKINOMORI_EMBASSY_DECLINE_01:0 "常驻使馆没有必要。现有加密频道足够处理事务。我足够了解你。"
 MYGO_TSUKINOMORI_RECALL_EMBASSY_01:0 "使馆将在四十八小时内关闭。工作人员不会被扣留。"
 MYGO_TSUKINOMORI_RESEARCH_PROPOSE_01:0 "爱音，“迷子号”的方舟维护数据，对我来说完全不是秘密哦。"
 MYGO_TSUKINOMORI_RESEARCH_ACCEPT_01:0 "协议生效。爱音，虽然有点难以启齿，但这让我有点回忆起以前的事情了。"
 MYGO_TSUKINOMORI_RESEARCH_DECLINE_01:0 "拒绝。CRYCHIC号上的任何地方我都了如指掌。这点你比我更清楚。"
 MYGO_TSUKINOMORI_RESEARCH_BREAK_01:0 "联合项目停止。已完成成果按原权属保留。"
 MYGO_TSUKINOMORI_COMMERCIAL_PROPOSE_01:0 "我可以为迷子号提供固定采购、演出结算和长期维修窗口。爱音，这对你有好处。"
 MYGO_TSUKINOMORI_COMMERCIAL_ACCEPT_01:0 "商业协议通过。爱音，商业区没有大改的话，我就按照以前的规范来对接了。"
 MYGO_TSUKINOMORI_COMMERCIAL_DECLINE_01:0 "爱音，这个我得拒绝。抱歉。"
 MYGO_TSUKINOMORI_COMMERCIAL_BREAK_01:0 "协议终止。又多了一批坏账……"
 MYGO_TSUKINOMORI_MIGRATION_PROPOSE_01:0 "迷子号需要稳定的下船与返航程序，月之森的那群没良心的家伙……偶尔也确实想回去看看。"
 MYGO_TSUKINOMORI_MIGRATION_ACCEPT_01:0 "协议通过。那群人当初那么急着逃离，现在又这样贴回来……真是荒诞。"
 MYGO_TSUKINOMORI_MIGRATION_DECLINE_01:0 "爱音，我不想让那群把CRYCHIC炸开的家伙这么轻易地回去。抱歉。"
 MYGO_TSUKINOMORI_MIGRATION_BREAK_01:0 "停止受理新申请。哈，无所谓了。"
 MYGO_TSUKINOMORI_NAP_ACCEPT_01:0 "互不侵犯协议成立。希望你这次能老老实实在签字前读完，爱音。"
 MYGO_TSUKINOMORI_NAP_DECLINE_01:0 "暂时不行。我们之间的差异还是更大一些。"
 MYGO_TSUKINOMORI_NAP_BREAK_01:0 "协议终止。边境舰队会重新部署。"
 MYGO_TSUKINOMORI_DEFENSIVE_ACCEPT_01:0 "共同防御成立。我们本来就是一体，这样对我们都有好处。"
 MYGO_TSUKINOMORI_DEFENSIVE_DECLINE_01:0 "我不会为笨蛋爱音没有边界的航线承担全部战争风险。"
 MYGO_TSUKINOMORI_DEFENSIVE_BREAK_01:0 "防御义务已经解除，但我希望我们仍能站在一边。"
 MYGO_TSUKINOMORI_FEDERATION_INVITE_01:0 "联盟吧，你和我一起。我信任你。"
 MYGO_TSUKINOMORI_FEDERATION_ACCEPT_01:0 "我信任你。和你一起，不会有问题。"
 MYGO_TSUKINOMORI_FEDERATION_DECLINE_01:0 "爱音，或许我们还没有那么多利益上的共同点。"
 MYGO_TSUKINOMORI_FEDERATION_LEAVE_01:0 "退出已经提交。结束了，又一次……"
 MYGO_TSUKINOMORI_WAYSTATION_PROPOSE_01:0 "固定驿站。或许你们也能在这里补给，乃至定居。"
 MYGO_TSUKINOMORI_WAYSTATION_ACCEPT_01:0 "选址批准。爱音，欢迎。"
 MYGO_TSUKINOMORI_WAYSTATION_DECLINE_01:0 "暂时不行。换个时间再来。"
 MYGO_TSUKINOMORI_WAYSTATION_BREAK_01:0 "驿站合同终止。爱音，……去别的地方吧。"
 MYGO_TSUKINOMORI_SUBJUGATE_PROPOSE_01:0 "我的领导一直都比你更好，过去是，现在也是。让我来帮你吧。"
 MYGO_TSUKINOMORI_SUBJUGATE_DECLINE_01:0 "爱音，我的指挥不在你之下。恕我拒绝。"
 MYGO_TSUKINOMORI_BECOME_SUBJECT_ACCEPT_01:0 "我相信你的决定，爱音。服从你的领导。"
 MYGO_TSUKINOMORI_ACCEPT_SUBJECT_01:0 "爱音，从现在起，一切都听我的。我是更好的舰长。"
 MYGO_TSUKINOMORI_RELEASE_SUBJECT_01:0 "监管期限结束。爱音，证明你能比我做得更好。"
 MYGO_TSUKINOMORI_ASK_RELEASE_01:0 "爱音，我能做得更好。相信我，让我们重新并肩作战。"
 MYGO_TSUKINOMORI_SECRET_FEALTY_01:0 "爱音，…………帮帮我。……求你。"
 MYGO_TSUKINOMORI_RIVAL_PROPOSE_01:0 "爱音，……我们之间的故事真是复杂，对吧？"
 MYGO_TSUKINOMORI_RIVAL_END_01:0 "爱音，……我们能重归于好，对吧？"
 MYGO_TSUKINOMORI_INSULT_01:0 "爱音，你永远都没有我更好地领导CRYCHIC。"
 MYGO_TSUKINOMORI_GUARANTEE_01:0 "爱音……"
 MYGO_TSUKINOMORI_SUPPORT_INDEPENDENCE_01:0 "舰队部署和撤离坐标已经准备好。决定脱离时，按计划行动，不要临时发挥。爱音……我们又一次站在一起了。"
 contract_mygo_composition_issued_tsukinomori:0 "月之森发来一份编曲工程文件，附件里只有祥子的一句说明：\n\n§L“和我一起完成这首歌。”§!"
 mygo_tsukinomori_composition_accept.desc:0 "“接受通知确认。”\n\n“让立希来。”"
 contract_mygo_composition_completed_tsukinomori:0 "“可以。不错的曲子。”"
 contract_mygo_composition_failed_tsukinomori:0 "合同到期，空白的音频轨道仍然没有内容。\n\n失败通知没有责问，只列出合同编号和下一次可重新申请的日期。"
 contract_mygo_performance_issued_tsukinomori:0 "月之森在主殖民地为迷子号安排了一场正式演出。舞台、泊位、安保和转播窗口已经写进同一份排期，她就像过去一样，把你们的行程一手包办。\n\n“如果要来，就按时抵达。不来也没关系。”"
 mygo_tsukinomori_performance_accept.desc:0 "接受通知发出后，月之森终端立即开放排练时段。\n\n“加油。不要紧张。”"
 contract_mygo_performance_completed_tsukinomori:0 "演出结束。据说丰川祥子在舞台的后台欣慰地笑了。"
 contract_mygo_performance_failed_tsukinomori:0 "预定时段结束，舞台切换给了下一项公共活动。\n\n祥子没有另发别的消息。"
 contract_mygo_tour_issued_tsukinomori:0 "丰川祥子发来了一条覆盖工业城、极地港与边境星域的完整巡演路线。她甚至在企划书中标注了后台休息室里M豆的颜色要求。\n\n“很多人都在等你们的演出……每个地方等你们的人都不一样。要来吗？”"
 mygo_tsukinomori_tour_accept.desc:0 "整条路线转为执行状态。丰川祥子不愿意一同登台，她说CRYCHIC已经结束了。\n\n“她们等待的不是我。”"
 contract_mygo_tour_completed_tsukinomori:0 "巡回演出获得了很强的反响。传闻有不少人准备移民重回迷子号。"
 contract_mygo_tour_failed_tsukinomori:0 "§L巡回演出未执行完毕。§!丰川祥子只发来了这一段话。"

