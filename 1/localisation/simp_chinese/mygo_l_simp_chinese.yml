 resolution_mygo_galactic_tour_planet_initiative:0 "巡演星球振兴倡议"
 resolution_mygo_galactic_tour_planet_initiative_desc:0 "星海巡演不应只留下转瞬即逝的广播。共同体将承认并支持每一颗举办过MyGO巡演的星球，使演出留下的社会与文化影响继续发展。"
 resolution_mygo_galactic_tour_planet_initiative_tooltip:0 "共同体成员获得凝聚力和贸易额加成，并缩短巡演合约的发布冷却。所有拥有§Y$mygo_tour_visited$§!标记的星球获得§Y$mygo_resolution_tour_planet_bonus$§!修正；该效果会追溯已经完成过的巡演站点。"

 resolution_mygo_galactic_tour_mutual_benefit:0 "跨国巡演互惠公约"
 resolution_mygo_galactic_tour_mutual_benefit_desc:0 "完整承办一轮星海巡演将成为共同体认可的文化成就。成功完成三站巡演的国家可以长期利用演出留下的贸易、团结与外交影响。"
 resolution_mygo_galactic_tour_mutual_benefit_tooltip:0 "完整完成过一轮MyGO巡演的共同体成员获得§Y$mygo_resolution_tour_host_country$§!修正。MyGO执行巡演合约期间获得§Y$mygo_resolution_tour_route_guarantee$§!修正。"

 resolution_mygo_galactic_tour_public_stage_fund:0 "银河公共舞台基金"
 resolution_mygo_galactic_tour_public_stage_fund_desc:0 "共同体将建立常设文化基金，为跨国演出提供设备、转播与交通补助。所有成员承担少量消费品成本，并分享巡演带来的凝聚力与贸易收益。"
 resolution_mygo_galactic_tour_public_stage_fund_tooltip:0 "共同体成员获得凝聚力与贸易额加成，同时降低消费品产出。每次完成巡演时，MyGO与承办国获得额外奖励。"

 resolution_mygo_galactic_tour_universal_mandate:0 "银河普遍巡演法"
 resolution_mygo_galactic_tour_universal_mandate_desc:0 "文化交流不再是一项可以无限延期的邀请。每个具备承办条件的共同体成员都必须完整举办至少一轮MyGO银河巡演。"
 resolution_mygo_galactic_tour_universal_mandate_tooltip:0 "未完整承办过MyGO巡演的共同体成员获得§Y10年宽限期§!。宽限期结束后仍未完成者将§R违反银河法§!。\n\nMyGO本身不承担被巡演义务，也不会因拒绝或放弃合约而违反本法。没有可用殖民地，或银河中不存在具备资格的MyGO成员时，不触发违约。"

