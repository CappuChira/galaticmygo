 EMPIRE_DESIGN_mygo_nomads:0 "迷子号流浪舰队"
 EMPIRE_DESIGN_mygo_nomads_desc:0 "迷子号没有母星。ANON与四名同伴负责这艘方舟的航行、内政、科研、探索和防务，却没有人记得自己为何登船。她们带着舰上居民继续向前，并调查那些出现在旧航线上的旧日星尘信标。开局为§Y游牧帝国§!，以§Y迷子号§!作为起始方舟。沿航线依次发现并调查过去的遗迹§Y星尘信标§!，揭晓少女们背后的故事；与星际间的其他少女乐队交流互动，深度参与国际政治；并在探索完成最终信标后，回到§Y地球§!……"
