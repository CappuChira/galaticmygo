 mygo.10.name:0 "逃离，以及被遗落的航迹"
 mygo.10.desc:0 "WIP：迷子号在深空醒来。五个星尘信标已经出现在银河中。"
 mygo.10.a:0 "开始归航。"
 mygo_story.400.name:0 "通讯接入：内政总管"
 mygo_story.400.desc:0 "§H内政总管 【SOYO】§!\n\n元首ANON，内政部向您致敬。\n\n本周期的行政开销已经全部核算完毕。目前全舰居民区的凝聚力产出报表正常，配给方案已更改为平衡生存标准。\n\n请您继续专注于寻找下一个星系的补给路线。一切为了飞船的存续。愿您的决策永远理智。"
 mygo_story.400.a:0 "知道了，SOYORin~"
 mygo_story.400.a.response:0 "之前说过了，请不要再继续给大家起这种奇怪的绰号了，ANON。"
 mygo_story.400.b:0 "那TOMORIN那边情况怎么样？"
 mygo_story.400.b.response:0 "是在问她之前提到的那个发现有什么进展吗？这我就不是很清楚了……\n\n或许她马上就来向您汇报了？"
 mygo_story.410.name:0 "通讯接入：科学官"
 mygo_story.410.desc:0 "§H科学官【TOMORI】§!\n\nANON阁下……！今天，飞船的传感器依然没有在外面捕捉到什么有用的信息。\n\n接收器捕捉到的那串频率古怪的杂波……\n\n我这几天的研究，还是无法将它归类。我想申请进行专项研究，实地考察……报告完毕。"
 mygo_story.410.a:0 "欸？专项研究需要做什么吗？"
 mygo_story.410.a.response:0 "需要专门配备科研船，还有科学家进行实地调查研究……\n\n如果可以的话，\n\n请让我负责……去一线进行研究！"
 mygo_story.410.b:0 "TOMORIN想怎么做都可以哦。"
 mygo_story.410.b.response:0 "太好了，ANON阁下！\n\n保证完成任务！"
 mygo.101.name:0 "断裂琴弦"
 mygo.101.desc:0 "WIP：考古完成，回收第一件遗物。"
 mygo_zero.1.name:0 "同源数据"
 mygo_zero.1.desc:0 "我们的科研人员成功将这个巨大的数据存储单元打捞进隔离舱。初步的解密工作异常顺利，它采用了全舰数据库中存储有的加密方式。数据被读取时，全息投影在舱内发出了杂乱的声响。根据比对，这片废料堆的合金成分与我们母船的外壳匹配度高达99.2%。科学家们推测，这大概是某个与我们使用了同源技术的团体，在经历了一场……惨烈内讧后抛弃的物体。"
 mygo_zero.1.a:0 "真是一堆沉重的破铜烂铁。"
 mygo_zero.2.name:0 "无名氏汇报"
 mygo_zero.2.desc:0 "随着对内部损坏区域的读取，我们成功修复了一部分被强制格式化抹除的日志。令人困惑的是，这些日志并没有记录任何星际政治或宏大的宏观战争，它完全由几个年轻女性的来往信件组成。信件中，一个被称呼为【小立希】的个体看起来性格暴躁，而另一个名字是【小素世】的个体则温柔又体贴。而【千早爱音】似乎是她们的领头人，热衷于给别人起外号。她们似乎是某个人类方舟的领导者。"
 mygo_zero.2.a:0 "完全没有听说过这类事情。"
 mygo_zero.3.name:0 "残卷"
 mygo_zero.3.desc:0 "研究进一步深入，科学团队发现了日志对应的几个编号：【SOYO】、【TAKI】、【TOMORI】、【RAANA】。\n这四个代号的排列顺序、权限配比，与我们当前政府内阁的四位总管完全契合。更让我们科研人员感到骨髓发凉的是，这群人所使用的语言，竟然与我们当前执政官所使用的底层汉字编码完全重合。她们提到的每一个部门、每一处舱室的编号，都在与我们现在的‘迷子号’完全一致。这些居然是……几位总管的【私人信件】？！"
 mygo_zero.3.a:0 "等等……这艘船的序列号，为什么会是‘Spica’？！"
 mygo_zero.4.name:0 "剥离的名字"
 mygo_zero.4.desc:0 "长崎爽世、高松灯……原来这些才是全舰领袖们的真名。研究的密级已经提高为绝密。前线科研船上的科学家们已经开始议论纷纷，尤其是关于【千早爱音】在当时的公众形象。首席科学官 TOMORI 在进行研究时表现出了严重的精神失常，科研船的医官不得不对她使用了强效镇静剂，并禁止了她进一步参加研究，以免遭受更大精神冲击。而在内政部，总管 SOYO 在看到报告后陷入了长久的沉默，并下达了禁止全舰议论此事的封口令。"
 mygo_zero.4.a:0 "允许……她继续参与研究。"
 mygo_zero.4.b:0 "顺从SOYO的意见，先封锁消息。"
 mygo_zero.5.name:0 "ANONYMOUS"
 mygo_zero.5.desc:0 "我们获得了一段录音。在那段影像中，长崎爽世用与平常状态截然不同的声线哭喊着：‘爱音……不要按下那个键……求求你……不要让大家变成那样……不要消除大家的记忆……’而那个坐在主控台前亲手将重置推杆推向最底端的人……与我们现在的执政官ANON，完全一致。"
 mygo_zero.5.a:0 "都是……我的错吗？"
 mygo_zero.6.name:0 "记忆的终局"
 mygo_zero.6.desc:0 "解密结束，数据库由于核心过载瞬间烧毁，无法再行利用。在这个坐标上，前一世的执政官千早爱音，为了某种不明的理由，亲手按下了清理键，消除了所有人的全部记忆。ANON——千早阁下，您过去真的很爱笑。"
 mygo_zero.6.a:0 "……"
 mygo_one.1.name:0 "深渊中的黑耀石"
 mygo_one.1.desc:0 "科研团队抵近了这块巨大的残骸。我们在残骸侧面的装甲剥落处，发现了七个由通用语书写的巨大喷漆字母：【CRYCHIC】。其外壳所使用的装甲材料强度较低，我们正在尝试派遣工程队进入残骸内部，寻找更多的线索。"
 mygo_one.1.a:0 "很有趣。"
 mygo_one.2.name:0 "剥离的残骸"
 mygo_one.2.desc:0 "初步探勘结果令我们感到困惑。它边缘的金属撕裂痕迹和爆破残留物表明这并非一艘独立建造的飞船。\n\n残骸的底部接口呈现出极其暴力的金属撕裂状。它原本是连接在某一艘极其庞大的母舰上的，不知出于何种原因，它被强行从母舰上剥离了下来。"
 mygo_one.2.a:0 "无论它是什么，继续深入。"
 mygo_one.3.name:0 "居住区段"
 mygo_one.3.desc:0 "进入内部后，工程团队发现这曾经属于一艘飞船的居住区段。鉴于之前的发现记录，我们将这个残骸的研究优先级调高，并正在尝试将它与母舰进行比对。"
 mygo_one.3.a:0 "难道说？"
 mygo_one.4.name:0 "比对"
 mygo_one.4.desc:0 "比对结果显示，这艘残骸的母舰与我们现在所处的迷子号完全一致。我们正在尝试从残骸中提取黑匣子记录，以便了解它被剥离的原因。"
 mygo_one.4.a:0 "那为什么……飞船的外壳会是CRYCHIC？"
 mygo_one.5.name:0 "秘密集会"
 mygo_one.5.desc:0 "我们将事发时间追溯到了距上一个信标残骸35年前。当时的飞船不慎遭遇了维生系统全面停摆的危机。食物配给骤降，灯光依次熄灭，绝望的情绪像瘟疫一样在各个甲板蔓延，不少人产生了逃离的念头。"
 mygo_one.5.a:0 "更多的秘密。"
 mygo_one.6.name:0 "决裂"
 mygo_one.6.desc:0 "A3至A7区的工业核心处产生了一次又一次的分离主义者秘密集会。当时的飞船未能处理这些分歧。矛盾越来越重，尤其是部分中高层人员决定进行分离，最终导致了飞船的分裂。"
 mygo_one.6.a:0 "后来呢？"
 mygo_one.7.name:0 "撕裂的火光"
 mygo_one.7.desc:0 "我们复原了那场大分裂的物理进程。多处地方发生交火。最终，连接处的侧翼装甲被直接引爆，母船因此遭受了极其严重的结构性重创。"
 mygo_one.7.a:0 "那差点毁了整艘母船！"
 mygo_one.8.name:0 "残破的终局"
 mygo_one.8.desc:0 "在我们被称作‘迷子’之前，这艘母船，连同那些完整的记忆与梦想，曾经被命名为CRYCHIC。"
 mygo_one.8.a:0 "我们……是被抛弃的？"
 mygo_one.9.name:0 "遗忘的伤疤"
 mygo_one.9.desc:0 "‘CRYCHIC’是我们真正的旧名。这场事故无疑造成了巨大的损失，我们直到今日仍在持续着对迷子号的修复建设工作。我们强烈怀疑，前代领袖们遭遇了精神层面的毁灭，最终导致了那场将所有人记忆格式化的大清零。而那个带着核心出走的幽灵，不知道如今还是否存在，又在银河系的哪个角落。"
 mygo_one.9.a:0 "继续前进吧。"
 mygo.104.name:0 "烧毁笔记"
 mygo.104.desc:0 "WIP：考古完成，回收第四件遗物。"
 mygo.105.name:0 "CRYCHIC挂饰"
 mygo.105.desc:0 "WIP：考古完成，回收最后一件遗物。"
 mygo.arcsite.a:0 "记录下来。"
 mygo.memory_rejection.name:0 "记忆排异反应"
 mygo.memory_rejection.a:0 "继续前进。"
 mygo.111.desc:0 "WIP：灯听见了暴雨。"
 mygo.112.desc:0 "WIP：爽世盯着残片沉默。"
 mygo.113.desc:0 "WIP：立希要求立刻关闭录音。"
 mygo.114.desc:0 "WIP：乐奈说这里有奇怪的味道。"
 mygo.120.name:0 "回到地球的路"
 mygo.120.desc:0 "Popy解出的地球坐标已经显示在§Y情报日志§!。\n提示：采纳博物传统可以挖掘在其他帝国疆域内的遗址。"
 mygo.120.a:0 "现在出发！"

 mygo.201.name:0 "废墟世界"
 mygo.201.desc:0 "进入大气层时，科研船舷窗外一直是灰色的。\n\n海岸线向内退了很远。河道被沙与尘填平，城市中林立着成片露出云层的楼顶，焦黑色，满是流火斑驳的痕迹。\n\n气象探针在下降途中遭遇到一阵短雨；雨点落在外壳上，燃烧出浑浊的白痕。\n\n地图里的蓝色东京湾与现在荒芜寂寥的地形相比，简直像是什么无良旅行社提供的假旅游手册。\n\n“池袋应该在这里。车站在这里，Livehouse RiNG要再往前一点……”\n\n§YPopy§!把地图缩小又放大。"
 mygo.202.name:0 "雨停以前"
 mygo.202.desc:0 "我们进入了东京。\n\n电车站台顶棚漏下来的水已经在轨道间积成浅池，这些池水具有很强的腐蚀性。鞋底踩过湿灰时会粘住，抬脚便发出很轻的撕扯声。墙上的线路图掉色严重，站名与Popy保存的地图一致。\n\n池袋站通往地面的出口被两层临时隔离门封住。第一层门上贴着疏散方向，第二层门后仍是原来的广告墙。方舟征募告示盖住了一墙旧Live海报。旁边的失物柜上，透明雨伞挤在一起，凌乱不堪。\n\nPopy沿着前往RiNG的步行路线，一跳一跳踩在水坑里。强腐蚀性的酸水溅起点点水花，在毒辣的阳光下泛起光芒。\n\n少女像彩虹一样。"
 mygo.203.name:0 "RiNG"
 mygo.203.desc:0 "RiNG的玻璃门彻底碎裂了，招牌也只剩下右半边还在支撑着。\n\n二楼的咖啡厅仍然看起来温暖又舒适。Popy坐在小方桌前，煞有介事地为自己倒了一杯空气咖啡。\n\n售票终端已经没法启动了。墙面上的公告板字迹还算清楚，上面写了很多少女乐队的名字，还有周末的节目单。\n\n后台保存得还算完整。舞台的地面胶带标着音箱和鼓架的位置，储物柜上贴着写有姓名的便利贴，“千早爱音”与“丰川祥子”的柜门紧紧相邻，还挂上了一对可爱的小恐龙装饰。\n\n储物柜里还剩下不少没有被取走的东西。几个落满灰尘的水杯，一包还剩下大半的拨片，变调夹，诸如此类的小物件，还有一份疏散指南，标注出了防灾中心的位置。\n\n如果忘掉强酸的污水与大楼上烈焰烧灼的痕迹，忽视掉刮起灰烬的狂风与灰暗的世界，这里看上去仍然温馨得像明天就要举办一场新的演出。"
 mygo.220.name:0 "星海巡演"
 mygo.220.desc:0 "地球之墓的发掘已经结束。\n\n从现在起，在与迷子号保持通讯、未交战的普通星际国家处，将可能获得§Y星海巡演§!的机会。演出地点会从委托国尚未到访的首都或大型殖民地中选出。\n\n接受合约后，前往目标星系完成§Y星海巡演协调§!特殊项目。巡演开始时，需要在旧曲、新曲与实验节目中选择本轮节目单。完成演出可以获得资源、影响力与外交收益。\n\n当一个国家符合条件的主要殖民地全部完成巡演后，该国会留下相应的巡演回忆。\n\n地球是归航的终点。下一张节目单就从这里开始！"
 mygo.220.a:0 "演出开始！"

 mygo.300.name:0 "WIP:迷子号通讯栏"
 mygo.300.desc.phase_1:0 "内部通讯终端模式在线。今天有什么安排？"
 mygo.300.desc.phase_2:0 "内部通讯终端模式在线。今天有什么安排？"
 mygo.300.desc.tour:0 "内部通讯终端模式在线。今天有什么安排？"
 mygo.300.tomori:0 "联系高松灯"
 mygo.300.tomori.response:0 "灯把通讯器靠在一本摊开的笔记旁。\n\n“爱音。这个地方……我正好思路卡住了，想不到解法。\n\n“再等一下。要一起出去走走吗？”"
 mygo.300.tomori.response.phase_2:0 "灯正在对照Popy保存的广播记录。\n\n“大家以前……从那里出发。\n\n“回去以后，会看到什么呢。”"
 mygo.300.tomori.response.tour:0 "站台提示声，雨水落在金属棚顶的声音，还有演出结束后嘈杂的观众频道。\n\n“下一首歌，我想把这些也作为采样……放进去。”\n\n高松灯如是说。"
 mygo.300.taki:0 "联系椎名立希"
 mygo.300.taki.response:0 "“推进器没有问题，弹药也补过了。要改航线就提前说。\n\n“灯的科研船什么时候回来？”"
 mygo.300.taki.response.phase_2:0 "“地球航线的风险表发到舰桥了。那里很危险，我制定了紧急脱离方案。\n\n“我们走吧。”"
 mygo.300.taki.response.tour:0 "“谁把演出、补给和跃迁安排在同一天的？\n\n“千早爱音！所有人都会被你累死的——”"
 mygo.300.soyo:0 "联系长崎爽世"
 mygo.300.soyo.response:0 "“是补给申请吗？其他事情的话……我现在有时间，随时跟我说就好。”"
 mygo.300.soyo.response.phase_2:0 "“……抱歉，我又在想CRYCHIC的事情了。\n\n“我们慢慢聊吧。”"
 mygo.300.soyo.response.tour:0 "“下一站的那群人把泊位费和舞台用电写反了，我退回去了一次。\n\n“还有，小爱音。签名之前，至少先看一眼结算币种。不可以让他们……用凝聚力支付。”"
 mygo.300.rana:0 "联系要乐奈"
 mygo.300.rana.response:0 "画面接通时，乐奈正蹲在外部检修通道里。她看了一眼镜头，又低头去拧面前的舱板。\n\n“这里，有猫。”\n\n当当！金属敲击声响了两下。"
 mygo.300.rana.response.phase_2:0 "“地球。”\n\n“想去看。”"
 mygo.300.rana.response.tour:0 "“下一站有好吃的吗？要抹茶芭菲——”"
 mygo.300.anon:0 "返回舰桥：千早爱音"
 mygo.300.anon.response:0 "通讯窗口缩回了屏幕边缘，主星图重新占据舰桥中央。\n\n航向仍在等待确认。"
 mygo.300.anon.response.phase_2:0 "地球坐标固定在主屏幕中央。几条测算航线从迷子号当前位置向外延伸。\n\n出发吧？"
 mygo.300.anon.response.tour:0 "巡演星图在舰桥上展开。下一处目的地旁是尚未确认的靠港申请。"
 mygo.300.restore_portraits:0 "WIP:恢复成员肖像"
 mygo.300.restore_leaders:0 "备用恢复缺失领袖"
 mygo.300.restore_leaders.tooltip:0 "立即重建已加入的领袖们。\n\n§R请仅在确认角色已经死亡且自动复活失败时使用。极可能产生重复领袖！§!"
 mygo.300.close:0 "结束通讯。"
 mygo.300.back:0 "返回通讯列表。"

 MYGO_POPIPA_NEUTRAL_GREETING_01:0 "迷子号现在在哪一颗恒星附近？等一下，我先打开星图~！有咲说，上次我把左右看反了！"
 MYGO_POPIPA_NEUTRAL_GREETING_02:0 "我们正在整理旧广播。小灯最近还在写东西吗？"
 MYGO_POPIPA_NEUTRAL_GREETING_03:0 "要靠岸的话提前告诉我们。有咲说一切要按规范来！"
 MYGO_POPIPA_NEUTRAL_GREETING_04:0 "什么时候有时间一起演出？"
 MYGO_POPIPA_NEUTRAL_GREETING_05:0 "不能给的就真的不能偷偷塞！有咲已经把仓库锁了~"
 MYGO_POPIPA_FRIENDLY_GREETING_01:0 "小爱音！快~来~找~我~玩——"
 MYGO_POPIPA_FRIENDLY_GREETING_02:0 "有点想念你了，小爱音~"
 MYGO_POPIPA_FRIENDLY_GREETING_03:0 "小灯想来看看企鹅了！她没说，但是绝对想来！"
 MYGO_POPIPA_FRIENDLY_GREETING_04:0 "哼哼~kizunamusic~♪"
 MYGO_POPIPA_FRIENDLY_GREETING_05:0 "小爱音别见外！直接叫我小香澄就好~"
 MYGO_POPIPA_HOSTILE_GREETING_01:0 "咳咳！我听得到。有什么事？"
 MYGO_POPIPA_HOSTILE_GREETING_02:0 "呐呐小爱音，我们是不是该有一点分寸感？"
 MYGO_POPIPA_HOSTILE_GREETING_03:0 "不许靠近我们的船！"
 MYGO_POPIPA_HOSTILE_GREETING_04:0 "小爱音，我不想隔着警报声和你说话。先让你们的船离开警戒线。"
 MYGO_POPIPA_HOSTILE_GREETING_05:0 "有什么事？你说吧，爱音。"
 MYGO_POPIPA_WAR_GREETING_01:0 "爱音！我是不会停火的！"
 MYGO_POPIPA_WAR_GREETING_02:0 "popipa的船确实不会自己修复，你们的船也一样！"
 MYGO_POPIPA_WAR_GREETING_03:0 "看着你让我感到害怕，你的心里装着可怕的东西，爱音！"
 MYGO_POPIPA_WAR_GREETING_04:0 "如果你是来谈停火，就把条件发来。如果不是，我们没有什么可说的。"
 MYGO_POPIPA_WAR_GREETING_05:0 "我不想让迷子号再消失一次。可我也不会让我们的家从星图上消失。"
 MYGO_POPIPA_DOW_PROPOSE_01:0 "我一直以为，再多说一次就会有用。\n\n可是不能再让别人替我们的犹豫承担后果了。\n\nPoppin'Party将与你们进入战争状态。"
 MYGO_POPIPA_DOW_ACCEPT_01:0 "宣战书收到了。\n\n我不理解，为什么会走到今天这一步？\n\n我们的舰队会拦住你们。Poppin'Party将与你们进入战争状态。"
 MYGO_POPIPA_PEACE_PROPOSE_01:0 "交火已经够多了！我们就不能用音乐说话吗？\n\n先停下来——！Poppin'Party想要与你们进入和平状态。"
 MYGO_POPIPA_PEACE_CONSIDER_01:0 "先停下来——！全线停火！"
 MYGO_POPIPA_PEACE_ACCEPT_01:0 "停火指令已经发出。小爱音，其他的事……等伤员回来以后再说。"
 MYGO_POPIPA_PEACE_DECLINE_01:0 "你们的条件没有让舰队离开，我们会战斗到最后一刻！"
 MYGO_POPIPA_TRADE_PROPOSE_01:0 "我们把能长期供应的东西列出来了。迷子号也把真正需要的数量写上吧。"
 MYGO_POPIPA_TRADE_CONSIDER_01:0 "有咲~！第三页为什么整页都是红的？"
 MYGO_POPIPA_TRADE_ACCEPT_01:0 "嗯嗯！popipa同意！赞成！0反对~！"
 MYGO_POPIPA_TRADE_DECLINE_01:0 "呜呜，有咲说不行……"
 MYGO_POPIPA_GIFT_ACCEPT_01:0 "送到了！小爱音我太喜欢你——有咲，怎么啦？"
 MYGO_POPIPA_OPEN_BORDERS_01:0 "民用航道已经对迷子号开放。经过居民区时把广播频道打开吧！大家都想和你们打招呼~"
 MYGO_POPIPA_CLOSE_BORDERS_01:0 "从现在起，迷子号不能进入popipa的星域。"
 MYGO_POPIPA_EMBASSY_ACCEPT_01:0 "房间已经准备好了。窗口能看见小广场，不过晚上排练可能有点吵~"
 MYGO_POPIPA_EMBASSY_DECLINE_01:0 "嘛嘛，迷子号身上还是有很多谜团的啦~"
 MYGO_POPIPA_RECALL_EMBASSY_01:0 "工作人员会安全离境。留在办公室里的东西，我们整理后会送回迷子号。"
 MYGO_POPIPA_RESEARCH_PROPOSE_01:0 "超级天才爱音酱！你可能不记得了，但这是我给你起的绰号哦！来和超级天才香澄酱一起研究吧！"
 MYGO_POPIPA_RESEARCH_ACCEPT_01:0 "超级天才爱音酱！来和超级天才香澄酱一起研究吧！"
 MYGO_POPIPA_RESEARCH_DECLINE_01:0 "不~行！超级天才香澄酱不接受！"
 MYGO_POPIPA_RESEARCH_BREAK_01:0 "超级天才香澄酱的档案，不让你看！"
 MYGO_POPIPA_COMMERCIAL_ACCEPT_01:0 "演出周边要另外排队哦！这条真的是有咲要求写进去的，真的！"
 MYGO_POPIPA_COMMERCIAL_DECLINE_01:0 "演出周边要另外排队。禁止倒卖！！"
 MYGO_POPIPA_COMMERCIAL_BREAK_01:0 "演出周边禁运！我想买你们的CD……呜呜……"
 MYGO_POPIPA_MIGRATION_PROPOSE_01:0 "有人想去迷子号看看，也有人希望能从船上下来生活。小爱音觉得怎么样？"
 MYGO_POPIPA_MIGRATION_ACCEPT_01:0 "登记窗口开放了。那个，方舟上能不能带盆栽呀？"
 MYGO_POPIPA_MIGRATION_DECLINE_01:0 "现在不能答应！居住名额、返航方式和家属联系都没有写清楚呢。"
 MYGO_POPIPA_MIGRATION_BREAK_01:0 "新的申请会停止。但是再考虑考虑吧！谁会拒绝Poppin'生活？"
 MYGO_POPIPA_NAP_ACCEPT_01:0 "好耶！小爱音，最喜欢你啦~"
 MYGO_POPIPA_NAP_DECLINE_01:0 "唔，那个，这个，总之就是不行！"
 MYGO_POPIPA_NAP_BREAK_01:0 "欸？！为什么不行？！小爱音你也太过分了吧！"
 MYGO_POPIPA_DEFENSIVE_ACCEPT_01:0 "小爱音！我们会互相保障对方安全的，对吧对吧？"
 MYGO_POPIPA_DEFENSIVE_DECLINE_01:0 "这中间还有点欠缺考虑……"
 MYGO_POPIPA_DEFENSIVE_BREAK_01:0 "小爱音……防御条约，不签了……？"
 MYGO_POPIPA_FEDERATION_INVITE_01:0 "重新回到一个乐队大家庭来吧！"
 MYGO_POPIPA_FEDERATION_ACCEPT_01:0 "我们加入！真的不是只有我一个人点了同意，大家都同意！"
 MYGO_POPIPA_FEDERATION_DECLINE_01:0 "唔，我们自从分开了以后，彼此都变了好多呢……"
 MYGO_POPIPA_FEDERATION_LEAVE_01:0 "呜呜，再见小爱音……"
 MYGO_POPIPA_WAYSTATION_PROPOSE_01:0 "在闪耀花园留一个你们随时能找到的停靠点吧！补给、维修、广播窗口！"
 MYGO_POPIPA_WAYSTATION_ACCEPT_01:0 "位置确认！下次迷子号靠近时，可以顺着驿站补给~"
 MYGO_POPIPA_WAYSTATION_DECLINE_01:0 "选址会挡住民用航道的。暂时不行啦~"
 MYGO_POPIPA_WAYSTATION_BREAK_01:0 "驿站许可撤销后，来不及转移的人员由我们送回迷子号！"
 MYGO_POPIPA_SUBJUGATE_PROPOSE_01:0 "这份协议会把迷子号保护起来。popipa会保护你们的！"
 MYGO_POPIPA_SUBJUGATE_DECLINE_01:0 "不！可！以！绝——对不行！！！"
 MYGO_POPIPA_BECOME_SUBJECT_ACCEPT_01:0 "协议通过了。小爱音！全都靠你了！"
 MYGO_POPIPA_ACCEPT_SUBJECT_01:0 "小爱音！接下来全都听我的~"
 MYGO_POPIPA_RELEASE_SUBJECT_01:0 "协议结束了！小爱音，你自己加油！"
 MYGO_POPIPA_ASK_RELEASE_01:0 "呐呐小爱音，能不能……让我自己发挥发挥？"
 MYGO_POPIPA_SECRET_FEALTY_01:0 "那个……！小爱音……！求求你！！！"
 MYGO_POPIPA_RIVAL_PROPOSE_01:0 "迷子号让我们都很厌烦！爱音，没有人喜欢你！！！"
 MYGO_POPIPA_RIVAL_END_01:0 "那个，小爱音，我们可以重修旧好吗，嘿嘿。"
 MYGO_POPIPA_INSULT_01:0 "小爱音！你的胸好平！"
 MYGO_POPIPA_GUARANTEE_01:0 "哼哼~没有人敢欺负我们了哦，小爱音！"
 MYGO_POPIPA_SUPPORT_INDEPENDENCE_01:0 "小爱音！我们会帮你的！"

