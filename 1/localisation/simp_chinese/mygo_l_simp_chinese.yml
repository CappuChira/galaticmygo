# APPROVED REVERSE DIPLOMACY IMPORT: MyGO speaking to Poppin'Party
 MYGO_TO_POPIPA_NEUTRAL_GREETING_01:0 "香澄前辈，频道很清楚。Poppin'Party这次想谈什么？"
 MYGO_TO_POPIPA_NEUTRAL_GREETING_02:0 "先说好哦，迷子号今天的航线没有走反。立希确认过了。"
 MYGO_TO_POPIPA_NEUTRAL_GREETING_03:0 "香澄前辈，你们送来的殖民地广播我听完了。最后那段是正式节目，还是忘记关麦了？"
 MYGO_TO_POPIPA_NEUTRAL_GREETING_04:0 "Tomorin在整理新的词。等她自己决定要不要发，我可不会替她答应哦。"
 MYGO_TO_POPIPA_NEUTRAL_GREETING_05:0 "迷子号目前一切正常。嗯，至少这份对外报告上是这么写的。"
 MYGO_TO_POPIPA_FRIENDLY_GREETING_01:0 "香澄！你上次说的广场Live还算数吧？我已经把档期空出来一点点了。真的只有一点点。"
 MYGO_TO_POPIPA_FRIENDLY_GREETING_02:0 "不用每次接通都先问我们缺不缺东西啦。补给表我等下发给你，谢谢。"
 MYGO_TO_POPIPA_FRIENDLY_GREETING_03:0 "香澄前辈，我最近吉他真的进步了！别问立希，问我就行。"
 MYGO_TO_POPIPA_FRIENDLY_GREETING_04:0 "今天舰桥很安静。你那边要是正在排练，就把现场声开过来吧。"
 MYGO_TO_POPIPA_FRIENDLY_GREETING_05:0 "我发现你会把“不知道怎么办”说成“一起做什么”。……还挺好用的。"
 MYGO_TO_POPIPA_HOSTILE_GREETING_01:0 "迷子号频道已经接通。请直接说明事项。"
 MYGO_TO_POPIPA_HOSTILE_GREETING_02:0 "不要再用“小爱音”把问题带过去。香澄，我正在等你的正式回答。"
 MYGO_TO_POPIPA_HOSTILE_GREETING_03:0 "Poppin'Party过去认识的是谁，不代表你们可以替现在的迷子号作决定。"
 MYGO_TO_POPIPA_HOSTILE_GREETING_04:0 "如果你只是想确认我们需不需要被保护，可以关闭频道了。"
 MYGO_TO_POPIPA_HOSTILE_GREETING_05:0 "香澄，你总说先一起做点什么。这次请先把你做过的事解释清楚。"
 MYGO_TO_POPIPA_WAR_GREETING_01:0 "停火条件发到军事频道。其他话等舰队撤开以后再说。"
 MYGO_TO_POPIPA_WAR_GREETING_02:0 "香澄，每一艘船上都是活生生的生命。"
 MYGO_TO_POPIPA_WAR_GREETING_03:0 "我不会让迷子号再从任何人的星图上消失。"
 MYGO_TO_POPIPA_WAR_GREETING_04:0 "别再说你会保护我们。先命令你的舰队停止射击。"
 MYGO_TO_POPIPA_WAR_GREETING_05:0 "户山香澄，我是迷子号的执政官。现在，由我来回答你的舰队。"
 MYGO_TO_POPIPA_DOW_PROPOSE_01:0 "“最后一次交涉已经结束。”\n\n“香澄，我知道你会说再谈一次、再试一次。可是舰队已经越过了我们能退让的位置。”\n\n“迷子号将与你们进入战争状态。”"
 MYGO_TO_POPIPA_DOW_ACCEPT_01:0 "“宣战书收到了。”\n\n“不要以为我只会带着大家逃走，香澄。迷子号会留在这里，拦住你们。”"
 MYGO_TO_POPIPA_PEACE_PROPOSE_01:0 "“双方伤员名单、撤离线和交换坐标已经发送。”\n\n“香澄，先停火。我们之间剩下的问题，不该继续交给舰炮回答。”"
 MYGO_TO_POPIPA_PEACE_CONSIDER_01:0 "“等一下。立希正在确认撤军线，爽世在核对人员交换名单。”"
 MYGO_TO_POPIPA_PEACE_ACCEPT_01:0 "“条件确认。迷子号舰队将按协议停火。”\n\n“香澄前辈，先把所有人带回去吧。”"
 MYGO_TO_POPIPA_PEACE_DECLINE_01:0 "“我等待的是一场大胜。”\n\n“这不是停火方案。迷子号拒绝。weapons free，继续开火！”"
 mygo_to_popipa_second_war.desc:0 "“全舰进入战斗位置。”"
 mygo_to_popipa_postwar_first_contact.desc:0 "“频道恢复了。香澄，你说吧。”"
 MYGO_TO_POPIPA_TRADE_PROPOSE_01:0 "香澄前辈！这是迷子号能稳定提供的数量。限量版周边不算正式货币。"
 MYGO_TO_POPIPA_TRADE_CONSIDER_01:0 "等一下，香澄前辈，你为什么在运费一栏画了星星？"
 MYGO_TO_POPIPA_TRADE_ACCEPT_01:0 "条件没问题。成交！这次是我本人和Soyor……爽世小姐一起确认过的。"
 MYGO_TO_POPIPA_TRADE_DECLINE_01:0 "抱歉，迷子号现在承担不了这个数量。等库存稳定以后再谈吧。"
 MYGO_TO_POPIPA_GIFT_ACCEPT_01:0 "真的全都给我们？谢谢，香澄前辈。那个……下次不要在货箱外面写“给小爱音”啦，全舰都看见了。"
 MYGO_TO_POPIPA_GIFT_PROPOSE_01:0 "你们收下就好。"
 MYGO_TO_POPIPA_OPEN_BORDERS_01:0 "迷子号控制区已经向Poppin'Party开放。喂！不要突然冲到舷窗外打招呼！"
 MYGO_TO_POPIPA_CLOSE_BORDERS_01:0 "从现在起，Poppin'Party舰船不得进入迷子号控制区。已经入境的船只按指定航线离开。"
 MYGO_TO_POPIPA_EMBASSY_PROPOSE_01:0 "我们在民用区整理出一间常驻办公室。香澄前辈，派谁来都可以，但入住名单必须先给S……爽世小姐！"
 MYGO_TO_POPIPA_EMBASSY_ACCEPT_01:0 "申请通过。房间离排练区不远，可能会有点吵。你们应该不会介意吧？"
 MYGO_TO_POPIPA_EMBASSY_DECLINE_01:0 "目前不适合设置常驻机构。现有频道先保留，香澄前辈。"
 MYGO_TO_POPIPA_RECALL_EMBASSY_01:0 "迷子号使馆人员会在本周期内撤回。私人资料和共同档案请按清单移交。"
 MYGO_TO_POPIPA_RESEARCH_PROPOSE_01:0 "Poppin'Party有陆地实验资料，迷子号有新的方舟数据。香澄，交换着看会更快吧？"
 MYGO_TO_POPIPA_RESEARCH_CONSIDER_01:0 "先别催，灯还在看你们附上的旧歌词。有咲的技术目录已经交给科研部门了。"
 MYGO_TO_POPIPA_RESEARCH_ACCEPT_01:0 "协议通过。超级天才爱音酱和超级天才香澄，合作成立！"
 MYGO_TO_POPIPA_RESEARCH_DECLINE_01:0 "现在不能开放这些数据。不是不信任你，香澄前辈，是迷子号自己也还没有弄清楚。"
 MYGO_TO_POPIPA_RESEARCH_BREAK_01:0 "共享终端将在本周期结束后关闭。已经完成的成果仍按原协议保留。"
 MYGO_TO_POPIPA_COMMERCIAL_PROPOSE_01:0 "迷子号能提供移动演出、航线宣传和外环维修。Poppin'Party负责固定场地和销售窗口。怎么样，很像正式企划吧？"
 MYGO_TO_POPIPA_COMMERCIAL_CONSIDER_01:0 "周边分成、场地费用、运输损耗……香澄前辈，这份真的是你写的吗？完成度也太高了吧——咳咳！没有说你不靠谱的意思！真的没有！"
 MYGO_TO_POPIPA_COMMERCIAL_ACCEPT_01:0 "通过！联名标志设计稿统一送审。明天就能看到结果啦！"
 MYGO_TO_POPIPA_COMMERCIAL_DECLINE_01:0 "条件还不够稳定。爱音品牌的首次跨星域合作可不能随便开始……我是说，迷子号暂时拒绝。"
