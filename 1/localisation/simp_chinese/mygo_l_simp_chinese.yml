 site_mygo_one:0 "星尘信标：黑金残骸"
 site_mygo_one_intro:0 "我们的科研船探测到了一个巨大的金属异常信号。那是一截飞船残骸，外壳上布满了被高能粒子流切割的惨烈痕迹。"
 mygo_stardust_two_site:0 "星尘信标：远星的回响"
 mygo_stardust_two_site_desc:0 "一颗被超新星灼成玻璃荒原的行星下方，埋藏着仍由气密力场保护的大型人工空腔。信标脉冲正从空腔中心一座沉寂已久的会场发出。"
 site_mygo_two:0 "星尘信标：远星的回响"
 site_mygo_two_intro:0 "一颗被超新星灼成玻璃荒原的行星下方，埋藏着仍由气密力场保护的大型人工空腔。信标脉冲正从空腔中心一座沉寂已久的会场发出。"
 mygo_stardust_popy_station_site:0 "星尘信标：营业时间"
 mygo_stardust_popy_station_site_desc:0 "一座早已弃用的环形补给站，停泊臂仍在发送断断续续的入港引导信息。"
 mygo_stardust_crychic_site:0 "星尘信标：CRYCHIC挂饰"
 mygo_stardust_crychic_site_desc:0 "WIP：最后一件关键遗物。"
 mygo_earth_tomb_site:0 "地球之墓"
 mygo_earth_tomb_site_desc:0 "地球，SOL-III。\n\n死寂的星球。几乎不显现出什么耀眼的光泽，轨道上散布着太空时代留下的残骸，早已超出使用年限的卫星兢兢业业地在轨道上旋转着，表面涂装仍然保存完好：\n\n§H地球联合国§!。"

 mygo_two.1.name:0 "玻璃荒原下的会场"
 mygo_two.1.desc:0 "钻探小队穿过厚重的玻璃化岩层，进入了一座巨大的地下穹顶。看台以同心圆环绕中央升降舞台，墙体、穹顶和座席下方密布经过精密校准的声学结构。入口闸机还保持着开启状态，仿佛最后一批观众只是暂时离席。\n\n这是一处足以容纳数十万人的Live会场。舞台边缘残存的指示文字反复提到三个名字：CRYCHIC、Morfonica与Poppin'Party。"
 mygo_two.1.a:0 "沿着观众入场路线继续搜索。"

 mygo_two.2.name:0 "宣传册"
 mygo_two.2.desc:0 "在安检区后方，考古队找到了一批封存在真空恒温匣中的宣传册、票根和场刊。纸页采用耐辐射聚合物制成，鲜艳得与四周遗址格格不入。\n\n封面写着：§Y《远星的回响 - 三团联合Live》§!。内页列出了CRYCHIC、Morfonica和Poppin'Party的演出顺序、联合曲目与成员寄语。最后一页是一张被反复折叠的航线图。"
 mygo_two.2.a:0 "好气派……"

 mygo_two.3.name:0 "留在舞台上的技术清单"
 mygo_two.3.desc:0 "后台设备间保存着大量贴有手写标签的维护表、舞台走位图和调音记录。它们详细记载了全息投影阵列、声学放大器与方舟广播系统的接线方式，许多页边还留着对灯光颜色和节拍变化的争论。\n\n工程团队据此重新接通了会场的一组独立供能节点。中央舞台缓慢升起，覆满尘埃的屏幕第一次亮起，并开始检索标记为§Y最终合演§!的录像档案。"
 mygo_two.3.a:0 "恢复演出档案！"

 mygo_two.4.name:0 "全息演出的残影"
 mygo_two.4.desc:0 "破损的全息影像越过空座席重新铺满会场。CRYCHIC、Morfonica与Poppin'Party的成员依次登台，又在最终曲中站到同一个舞台上。影像缺失了大量帧，但欢呼、乐器与舞台的光效仍被忠实地还原。\n\nCRYCHIC的阵列里出现了两名不在迷子号现有成员记录中的少女。面部识别只能从损坏字幕中拼出§Y丰川祥子§!和§Y若叶睦§!的名字。录像结尾，三支队伍约定在下一片更明亮的星云再次相见，她们在舞台上互相拥抱。"
 mygo_two.4.a:0 "当时真的相信还会再见……"

 mygo_two.5.name:0 "FMT文本留档"
 mygo_two.5.desc:0 "会场后台的FMT终端仍保存着联合Live结束后的见面会文本。大部分音视频已经损毁，转写文字却被完整保留。\n\n§L“在宇宙中流浪，我沿着心之梢去见你们……”——高松灯§!\n\n§L“下一次，大家要一起在更美丽的星云里开Live哦！”——丰川祥子§!\n\n§L“闪闪发光，心动不已！”——户山香澄§!\n\n更多记录谈论食物、排练失误、丢失的拨片以及三艘方舟下一段航程。在那个纪元，这几支方舟舰队在漫长的星际旅途中相互支持、并行航行。"
 mygo_two.5.a:0 "简直像诗一样！"

 mygo_two.6.name:0 "沉寂的联络信道"
 mygo_two.6.desc:0 "调查的最后阶段，科研人员从演出调度终端中提取出了未加密通讯频率。它们曾用于协调CRYCHIC、Morfonica与Poppin'Party各自方舟的航线、到场时间和演出设备。\n\n我们从来都不必等待偶然的相遇。准备好的话，就用这个频段吓她们一跳吧。"
 mygo_two.6.a:0 "使用旧频段，呼叫所有人。"
 mygo_two.6.a.tooltip:0 "立即与§Y闪闪发光共同体§!、§Y蝶之翼和平协约国§!和§Y月之森企业联盟§!建立通讯。"

 mygo_contact.normal.popipa.name:0 "来自闪耀殖民地的问候"
 mygo_contact.normal.popipa.desc:0 "§H通讯接通。对方的代表在看到迷子号识别码后，短暂地忘记了预先准备的外交辞令。§!\n\n“等等，Spica……真的是那艘Spica吗？”\n\n户山香澄的声音从惊讶迅速变成了毫不掩饰的兴奋。她完全不需要查阅通讯名录，\n\n“CRYCHIC！我不知道你们去了哪里，也不知道为什么现在才出现。不过，既然终于听见了彼此的声音，那就重新从‘你好’开始吧！”"
 mygo_contact.normal.popipa.a:0 "你好，Poppin'Party！迷子号仍在航行~"

 mygo_contact.normal.morfonica.name:0 "蝶翼档案中的失踪者"
 mygo_contact.normal.morfonica.desc:0 "§H对方没有立即回应。数秒后，一份经过多重校验的方舟档案被传入迷子号。§!\n\n“识别结果一致。我们是同行者。”\n\n仓田真白的语气谨慎，却难以掩饰呼吸中的兴奋。蝶之翼和平协约国保存了并行方舟时代的大量资料，其中关于CRYCHIC的条目终止于一次无法追踪的航线偏离。\n\n“小灯还在吗！我，我想让她看看，我最新写的……唔……日记……”"
 mygo_contact.normal.morfonica.a:0 "漆黑之羽,如深渊相伴……！"

 mygo_contact.normal.tsukinomori.name:0 "一份本应注销的航行档案"
 mygo_contact.normal.tsukinomori.desc:0 "§H月之森企业联盟的通讯协议迅速完成了身份核验，但对方随后封锁了所有自动回复，只留下最高权限频道。§!\n\n“Spica的注册记录早已被标记为失联。你们携带的CRYCHIC资料也理应随着那艘船一同消失。”\n\n丰川祥子和录像里相比，冷酷得不像是同一个人。\n\n“你们说是我抛弃了你们？怎么可能！你们做了什么事自己心里比谁都清楚。把你们目前的航行状态发来。至于叙旧？我们会在确认资料真伪之后再谈。”"
 mygo_contact.normal.tsukinomori.a:0 "那么就从航行记录开始。"

 mygo_contact.truenormal.popipa.desc:0 "§H通讯接通。对方的代表在看到迷子号识别码后，短暂地忘记了预先准备的外交辞令。§!\n\n“等等，Spica……真的是那艘Spica吗？”\n\n户山香澄的声音从惊讶迅速变成了毫不掩饰的兴奋。她完全不需要查阅通讯名录，\n\n“CRYCHIC！我不知道你们去了哪里，也不知道为什么现在才出现。不过，既然终于听见了彼此的声音，那就重新从‘你好’开始吧！”"
 mygo_contact.truenormal.morfonica.desc:0 "§H对方没有立即回应。数秒后，一份经过多重校验的方舟档案被传入迷子号。§!\n\n“识别结果一致。我们是同行者。”\n\n仓田真白的语气谨慎，却难以掩饰呼吸中的兴奋。蝶之翼和平协约国保存了并行方舟时代的大量资料，其中关于CRYCHIC的条目终止于一次无法追踪的航线偏离。\n\n“小灯还在吗！我，我想让她看看，我最新写的……唔……日记……”"
 mygo_contact.truenormal.tsukinomori.desc:0 "§H月之森企业联盟的通讯协议迅速完成了身份核验，但对方随后封锁了所有自动回复，只留下最高权限频道。§!\n\n“Spica早已被标记为失联。你们还活着啊，太好了。”\n\n“你说是我抛弃了你们？\n\n怎么可能！那时候做了什么事，你们自己心里比谁都清楚。叙旧？我们在确认资料真伪之后再谈。”"

 mygo_contact.reply.popipa.friendly:0 "你好，Poppin'Party！迷子号仍在航行~"
 mygo_contact.reply.popipa.reserved:0 "当然。下一场Live也一起吧！"
 mygo_contact.reply.popipa.forceful:0 "那个那个，你们知道迷子号发生了什么吗~"
 mygo_contact.reply.morfonica.friendly:0 "漆黑之羽,如深渊相伴……！"
 mygo_contact.reply.morfonica.reserved:0 "灯也一直想再见到你们哦。"
 mygo_contact.reply.morfonica.forceful:0 "学姐，把你们保存的档案全部发来！"
 mygo_contact.reply.tsukinomori.friendly:0 "祥子，我们终于又找到你了。"
 mygo_contact.reply.tsukinomori.reserved:0 "嗯，过去的事以后再谈。"
 mygo_contact.reply.tsukinomori.forceful:0 "祥子……"

 mygo_contact.relic.popipa.name:0 "旧频段应答：Poppin'Party"
 mygo_contact.relic.popipa.known_desc:0 "§H联合Live的调度频段发出呼叫。短暂的静默后，一段经过反复转接的信号跨越星海返回会场。§!\n\n“这个校验音……是当年联合Live开场前用过的！”\n\n户山香澄把同款宣传册扫描件举到镜头前，她们显然仍保存着另一份同版场刊：\n\n“那就说明大家约好的下一次Live，还没有取消！”"
 mygo_contact.relic.popipa.a:0 "嗯，还没有结束！"

 mygo_contact.relic.morfonica.name:0 "旧频段应答：Morfonica"
 mygo_contact.relic.morfonica.known_desc:0 "§H呼叫后先返回了一段长达数分钟的档案验证。一段时间后，蝶之翼和平协约国开放了影像频道。§!\n\n“我们一直保存着这场联合Live的节目单，却不知道会场最终被埋在了哪里呢。”\n\n仓田真白注视着重新亮起的全息舞台：\n\n“我们在演出后各自驶向了不同航线，可惜丢失了CRYCHIC——我是说，迷子号此后的去向。今天我们真的有被吓一跳呢！”"
 mygo_contact.relic.morfonica.a:0 "好耶！"

 mygo_contact.relic.tsukinomori.name:0 "旧频段应答：CRYCHIC"
 mygo_contact.relic.tsukinomori.known_desc:0 "旧CRYCHIC频段畅通无阻，直接接入了丰川祥子的私人频道。这个端点是CRYCHIC用于协调联合Live排练和航线的内部频率，双方系统因此跳过了全部验证程序。\n\n“……把完整录像发给我吧。”"
 mygo_contact.relic.tsukinomori.a:0 "嗯。"

 mygo_popy.route.name:0 "WIP夹在日常档案里的路线"
 mygo_popy.route.desc:0 "WIP§H蝶之翼和平协约国发来一份没有标注优先级的档案包。仓田真白接通频道时，身后还堆着尚未整理完的节目单。§!\n\n“它原本夹在一批纪念性质的巡演地图里。我们也是整理旧演出照片时，偶然发现上面的恒星光谱还能与现在的一颗恒星对应。”\n\n路线图上只有一处已经从现代星图消失的停靠点：§YCRYCHIC号第一太空休息区§!。它被标注为三支乐队会合前使用的联合航线补给站。\n\n“爱音小姐，如果迷子号最近正好经过附近……能替我们看看那里还在不在吗？”\n\n频道另一端，迷子号的Live广播正传来灯的试唱。立希在远处抱怨设备预约又被占满，乐奈只问了一句：“有舞台吗？”"
 mygo_popy.route.ask:0 "WIP“这真的是考古坐标吗？”"
 mygo_popy.route.ask.response:0 "WIP“一开始谁也没有这么想。它只是很普通地躺在旧相册下面，像在等有人顺手把它重新放回星图。”"
 mygo_popy.route.live:0 "WIP“我们最近也重新开了Live频道。”"
 mygo_popy.route.live.response:0 "WIP真白轻轻笑了：“那么，就把它当作一次旧演出场地的外景考察吧。虽然立希小姐大概不会同意这个名字。”"
 mygo_popy.route.accept:0 "WIP既然是巡演补给站，就去看看吧！"

 mygo_popy.1.name:0 "营业时间"
 mygo_popy.1.desc:0 "这是一座环形空间站，它由中央补给轴、三个停泊臂和一圈已经断裂的透明娱乐舱组成。\n\n我们沿着闪烁的引导光停泊，进入气闸。接待大厅处电力系统似乎出现了故障，黑暗中漂浮着许多吉祥物玩偶、杂志刊物和装饰彩带。墙上写着：§Y离站前不要忘记领取纪念印章！§!\n\n在我们带来的应急电源接通后，走廊灯带、欢迎音乐和全息路标依次亮起。一个活力又明亮的声音覆盖全部舱室：\n\n“欢迎来到Poppin'第一太空休息区！今天也是闪闪发光的一天哦！”\n\n“检测到CRYCHIC信号。欢迎回来！距离下一场联合Live还有，-302……咦？”\n\n声音一下子停住了。\n\n倒计时是一个§H负数§!。"
 mygo_popy.1.a:0 "很有趣。"

 mygo_popy.2.name:0 "无重力POPY"
 mygo_popy.2.desc:0 "“我是本休息区的Poppin'型综合接待人格，简称§HPopy！§!”\n\n“不是Poppy，更不是Puppy！是Po-Pi-Pa——”\n\n看起来她确认科研人员携带着CRYCHIC识别码，我们对这一认证从何而来不得而知。\n\n我们试着和她进行交涉。\n\n“CRYCHIC比预约时间早到了……不对，好像晚了一点点？”"
 mygo_popy.2.a:0 "真有意思。"

 mygo_popy.3.name:0 "新鲜的补给品"
 mygo_popy.3.desc:0 "科研人员探索了一圈，这里确实只是普普通通的休息区，与它刚废弃时别无二致。\n\n在补给区电力恢复后，自动售货机开始展示百年前的菜单，全息巧克力螺色彩鲜艳，但在选择购买后贩卖机运转半天，什么也没有吐出来。\n\nPopy在旁边急到快要哭出来了，但毫无办法。\n\n为了表达缺货的歉意，Popy为研究人员们打开了餐点页面。CRYCHIC一栏很快被她勾选“已领取”，旁边是Morfonica与Poppin'Party两栏。它们仍亮着：\n\n§Y等待到站§!\n\nPopy为它们重新启动了保温程序，尽管里面什么也没有。"
 mygo_popy.3.a:0 "继续探索其他区域吧。"

 mygo_popy.4.name:0 "约定"
 mygo_popy.4.desc:0 "我们为主娱乐环修复了供电。§HPopy§!似乎终于意识到停泊记录存在问题，她开始反复扫描熄灭的几条停泊臂，然后主动降低了音量：\n\n“CRYCHIC已经到了。\n\n可是，为什么只有CRYCHIC来了？”\n\n“是Monica的航行速度比较慢吗？\n\nPopipa是不是又落下什么东西，所以回去拿了？”\n\n科研人员试图向她解释已经过去上百年，大家都不会再来了。Popy只是直勾勾地盯着预约表，她说另外两支队伍“一定会来”。\n\n每当门禁系统发出杂讯，她的虚拟形象都会立刻转向入口。\n\nPopy望向黑暗的停泊臂：“我们要把休息区的灯开亮一点！这样她们离得很远就能看见。”"
 mygo_popy.4.a:0 "按照她说的。我们把所有引导灯都打开。"

 mygo_popy.5.name:0 "Live"
 mygo_popy.5.desc:0 "迷子号全体成员决定使用刚恢复的全息舞台举办一场Live。\n\n出于安全与政治影响考虑，您不能亲自到场。这场live将在远程举行。\n\nPopy负责主持、灯光与观众程序，她根据旧影像生成密密麻麻的模糊观众轮廓，重新填满了空旷的娱乐环。"
 mygo_popy.5.a:0 "初次见面，我们是MAIGO！"

 mygo_popy.6.name:0 "合影"
 mygo_popy.6.desc:0 "Live结束后，Popy启动了纪念摄影程序。全息相框原本为三支队伍预留了位置，CRYCHIC的位置只剩下了五个人，大半个舞台依旧空着。\n\nPopy拒绝把摄制的照片交出来，她执意要在等到所有人都到齐之后再把照片合成完毕，不论那需要多少时间，也不论这还有没有机会能实现。\n\n“这样等她们到了，大家就仍然站在一起！”\n\n快门落下时，那个合成出来的Popy影像仍然笑着，眼角却隐约闪着泪光。"
 mygo_popy.6.a:0 "等她们到了，我们就一起拍照吧。"

 mygo_popy.7.name:0 "最终站"
 mygo_popy.7.desc:0 "Popy向大家挥手道别。她展示了一份储存在这里的航线档案，上面标注着所有的航行日志，包括最原初的出发地——\n\n§H地球§!\n\n“下一站就是大家最开始出发的地方！等Monica和Popipa到站以后，我们就一起回去吧！”\n\nPopy想要把一份轻量人格副本装进我们的飞船，她说她也想去地球看看了。本体则留在休息区，继续维持着引导灯。\n\n“带着我去看！我也超级好奇，地球现在是什么样子！”\n\n我们越开越远，那座残破的环形空间站越来越小，最后缩成一颗微小的光点。"
 mygo_popy.7.a:0 "嗯，我们去地球。"
 mygo_popy.7.a.tooltip:0 "Popy本体将留守休息区，一份人格副本随迷子号前往§Y地球§!。"

