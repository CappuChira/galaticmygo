 mygo.637.name:0 "闪耀花园"
 mygo.637.desc:0 "迷子号接近闪耀花园外围的导航浮标时，公共频道同时亮起了十几条引导讯息。第四条是香澄本人。\n\n“小爱音！我看见你们了——”\n\n画面猛地转向窗外。一颗覆着海洋和绿色大陆的星球悬在她身后。随后有人喊：“香澄，先让管制台说完！”她朝画面外应了一声，回来时仍在挥手。\n\n迷子号进入星屑绿洲轨道。\n\n接驳艇舱门打开时，潮湿空气带着雨和植物的气味涌进来。你踩上廊桥，膝盖不自觉地弯了一下。\n\n“咳咳！只不过是这颗星球的重力，有点高……”\n\n香澄站在警戒线外，举着写有“欢迎小爱音”的牌子。\n\n灯蹲在廊桥边，用手指碰了一下从排水槽里长出来的小叶子，叶面还挂着水。\n\n在落地半小时后，你才发现乐奈不知道什么时候已经离开了迎宾队伍。\n\n旧方舟的舱段被留在城市中央，改造成了纪念博物馆兼live场地。首都的高楼参差不齐，外壁上开出窗户和露台。不同形状的门、坡道和低重力通道从它周围向外延伸。广场正在搭建一个小型舞台，音响试机的低频隔着地面传到鞋底。路过的人停下来仰望接驳船的标志，有人挥手，有人举起自己的终端。\n\n立希终于把乐奈扭送了回来，后者张牙舞爪，胳膊上挂着几大袋饮料。这野猫高低是没有忘掉姐妹们，还给你们一人整了一份。\n\n“欢迎回来——不对，第一次来这里应该说欢迎光临！”\n\n户山香澄显然高兴得有点得意忘形。\n\n“走吧~先带你们看家！”"
 mygo.637.a:0 "跟上她。"
 mygo.638.name:0 "翡翠穹顶"
 mygo.638.desc:0 "苍蝶高原正处在风季。\n\n引航站连续发送了三次侧风警告。山脊从舷窗下方一段段露出来。城市沿着高原铺开，最高处伸出云端，成排风障在阳光下投出长影。\n\n“右边、右边——再往右一点！”\n\n通讯里的筑紫比驾驶员还紧张。接驳艇落地后，她才刚松了口气。\n\n舱门刚打开，风就钻了进来。你用手按住头发，它们却穿过你的指缝飞起舞动。\n\n灯把胸前的笔记本抱紧，纸页在风中哗啦啦地响。\n\n真白从警戒线外跑过来：\n\n“小灯！\n\n“小爱音也来了……大家，真的都来了。”\n\n从行星港前往首都档案馆的道路贴着山壁。几栋建筑换上了颜色稍浅的新外墙，窗框边还留着风暴冲刷后的水痕。\n\n档案馆中庭入口旁堆着尚未归档的册子，空气里有纸张、木架的气味，还有除湿设备吹出的热风。靠窗的长桌上按位摆着杯子，旁边压着几张手写的座位牌。\n\n窗外的云被风推过山谷，露出下方一层又一层的屋顶。\n\n真白把椅子往灯那边推了一点点。"
 mygo.638.a:0 "我们来了！"
 mygo.639.name:0 "白银回廊"
 mygo.639.desc:0 "迷子号刚离开超空间航道时，引航舰就已经等在出口外了。\n\n“贵安，爱音。”祥子的声音从频道里传来，“欢迎你来。”\n\n霜月档案库从轨道上看去几乎全是白色。冰原之间分布着成片的工业城，供热管线沿着地表伸向远处。迷子号来到星球的晨线上，夜尚未完全退去，港区灯光下的薄云一片暗黄。\n\n迷子号的正下方，就是曾属于她的A3至A7工业区段。\n\n你穿上防寒外套，一言不发地下了船。\n\n接驳桥的尽头。祥子一个人站在那里，胸前别着月之森的工作证。她看了一眼走在最后面的爽世。\n\n“外面很冷。我们先走。”\n\n爽世的眼神复杂。她停了半步，叹了口气。呵出的白气在空中逸散，飘渺不见。\n\n核心区就建在A3区段这连片的封闭廊道里。窗外是积雪、货运轨道和不断吐出白汽的换热塔，窗内则是黑金色的通道，泛光的纹路一闪一闪。\n\n祥子走在最前面为你们带路。她看上去倒不像统治者，你在心里找到了一个更贴切的名词……\n\n§R傀儡§!。\n\n你们抵达了会客室。桌上的茶还在冒热气，旁边放着分好的点心。\n\n窗外又开始下雪了。"
 mygo.639.a:0 "端起茶杯。"
# END REVIEWED IMPORT localisation from mygo-reviewed-capital-visits.txt

