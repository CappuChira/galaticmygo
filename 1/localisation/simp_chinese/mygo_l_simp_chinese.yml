 mygo.600.desc:0 "在启程演出之前，先决定下这次的演出风格吧！"
 mygo.600.old:0 "唱旧歌。"
 mygo.600.old.response:0 "最稳妥最保守的选择。只要这次灯不要在唱壱雫空的时候忘词……就绝对没问题！"
 mygo.600.new:0 "唱新歌。"
