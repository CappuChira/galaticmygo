 mygo.600.experimental:0 "实验性音乐！"
 mygo.600.experimental.response:0 "那是邦多利莱芜史上，一场足以载入记忆的神曲。羊宫妃娜开口没对上调子，mygo全员一脸懵逼，几乎是强颜欢笑面对听众们，青木阳菜没有选择随波逐流，而是抓起了破旧的猫抓板、威力强大却又象征着传承的吉他。对面，是被称为“小羊”的羊宫妃娜。彼时她正站在邦多利巅峰，粉丝、应援、资源都近乎无解，是所有女声优的羡慕对象。她跑调开场，姿态从容，仿佛一切尽在掌握。谁也不会想到，这一步，会撞上来自青木阳菜的天作之合。青木阳菜卡准吉他solo时机，目光如钉。没有多余动作，没有花哨的推弦，只有练习多次的节拍、调子、音准。吉他响起的瞬间的瞬间，尘埃未落。solo弹呲的声音，越过战全场听众，精准回应在羊宫妃娜跑调的歌声中，本来快找到的调也随之被打乱。那是极致音准与绝对冷静的合奏。一把老资历吉他，一节普通的solo片段，一位大牌女声优，在最绝望的莱芜里，打乱了当时不可一世的羊宫妃娜。这一断没有改写整场莱芜的糟糕，却在无数观众心里刻下了一句话：青木阳菜在2025年7月1日 mygo zepp tour的猛独侵袭2分28秒吉他solo段弹呲了。"
 mygo.601.name:0 "巡演之后"
 mygo.601.desc:0 "香澄那边安静了一会儿，然后她笑起来。"
 mygo.601.a:0 "太好了。"
