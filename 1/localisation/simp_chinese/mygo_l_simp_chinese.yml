 NAME_mygo_stardust_signal_system:0 "星尘信标"

 START_SCREEN_MYGO_NOMADS:0 "飞船的日志是从一片空白开始的。\n\n没有关于最初启航的记载，没有前方航线的坐标，没有这艘方舟建造时的序列号，只有维生舱的换气扇在幽暗中发出经年累月的低鸣。\n\n你们在冰冷中睁开眼，踏上了迷子号的旅程。没有人知晓过去。你们的过去与记忆是一片空白。\n\n从哪里来，要到哪里去？没有人知道。或许你们只是一群被时间抛弃的小猫，在一成不变的荧光灯与舷窗外中子星幽蓝色的照耀下，完成着你们的日常。\n\n帝国的疆域仅限于这艘破旧的世代飞船。\n\n底舱的警报灯在无声地闪烁着红芒。舰长ANON已在舰桥就位。主航道已校准，前方是一望无际的星河。\n\n下达起航的指令吧。"

