 mygo_stardust_string_site:0 "星尘信标：废料堆"
 mygo_stardust_string_site_desc:0 "我们的科学官已获准对异常信号源展开调查。信号源头是一片废料堆，不符合任何已知天然天体的成分。废料核心包裹着一个体积巨大的数据存储单元。尽管外壳已有些变形，但其内部仍在向外散发着微弱的杂音，这引起了TOMORI的注意。"
 site_anon_zero_shatter:0 "星尘信标：废料堆"
 site_anon_zero_shatter_intro:0 "我们的科学官已获准对异常信号源展开调查。信号源头是一片废料堆，不符合任何已知天然天体的成分。废料核心包裹着一个体积巨大的数据存储单元。尽管外壳已有些变形，但其内部仍在向外散发着微弱的杂音，这引起了TOMORI的注意。"
