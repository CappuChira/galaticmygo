 MYGO_A3_A7_AUDIT_PROJECT:0 "A3至A7联合审计"
 MYGO_A3_A7_AUDIT_PROJECT_DESC:0 "请开始核对记录。"
 opinion_mygo_sakiko_reconciliation:0 "守住归来航路"

 mygo_story.650.name:0 "我们的家族没落了……祖产？！"
 mygo_story.650.desc:0 "月之森企业联盟发来了一封挂号公文。\n\n发送方是§Y联合资产管理董事会§!，而不是你熟悉的丰川祥子。\n\nMyGO对月之森企业联盟的造访引起了轩然大波。月之森境内的一批居民提出申请，要求确认MyGO是否继承了CRYCHIC号的法律身份。申请涉及霜月档案库的核心工业区——也即，仍然保留着原始编号的A3至A7 CRYCHIC区段。\n\n董事会已经宣布冻结了这些区段的产权变更。\n\n从法律上来讲，严格意义上，MyGO对A3至A7仍然具有所有权、管理权和返还要求。\n\n爽世把文件从头看到尾。\n\n“她们到现在都还没有准备告诉我们，这些区段为什么会在月之森呢。”"
 mygo_story.650.a:0 "我联系一下小祥。"

 mygo_story.651.name:0 "交涉代表"
 mygo_story.651.desc:0 "祥子接通了通讯。\n\n她坐在一间会议室之中，身后墙上挂着月之森企业联盟的标志。\n\n“我没有这个权限。”\n\n你差点以为自己听错了。\n\n就在几分钟前，你想问她到底是怎么回事——关于财产归属，她在其中负责的部分，以及如何行动才能让双方都满意……但她只是说，她没有这个权限。\n\n“她们瞒着我这些事。我……我不清楚。抱歉。\n\n“我刚刚查到了我能查到的内容。她们正在进行一场审计……希望你们能快点来，看看到底会发生什么。”"
 mygo_story.651.a:0 "嗯，我们马上就来。"

 mygo_story.652.name:0 "A3至A7联合审计"
 mygo_story.652.desc:0 "审计室位于A3区段深处。\n\n墙板、气密门和照明槽仍保留着迷子号上的样式，门后是一名月之森的审计员：\n\n“我们愿意公开分离时期的记录。但已经在这颗星球上生活了几代，我们之间是分开的两个实体。”\n\n爽世不置可否地摇了摇头：\n\n“先把审计进行下去，我们再谈别的吧？”"
 mygo_story.652.a:0 "请开始核对记录。"

 mygo_story.653.name:0 "签名"
 mygo_story.653.desc:0 "审计组找到了工业核心转移计划的原件，以证明她们离开的正当性。\n\n文件创建于分离事故发生以前。A3至A7将携带设备、工业核心和一部分人口寻找可居住星球；减重后的CRYCHIC号继续尝试脱离星云。双方脱险后，在编号§YHLR-01§!的深空设施会合。\n\n计划末尾有两份授权：\n\n§H丰川祥子。§!\n\n§H千早爱音。§!"
 mygo_story.653.a:0 "所以当初的分离是经过批准的。"

 mygo_story.654.name:0 "爆破栓"
 mygo_story.654.desc:0 "分离过程没有按照计划完成。\n\n首先是内乱的反应。月之森财团的人员已经过于躁动不安，丰川祥子为了安抚情绪主动作为她们的代表进行商议各项事宜，最后把自己也送了出去；\n\n然后是物理上的问题。对接结构在脱离前卡死了。殖民舱推进器已经启动，紧急时刻，丰川祥子的最后一个命令是——\n\n§L“A3至A7，执行爆破分离。”§!\n\n爆炸切断了对接结构，也撕开了母舰一侧的外壳。自动炮台把高速飞散的残骸识别为来袭目标，开始向殖民舱开火。"
 mygo_story.654.a:0 "然后呢？"

 mygo_story.655.name:0 "没有抵达的人"
 mygo_story.655.desc:0 "殖民舱在霜月档案库着陆后，重新启动了航标。\n\n第一条呼叫在着陆当天发出。\n\n§L“Spica，这里是A3至A7。殖民舱已经着陆。请报告位置。”§!\n\n没有回复。\n\n此后的呼叫从每天一次变成每周一次，再变成每月一次。频道不断地重新呼叫Spica，可迷子号始终没有抵达预定区域。\n\n之后发生的灾难没有人知道是什么。会合地点、双线方案和祥子离舰的原因，一起从迷子号的记录中消失。\n\n月之森方面认为，生死不明，那就是……"
 mygo_story.655.a:0 "祥子，你为什么不告诉我这些？"

 mygo_story.656.name:0 "沉默"
 mygo_story.656.desc:0 "“你为什么不告诉我？”\n\n祥子没有立即回答。她沉默了几秒，抬起头：\n\n“拿出一份只有我保存的文件，告诉一个失去记忆的人，她以前同意过我的决定。\n\n“然后呢？让你相信我没有修改它？让你按照一个已经不记得的名字，承认自己应该原谅我？”\n\n“至少你可以告诉我我们约好的事。”\n\n“我很生气，爱音。”\n\n祥子的手停在桌面边缘，\n\n“你带着一艘活下来的船回来，问我为什么抛弃你们。\n\n“你忘记了自己的决定，却还记得恨我。”\n\n“我不知道……该怎么回答。”"
 mygo_story.656.a:0 "……"

 mygo_story.657.name:0 "事实"
 mygo_story.657.desc:0 "爽世长长叹了一口气：\n\n“我没有原谅你。”\n\n“我知道。”\n\n——\n\n霜月档案库殖民地的第一份配给凭证由企业部门发放。维修责任、生产设备和居民份额被写进同一张表格。谁能让工厂继续运转，谁就拥有更多表决权。\n\n降落后不久，供暖恢复了。\n\n祥子以CRYCHIC撤离指挥官的身份签署了紧急托管协议。作为交换，董事会保证每一名登记居民都能获得配给，也不得把无法工作的伤员赶出居住区。\n\n紧急托管持续了一年，又持续了十年。\n\n企业份额被继承、收购和合并。七家工业部门很快变成了七个财团。负责维持殖民地运转的董事会，最终拥有了殖民地。\n\n祥子的名字后面从始至终都没有股份。\n\n审计完成后将召开联合会议，正式进行讨论决定这些历史遗留问题的解决方案。\n\n会议将在两天后进行。"
 mygo_story.657.a:0 "那接下来的会议该怎么办……？"

 mygo_story.659.name:0 "代表"
 mygo_story.659.desc:0 "联合资产管理董事会共有十二个席位。\n\n七席属于财团，三席属于居民基金，一席属于港区工会。最后一席是丰川祥子。\n\n在董事会的议题中，人们最关心的是MyGO是否准备收回A3至A7。\n\n所有人都在等待MyGO的决定。\n\n这将是一个重大的决定，直接影响着整个星际局势。你有机会直接收回主权，也有可能扶持丰川祥子上位，但如果施压过度，将会走向战争的结局……"
 mygo_story.659.a:0 "我们将直接放弃我们的宣称。"
 mygo_story.659.b:0 "我们会收回来，让两个国家重归一体。"
 mygo_story.659.c:0 "我们只信任丰川祥子。"

 mygo_story.664.name:0 "守住归来航路"
 mygo_story.664.desc:0 "处置案被否决，A3至A7区段继续归月之森居民所有。\n\n迷子号离开白银回廊以后，你向丰川祥子又发起了一次通讯。\n\n“怎么，又想找我有什么事吗？”\n\n她的表情显然有些困惑。\n\n“没有。未来加油……？”\n\n“你也是。加油！”\n\n她低头翻了一下自己的日程。\n\n“欢迎下次再来。”"
 mygo_story.664.a:0 "等我下次再来。"

 mygo_story.667.name:0 "继承权声明"
 mygo_story.667.desc:0 "§H我们会收回A3至A7。§!\n\n你的这句话直接引起了整个月之森企业联盟的动荡。董事会在当天召开了紧急会议，七家财团暂停了所有交易，军事动员开始迅速进行。A3至A7的居民网络里出现了大量争论。有人要求立刻驱逐迷子号，也有人认为终于可以摆脱财团的管控，舆论把这场谈判推上了热度的顶峰。\n\n你在说完这句话之后便主动切断了通讯。现在，各路人马都在试图接入你的通讯，办公室的通讯此起彼伏地接收着来自野心家、政客与财阀的消息。你全都没有回复——因为现在，你正面对着的是丰川祥子。\n\n“你真的是这么想的吗，爱音？这完全不是一件简单的事情……”"
 mygo_story.667.a:0 "所以才需要慢慢谈。"

 mygo_story.668.name:0 "民意调查"
 mygo_story.668.desc:0 "关于月之森重新合并进入MyGO的重大事件，媒体很快进行了一次民调。\n\n§L“这里以前属于CRYCHIC！我明白。但我们会对未知的漂泊感到不安。保持现状比较好……”§!\n\n§L“财阀的统治过于令人不安。我想接受MyGO的保护将是我们做出最明智的决定。爱音绝对不会对我们做出什么坏事的……”§!\n\n§L“长期以来，丰川代表一直都处于没有实权的尴尬状态。借此机会，我们希望能真正让果断有力的丰川代表领导我们，不要飞船，也不要财阀……”§!\n\n很显然，没有人愿意把一切原样交给MyGO。\n\n也没有人愿意继续假装产权问题不存在。\n\n董事会将接收两轮条件。最终协议将根据MyGO提出的资产、自治和防务安排决定。"
 mygo_story.668.a:0 "所有人都会站在我这边的。"

 mygo_story.669.name:0 "第一份条件"
 mygo_story.669.desc:0 "第一轮谈判处理A3至A7的资产。\n\n爽世把三份方案放到你面前。\n\n选择方案务必慎重。\n按照目前状态来看，选择让丰川祥子执政最符合绝大多数人的利益；\n让月之森成为保护国次之，具有很高可行性；\n完全成为MyGO的属国则几乎不可能，甚至有爆发热战的风险。\n\n第一份不收回工厂和居住区。MyGO承认现有居民的永久产权，以月之森成为保护国作为继承关系的解决方式。\n§L民间支持率：30%§!\n\n第二份要求七家财团移交工业区和港口的控制权。居民可以继续生活，但具体生产和资源调配由MyGO统一管理。\n§L民间支持率：10%§!\n\n第三份顺应了民意的要求。A3至A7的旧方舟权利将转为由丰川祥子负责。\n§L民间支持率：60%§!"
 mygo_story.669.a:0 "居民保留资产，月之森接受MyGO保护。"
 mygo_story.669.b:0 "A3至A7由MyGO统一管理。"
 mygo_story.669.c:0 "将旧方舟继承权转交小祥托管。"

 mygo_story.670.name:0 "第二份条件"
 mygo_story.670.desc:0 "第二轮谈判处理月之森此后的地位。\n\n董事会愿意承认MyGO是CRYCHIC的继承者。每一种关系都必须写明舰队由谁调动、税收交给谁，以及月之森是否仍能独立处理内部事务。\n\n第一份方案由居民基金提出。月之森保留内政、财产和董事会，只把对外防御交给MyGO，不缴纳强制贡赋。\n支持率：50%\n\n第二份方案由MyGO审计组起草。月之森需要按期提供资源，舰队也必须服从迷子号的统一调度。\n支持率：10%\n\n第三份方案同样的，要求重新制定紧急托管协议，让祥子拥有预算、舰队和档案的实际决策权，以此作为“回归管辖”的象征，但不直接体现臣属关系。\n支持率：40%"
 mygo_story.670.a:0 "内政自治，我希望月之森接受我们的保护。"
 mygo_story.670.b:0 "资源与舰队必须接受MyGO调度。我们需要后勤。"
 mygo_story.670.c:0 "先结束财阀对祥子的架空。"

 mygo_story.671.name:0 "最后文本"
 mygo_story.671.desc:0 "两轮条件被整理成了最后文本。\n\n董事会将在今天作出回答。"
 mygo_story.671.a:0 "等待月之森的回答。"

 mygo_story.672.name:0 "保护国"
 mygo_story.672.desc:0 "联合资产管理董事会接受了协议。\n\nMyGO永久放弃对A3至A7工厂、土地和居民的返还要求。月之森保留内部制度与全部民用资产，只在对外防御和归来航路上接受MyGO协调。\n\n月之森企业联盟成为MyGO的保护国。\n\n签署仪式结束后，祥子仍然坐在原来的旁听席。\n\n在雪原深处的广场上召开了一次庆祝活动，人们载歌载舞，为MyGO和千早爱音欢呼。"
 mygo_story.672.a:0 "协议生效。"
 mygo_story.672.identity.tooltip:0 "§Y月之森企业联盟§!将更名为§YAnonTokyo§!，并保留现有企业政体与国民理念。"

 mygo_story.673.name:0 "拒绝"
 mygo_story.673.desc:0 "董事会拒绝了最后文本。\n\n居民基金和港区工会也没有支持MyGO。声明要求月之森交出工业控制权与舰队调度权，这越界了。爱音，你最好从现在开始做最坏的打算。"
 mygo_story.673.a:0 "那就由我们拥有的筹码来决定胜负！"
 mygo_story.678.desc:0 "月之森的舰队开始离港。\n\n祥子换下了会议用的外套，身后是白银回廊的舰队指挥室。\n\n“爱音，我不会因为过去属于CRYCHIC，就把现在生活在这里的人交给你。”\n\n“所以你要站在她们那边？”\n\n“我一直站在这里。”"
 mygo_story.678.a:0 "我明白了。准备作战。"
 mygo_story.678.identity.tooltip:0 "§Y月之森企业联盟§!将更名为§YAveMujica§!并改组为§Y独裁制§!，国民理念调整为§Y面具帝国§!与§Y实用建筑§!。"

 mygo_story.674.name:0 "信任"
 mygo_story.674.desc:0 "“我们只信任丰川祥子。”\n\n你的声音通过会议频道传到十二个席位，带来了长久的沉默。\n\n祥子第一个反对：\n\n“撤回。”\n\n“为什么？”\n\n“这不对吧……这和我有什么关系？”\n\n“那是众望所归。所有人都很期待你大展身手的时刻……”\n\n“这不是一回事。”\n\n“对我来说就是！”"
 mygo_story.674.a:0 "我不撤回！"

 mygo_story.675.name:0 "任命"
 mygo_story.675.desc:0 "祥子来到了迷子号的会客室：\n\n“如果MyGO直接把产权交给我，董事会会说我是依靠外部势力夺取月之森。不过她们说得也没错。”\n\n“你明明比那十二个人更适合。”\n\n“这也不能成为理由。”\n\n“这不是我的任命，是大家的哦。”你说。\n\n“……是吗。”"
 mygo_story.675.a:0 "让所有人决定，因为这是所有人的决定！"

 mygo_story.676.name:0 "公共托管"
 mygo_story.676.desc:0 "在随后召开的公投中，丰川祥子的名字以压倒性的优势盖过了剩下的一切选项。\n\n在高歌猛进之中，丰川祥子的执政似乎已经成为了板上钉钉的事情。每个人都对这一点深信不疑：丰川祥子将带领月之森，与MyGO建立优良的双边关系，以平等的姿态一同走向更好的明天。\n\n同日，MyGO宣布放弃直接收回A3至A7。\n\n旧方舟继承权被转入新设立的§Y归航公共托管基金§!。基金不持有居民住宅，也不能出售工业区，只负责分离档案、归来航路和CRYCHIC遗留权利。\n\n丰川祥子被提名为第一任托管人。\n\n七家财团无人提出异议。在居民的喧哗与躁动之中，数位董事引咎辞职，不少人主动将权利交给了这位众望所归的首领。\n\n这将是她第一次拥有真正的席位，也是最大的席位。"
 mygo_story.676.a:0 "继续推进！"

 mygo_story.677.name:0 "就任"
 mygo_story.677.desc:0 "第一，分离记录全部公开。历史遗留问题全部公开透明解决。\n\n第二，现有居民的产权不因CRYCHIC继承关系发生变化。\n\n第三，托管人丰川祥子可以调动航路预算和护航舰队，但每一笔支出都必须公开。\n\n第四，居民基金与港区工会可以发起罢免。\n\n第五，MyGO不得通过私人频道向托管人下达命令。\n\n丰川祥子读完五条就任要求，正式宣誓上任。\n\n属于丰川祥子新的席位拥有预算权、航路舰队调度权和档案访问权。涉及A3至A7、HLR-01和对外安全的议案，必须经过丰川祥子签署。七家财团如今已经名存实亡，在运作下很快只剩下空壳与象征意义。\n\n随后召开的第一次正式会议持续到很晚。\n\n你从私人频道发去一条消息：\n\n§L现在可以说私人事情了吗？§!\n\n几分钟后，频道显示已读。"
 mygo_story.677.a:0 "哼哼~"

 mygo_story.680.name:0 "回复"
 mygo_story.680.desc:0 "或许是专门已读不回显得自己很忙，祥子的回复直到第二天才发来。\n\n§L今晚有空。§!\n\n当你抵达白银回廊时，她已经站在接驳桥尽头。胸前仍然挂着月之森的工作证。\n\n“今天想吃点什么吗？”她说。\n\n“嗯~吃什么都行！关键在于，你走了，我们吃什么！”\n\n“是啊，吃什么。”\n\n祥子转身向港区走去，藏着一声没忍住的轻笑：\n\n“快跟上来。”"
 mygo_story.680.a:0 "来了，祥祥！"
 mygo_story.680.identity.tooltip:0 "§Y月之森企业联盟§!将更名为§YAveMujica§!并改组为§Y独裁制§!，国民理念调整为§Y面具帝国§!与§Y实用建筑§!。"
# END REVIEWED IMPORT: Sakiko return route

# BEGIN REVIEWED IMPORT: subject relationship greetings
 MYGO_POPIPA_SUBJECT_GREETING_01:0 "小爱音，本月的物资已经装船了！"
 MYGO_POPIPA_SUBJECT_GREETING_02:0 "我们会做你们最好的锚地，放心！"
 MYGO_POPIPA_SUBJECT_GREETING_03:0 "小灯在吗？我先给她听一段刚写好的旋律。"
 MYGO_POPIPA_OVERLORD_GREETING_01:0 "小爱音，迷子号缺什么就直接说。"
 MYGO_POPIPA_OVERLORD_GREETING_02:0 "有咲让我提醒你按时提交航线报告！她还说，不准我替你补。"
 MYGO_POPIPA_OVERLORD_GREETING_03:0 "先把正式事项处理完，然后一起排练吧！"
 MYGO_TO_POPIPA_OVERLORD_GREETING_01:0 "香澄前辈，物资清单收到了。"
 MYGO_TO_POPIPA_OVERLORD_GREETING_02:0 "要不要来舰上看星星？"
 MYGO_TO_POPIPA_OVERLORD_GREETING_03:0 "香澄，你是不是又偷偷往货箱里塞东西了？"
 MYGO_TO_POPIPA_SUBJECT_GREETING_01:0 "本期航线报告已经发送，香澄前辈。"
 MYGO_TO_POPIPA_SUBJECT_GREETING_02:0 "补给够用，舰体也没问题。真的。"
 MYGO_TO_POPIPA_SUBJECT_GREETING_03:0 "香澄，迷子号会按协议抵达。"

 MYGO_MORFONICA_SUBJECT_GREETING_01:0 "本期物资已经交给迷子号的接收船。"
 MYGO_MORFONICA_SUBJECT_GREETING_02:0 "防务协调事项由筑紫负责。小灯如果也在频道旁边……我有几页新的东西想给她看。"
 MYGO_MORFONICA_SUBJECT_GREETING_03:0 "苍蝶高原仍由我们自行管理。协议里是这样写的。小爱音应该没有忘记吧？"
 MYGO_MORFONICA_OVERLORD_GREETING_01:0 "迷子号的补给申请已经批准。那个，透子还想追加一批舞台灯。"
 MYGO_MORFONICA_OVERLORD_GREETING_02:0 "航线可以由你们自己决定。只要离开前告诉我哦。"
 MYGO_MORFONICA_OVERLORD_GREETING_03:0 "小爱音，这样反而让我更紧张……直接说吧。"
 MYGO_TO_MORFONICA_OVERLORD_GREETING_01:0 "小真白，本期清单没有问题。"
 MYGO_TO_MORFONICA_OVERLORD_GREETING_02:0 "透子附在后面的舞台改造申请……我会单独考虑。"
 MYGO_TO_MORFONICA_OVERLORD_GREETING_03:0 "正式报告收到了。接下来可以把主频道让给Tomorin吗？"
 MYGO_TO_MORFONICA_SUBJECT_GREETING_01:0 "小真白，航线和补给报告都发过去了。"
 MYGO_TO_MORFONICA_SUBJECT_GREETING_02:0 "透子刚刚说“宗主的命令就是来玩”。真让人伤脑筋……"
 MYGO_TO_MORFONICA_SUBJECT_GREETING_03:0 "迷子号会接受防务协调，但演出曲目还是我们自己定哦。"

 MYGO_TSUKINOMORI_SUBJECT_GREETING_01:0 "本期贡赋已经离港。爱音，接收以后告诉我一声哦。"
 MYGO_TSUKINOMORI_SUBJECT_GREETING_02:0 "我会打理好所有的事情的。请安心。"
 MYGO_TSUKINOMORI_SUBJECT_GREETING_03:0 "爱音，把靠泊申请补上……或者我替你写。"
 MYGO_TSUKINOMORI_OVERLORD_GREETING_01:0 "爱音，先把上次我要的表格发来。"
 MYGO_TSUKINOMORI_OVERLORD_GREETING_02:0 "补给额度已经批准。不要为这种事道谢，把船修好。"
 MYGO_TSUKINOMORI_OVERLORD_GREETING_03:0 "爱音，协议外的事……等这个频道关闭以后再说。"
 MYGO_TO_TSUKINOMORI_OVERLORD_GREETING_01:0 "祥子，本期贡赋确认收到了。"
 MYGO_TO_TSUKINOMORI_OVERLORD_GREETING_02:0 "月之森的内部事项还是交给你们。董事会如果又拿协议压你，把原件发给我。"
 MYGO_TO_TSUKINOMORI_OVERLORD_GREETING_03:0 "正式事项说完以后，你先别挂断。"
 MYGO_TO_TSUKINOMORI_SUBJECT_GREETING_01:0 "本期航线和资源报告都发过去了。祥子，你先看，不准直接转给董事会。"
 MYGO_TO_TSUKINOMORI_SUBJECT_GREETING_02:0 "迷子号会履行协议。"
 MYGO_TO_TSUKINOMORI_SUBJECT_GREETING_03:0 "祥子，我是在向你汇报，不是在向那七家财团汇报！"
# END REVIEWED IMPORT: subject relationship greetings

# BEGIN APPROVED IMPORT: MyGO leader mourning and resurrection
 mygo_resurrection.mourn:0 "这下真的要散了……"
 mygo_resurrection.welcome_back:0 "这下真的要聚了……"

 mygo_resurrection.1.name:0 "尘埃归于尘埃"
 mygo_resurrection.1.desc:0 "“爱音，我们，再也回不去了。”\n\n舰桥的防震阀全部失效，绝对零度的强风夹杂着警报的红光，将行政官那一头棕色的长发彻底吹散。她的腹部被坍塌的控制台残骸死死钉住，鲜血正顺着她笔挺的行政制服不断渗出。\n\n长崎素世反常地没有露出恐惧的表情。她只是看着屏幕上那个不断闪烁的执政官头像，唇角勾起一抹一如往常般温柔、却带着无尽自嘲的微笑。\n\n“终究没能带大家回到最初的故乡呢。\n只是……没有了我，爱音，你真的能一个人向前开吗……？”"
 mygo_resurrection.2.name:0 "奇迹与魔法"
 mygo_resurrection.2.desc:0 "警报声突然变成了极其不合时宜的八音盒旋律。原本冰冷死寂的星舰指挥室里，突然凭空泛起了刺眼的粉色高能粒子流。\n\n漫天的粉色光芒中，原本已经化为尘埃的长崎素世，竟然穿着一套缀满了繁复蕾丝、蝴蝶结与古怪丝线的轻飘飘短裙，踩着闪烁的星光，突兀地悬浮在半空中。\n\n她的手中还握着一根由飞船合金废料粗暴扭曲而成、顶端镶嵌着旧时代红茶杯碎片的“魔法手杖”。\n\n嗡——\n\n光芒散去，素世行政官轻飘飘地落在了甲板上。看着自己身上那套荒谬至极的衣服，她嘴角强行扯出了一个极其完美、却黑得像能吞噬光线的淑女微笑：\n\n“让您久等了，执政官大人。魔法少女·素世，加入战场。”"

 mygo_resurrection.3.name:0 "巨石冲击"
 mygo_resurrection.3.desc:0 "观测终端的脉搏终于化为了一条直线。那个总是缩在采样舱里、笨拙地用文字记录每一颗陨石碎片的女孩子，再也回不来了。\n\n整个迷子号的广播系统在此刻突然被行政官越权强行锁死，长崎素世的声音在所有舱室里低沉地回荡，伴随着旧时代吉他的盲音，吟诵着高松灯的绝笔：\n\n“沦为星之屑，”\n“胸口仍留余温在，”\n“一生乐团人。”\n\n只剩下无尽的空洞。"
 mygo_resurrection.4.name:0 "原始力量"
 mygo_resurrection.4.desc:0 "距离科学官高松灯在深空中蒸发，已经过去了数个周期。\n\n啪。\n\n采样舱的舱门突然毫无征兆地自动滑开。原本应该空无一物的冷冻舱里，高松灯正穿着破损的宇航服，呆滞地坐在那里。她的眼神像是一汪被搅浑的死水，死死地盯着自己的双手。\n\n“诶……？灯？你不是已经……”冲进来的执政官千早爱音大惊失色。\n\n灯缓缓抬起头，声音空洞得仿佛从另一个维度传来：“不知道……我好像，做了一个很长的梦。梦里有一个声音一直在对我说：‘不可以走，乐团还没有结束。’然后，我就在这里了。”\n\n没有任何科学解释。量子观测仪没有捕捉到任何粒子重组的迹象，生命监测系统里她的波长出现了诡异的断层。她就这么突兀地、出现在了现实里。"

 mygo_resurrection.5.name:0 "星海迷航"
 mygo_resurrection.5.desc:0 "观测屏幕上，属于要乐奈的生命信标突然熄灭了。不仅如此，连同古董吉他以及三罐抹茶粉，也一起在雷达上失去了踪迹。\n\n“乐奈！收到请回答！乐奈——！”指挥室内，千早爱音执政官正对着通讯器崩溃大喊。\n\n频道里没有回应，只有冰冷的宇宙背景辐射，以及隐隐约约、断断续续的吉他啸叫声，随着引力波流向远方。\n\n“无趣的星空，”\n“抹茶芭菲已燃尽，”\n“野猫去睡了。”"
 mygo_resurrection.6.name:0 "星海归航"
 mygo_resurrection.6.desc:0 "咚，咚。\n\n飞船外舱壁的隔离门上，突然传来了沉闷且毫无章法的敲击声。\n\n随着手动隔离阀被强行拉开，一艘引擎还在喷着黑烟的破烂逃生小艇，歪歪扭扭地塞进了气闸舱。小艇的舱门被一只脏兮兮的手从里面推开，要乐奈抱着她那把已经断了两根弦的旧时代电吉他，头发上还沾着尘埃，就这么面无表情地爬了出来。\n\n“……这里，有抹茶的味道。”野猫吸了吸鼻子，眼神直勾勾地越过惊呆了的爱音，看向了不远处的行政区。\n\n没人知道她是靠什么动力把这艘报废小艇开回来的，也没人能解释她是怎么在无氧的真空里活下来的。她就这么理所当然地回来了，像是一场对科学和程序的公开嘲弄。"

 mygo_resurrection.7.name:0 "旗舰的悲鸣"
 mygo_resurrection.7.desc:0 "“笨蛋爱音！赶紧滚开！这里由我来挡着！”\n\n通讯终端里最后传来的，是椎名立希声嘶力竭的怒吼，以及警报器刺耳的尖叫。主控台的屏幕上，代表着司令官旗舰的蓝色光点瞬间被刺眼的白光彻底吞噬。\n\n轰。\n\n旗舰化为了星海中一朵微不足道的烟花。\n\n监测面板上，司令官的生命体征直接归零。高松灯在科学舱里发出了近乎崩溃的哭喊，而千早爱音无力地跪倒在指挥椅前。\n\n长崎素世脸上的微笑终于彻底消失了，琥珀色的眼眸里一片死寂。"
 mygo_resurrection.8.name:0 "鼓手不死于非命"
 mygo_resurrection.8.desc:0 "在旗舰爆炸的中心星域，原本化为原子状态的飞船残骸，突然在一种不可名状的重力扭曲下，以违背一切物理定律的方式，重新坍缩成了一个漆黑的漩涡。\n\n啪。\n\n下一秒，椎名立希就这么突兀地、完好无损地趴在了迷子号指挥室的合金地板上。她身上还穿着完好的司令制服，手里甚至还死死攥着刚刚爆炸前一秒握着的操纵杆。\n\n“咳……咳咳！这里是……？我不是已经死了吗？！”立希猛地坐起来，大口喘着粗气，眼神里满是死里逃生后的恍惚与愤怒，“灯呢？！爱音？！这到底是怎么回事啊？！”"
# END APPROVED IMPORT: MyGO leader mourning and resurrection

