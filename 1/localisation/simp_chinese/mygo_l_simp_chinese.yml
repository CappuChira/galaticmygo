l_simp_chinese:
 origin_mygo_eternal_return:0 "永恒归还"
 origin_mygo_eternal_return_desc:0 "以迷子号为核心的游牧起源。迷子号的现存航行日志始于一片空白。舰上没有人拥有记忆，也没有人能说明这艘方舟为何漂流至此。五名少女维持着它继续航行：迷子前行的方向究竟会在何方？"
 origin_mygo_eternal_return_effects:0 "开局为§Y游牧帝国§!，以§Y迷子号§!作为起始方舟。沿航线依次发现并调查过去的遗迹§Y星尘信标§!，发掘少女们背后的故事；与星际间的其他少女乐队交流互动，深度参与国际政治；并在探索完成最终信标后，回到§Y地球§!……"
 origin_mygo_parallel_ark_colony:0 "并行方舟殖民地"
 origin_mygo_parallel_ark_colony_desc:0 "这个国家起源于另一艘方舟船的成功殖民。她们已经在异星母星上站稳脚跟，并以比普通新生文明更成熟的姿态进入银河。该国家会作为§Y高级电脑帝国§!生成。注：该预设目前仅供三个并行方舟电脑国家使用。"
  origin_mygo_parallel_ark_colony_effects:0 "该国家会作为§Y高级电脑帝国§!生成，并获得：\n$t$— §G+50%§!科研速度\n$t$— §G+50%§!岗位产出\n$t$— §G+25%§!人口增长速度\n$t$— §G-25%§!帝国规模\n$t$— §G+100%§!海军容量\n$t$— §G-50%§!舰船建造花费与维护费\n$t$— §G+100%§!舰船建造速度\n$t$— §G+25%§!舰船射速\n\n这个起源仅供三个并行方舟电脑国家使用。"
 mygo_parallel_popipa_legacy:0 "并行方舟遗产：闪耀殖民地"
 mygo_parallel_popipa_legacy_desc:0 "这支方舟殖民地把移民社群、舞台文化和跨物种互助组织紧密编织在一起。"
 mygo_parallel_morfonica_legacy:0 "并行方舟遗产：蝶翼档案"
 mygo_parallel_morfonica_legacy_desc:0 "这支方舟殖民地保存了大量前航行时代的自然档案，并以审慎的学术自治维持社会秩序。"
 mygo_parallel_tsukinomori_legacy:0 "并行方舟遗产：月之森协议"
 mygo_parallel_tsukinomori_legacy_desc:0 "这支方舟殖民地以高度制度化的工程体系管理资源与舰队，由月之森的财阀全面掌控。"
 opinion_mygo_parallel_ark_kinship:0 "并行方舟同源"

