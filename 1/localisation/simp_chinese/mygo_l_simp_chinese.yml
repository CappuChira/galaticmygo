 leader_trait_mygo_anon:0 "迷星领航"
 leader_trait_mygo_anon_desc:0 "爱音以近乎本能的方式统筹迷子号的航线、科研与人心。即使过去被清空，她仍会再一次把所有人聚集起来。"
 leader_trait_mygo_tomori:0 "星尘记录者"
 leader_trait_mygo_tomori_desc:0 "灯能从无人留意的残骸和噪声中辨认出属于过去的碎片，尤其擅长考古发掘与异常研究。"
 leader_trait_mygo_rana:0 "自由巡星"
 leader_trait_mygo_rana_desc:0 "乐奈对深空航路有着不可解释的直觉。她的科研船总能更快抵达，也总能找到别人错过的东西。"
 leader_trait_mygo_soyo:0 "无缺的管理者"
 leader_trait_mygo_soyo_desc:0 "爽世维持着迷子号精密而安静的日常运转。资源、秩序与情绪都被她妥善收拢在手中。"
 leader_trait_mygo_taki:0 "节拍统御"
 leader_trait_mygo_taki_desc:0 "立希把舰队调度变成了严密的节拍。每一次推进、转向与齐射都在她的控制之下。"
 civic_mygo_star_seekers:0 "追寻星尘"
 civic_mygo_star_seekers_desc:0 "迷子号不会在任何一颗星球停泊太久。沿着失落的航迹穿越虚空，把每一处星尘信标都视为归航路上的下一个坐标。Live激活期间，岗位资源产出总计§G+1000%§!"
 civic_mygo_star_seekers_effect_tooltip:0 "可用的局势应对方案：['concept_nomad_festival']\nMyGO的Live激活期间，岗位资源产出总计§G+1000%§!\n情报日志条目：['concept_journey_tracker']"
