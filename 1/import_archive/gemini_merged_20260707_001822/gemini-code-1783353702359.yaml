l_simp_chinese:
 # 阶段一
 mygo_story.490.name:0 "迷路的星际果冻"
 mygo_story.490.desc:0 "此刻，这只半透明、像果冻一样柔软的外星生物正被关在生物隔离舱里，缓慢地蠕动着。灯已经趴在玻璃上盯了它整整两个小时。\n\n“小爱……”Tomorin转过头，声音里带着一种难以掩饰的激动，“我们……能收养它吗？”"
 mygo_story.490.a:0 "这东西真的安全吗？不会突然喷酸液吧？"
 mygo_story.490.a.response:0 "“它是……食草系的。”Tomorin急忙拿出数据板，“而且它的触角看起来很软……”"
 mygo_story.490.b:0 "好啊！既然要在船上长住，那我们就给它起个名字吧！"
 # 选b后窗口直接关闭，瞬间弹出491

 # 阶段二
 mygo_story.491.name:0 "泡泡！"
 mygo_story.491.desc:0 "“既然它长得圆乎乎、软趴趴的，还会吐泡泡……”你双手叉腰，极其自信地宣布了你的方案，“我决定叫它【泡泡】！”\n\n“不行！”一向温顺的灯极其罕见地反驳了你。她把日记本举过头顶，眼神异常坚定：“它是在宇宙的黑夜里流浪的孩子！应该叫【司夜女神】！”\n\n“难听。”一直蹲在旁边的乐奈突然站了起来，指着玻璃窗里那团半透明果冻，“叫【毛球】。”\n\n你和灯同时看向乐奈。那玩意到底哪里像毛球了？！"
 mygo_story.491.a:0 "Tomorin，‘司夜女神’对于一只虫子来说太沉重了吧！"
 mygo_story.491.a.response:0 "“才不沉重！它在发光，就像星星一样……”灯执拗地抱着本子，“小爱的‘泡泡’听起来像是一戳就破的洗洁精……”\n你感觉自己的品味受到了挑战。"
 mygo_story.491.b:0 "小乐奈，不管怎么看它都不是毛茸茸的啊！"
 mygo_story.491.b.response:0 "小乐奈双手抱在脑后，理直气壮地回了一句：“想叫毛球。就是毛球。泡泡难听。”\n完全无法沟通，野猫的逻辑简直无懈可击。"
 mygo_story.491.c:0 "那就召开投票表决！"
 # 选c后窗口直接关闭，瞬间弹出492

 # 阶段三
 mygo_story.492.name:0 "一定要叫它泡泡吗？"
 mygo_story.492.desc:0 "关于“泡泡”、“司夜女神”和“毛球”的争执已经持续了十五分钟。立希和素世被你强行用最高权限拉进了连线会议。\n\n“千早爱音！你是不是太闲了？为了给一只太空变形虫起名字？！”屏幕里的Rikki几乎要顺着无线网爬过来打你，“叫‘阿米巴原虫1号’！”\n\n长崎素世：“我倒是觉得，由发现的人自己命名最为妥当哦。”\n\n最终计票结果：\n泡泡—— 1票\n司夜女神—— 1票\n毛球—— 1票\n\n这场轰轰烈烈的命名大作战，因为没人能拿到多数票而彻底陷入了僵局。"
 mygo_story.492.a:0 "（叹气）算了……"
 mygo_story.492.a.response:0 "虽然名字没有定下来，但这只太空变形虫就这样在迷子号上安了家。\n\n也许在这个冰冷的宇宙里，多一个迷路的同伴，也不是什么坏事。"