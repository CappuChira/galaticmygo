l_english:
 mygo_story.425.name:0 "独立勘探员"
 mygo_story.425.desc:0 "全息投影的画面在剧烈地晃动，没有任何声音。那个娇小身影直接倒挂在飞船外部的检修把手上。她的手里捏着一把断了一半的古代短刀，面无表情地盯着镜头看了三秒，一扭头走了。\n\n看起来RAANA并不打算和你说话。"
 mygo_story.425.a:0 "喂！至少说一句话吧——"
 mygo_story.425.a.response:0 "【连接失败】——画面里的白发少女似乎察觉到了你的强制接入。她如同野猫般警觉地眯起眼睛，随后直接切断了外部摄像头的信号源。\n屏幕瞬间变成了一片雪花。"
 mygo_story.425.b:0 "……由她去吧。给她发一艘科研船。"
 mygo_story.425.b.response:0 "系统已将 RAANA 标记为可用状态。\n备注：记得给她一包深煎煎茶糖。"