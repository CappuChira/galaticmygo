l_english:
 # 422: 主控中枢
 mygo_story.422.name:0 "设施巡视"
 mygo_story.422.desc:0 "作为执政官，你认为自己有必要去确认一下飞船的运行状况。\n\n站在舰桥中央那台巨大的战术演算阵列前，各种仪器发出微弱的嗡鸣。那些复杂的数据流在全息投影中交织，构成了这艘飞船跳动的心脏。\n\n"
 mygo_story.422.a:0 "检查航行日志。"
 mygo_story.422.a.response:0 "【权限拒绝】——屏幕上弹出了冰冷的红色警告。\n\n你有点摸不着头脑。"
 mygo_story.422.b:0 "去底层甲板看看。"
 mygo_story.422.b.response:0 "机房的低鸣声让人头痛，你决定前往维生系统所在的底层甲板。"

 # 423: 维生与水培区
 mygo_story.423.name:0 "设施巡视"
 mygo_story.423.desc:0 "穿过漫长且失重的连接通道，你来到了飞船的维生循环区。\n\n这里的空气不再像舰桥那样弥漫着机油味。气态巨星的冰冷光芒透过狭窄的舷窗打在水培农场的培养皿上，那是一些用无机盐催生出来的抹茶色合成藻类。\n\n尽管试图伪造出一种鲜活的错觉，但只要回头看一眼窗外那深不见底的真空，回忆一下刚刚吃过的饭，就会立刻清醒过来——它们真的很难吃。"
 mygo_story.423.a:0 "查看合成藻类的产出率。"
 mygo_story.423.a.response:0 "产能稳定，但你大概一辈子也忘不了，它们的口感极其糟糕。你发誓，迟早要找到一颗富含真正有机质的行星——如果能找到别的文明就更好了。"
 mygo_story.423.b:0 "还是前往居住区吧。"
 mygo_story.423.b.response:0 "你需要回到自己的舱室。"

 # 424: 居住区与个人舱室
 mygo_story.424.name:0 "设施巡视"
 mygo_story.424.desc:0 "推开居住区的气密门，属于你自己的舱室依旧是一片混乱。\n\n杂七杂八的物品散落在地毯上，或许是时候整理一下了。\n\n"
 mygo_story.424.a:0 "收拾一下？"
 mygo_story.424.a.response:0 "在某个视线的死角，你发现了一把落灰的吉他。完全没有任何相关的记忆，你甚至不知道自己什么时候学过弹吉他。\n\n你试着拨动琴弦，发出了一阵轻轻的杂音。"
 mygo_story.424.b:0 "结束巡视，返回工作岗位。"