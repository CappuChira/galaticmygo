l_simp_chinese:
 # 阶段一
 mygo_story.480.name:0 "真空中的荧光"
 mygo_story.480.desc:0 "今天‘迷子号’停靠在一片彗星带边缘进行破冰作业。\n\n你刚批完手头的行政报告，休息舱的传呼器里就响起了高松灯的声音：“小爱……看观景甲板……外面在闪闪发光！”\n\n你赶到全景舷窗前。在切割巨大冰体时，无数碎冰化作的冰晶在真空中逸散开来。在恒星光线的折射下，无数细小的荧光颗粒在方舟外围静谧地漂流，形成了一场铺天盖地的七彩星尘海。"
 mygo_story.480.a:0 "哇！好漂亮！"
 mygo_story.480.a.response:0 "“嗯……看上去有点像，舞台。”站在你身边的灯把脸贴在冰冷的玻璃上，眼里倒映着彩色的荧光，“总觉得……它们好温柔，在这么冷、这么黑的太空里，也想要努力发光。”"
 mygo_story.480.b:0 "tomorin，这好浪漫啊……"
 mygo_story.480.b.response:0 "“嗯……”灯看得入了迷。"
 mygo_story.480.c:0 "谢谢你叫我来看，心情好多了。"
 mygo_story.480.c.response:0 "高松灯羞涩地笑了笑，随后像是想起了什么，从兜里摸出一个装标本的小玻璃瓶。"

 # 阶段二
 mygo_story.481.name:0 "石头、冰粒与闪闪发光的眼泪"
 mygo_story.481.desc:0 "灯抬起手，用玻璃瓶比着窗外缓缓翻滚的彩色冰粒。\n\n“小爱……这些在宇宙里死掉的、闪闪发光的眼泪，如果飘走了，是不是就再也找不到了？如果能留住它们的话……”"
 mygo_story.481.a:0 "可能美丽的东西总是稍纵即逝吧，就像烟花……唔……烟花……？"
 mygo_story.481.a.response:0 "“这样啊……”高松灯有些失落地垂下头，“也是呢。我总是想收集这些留不住的东西……”"
 mygo_story.481.b:0 "用玻璃瓶收集它们吗？"
 mygo_story.481.b.response:0 "“不用了。即便是收集起来，它们以后，也不会像现在一样闪闪发光了。”"
 mygo_story.481.c:0 "唔……"
 mygo_story.481.c.response:0 "一转身，你看到独立勘探员乐奈正提着一把吉他站在门口。"

 # 阶段三
 mygo_story.482.name:0 "无声星海与随性音符"
 mygo_story.482.desc:0 "要乐奈根本没有理会你和高松灯惊讶的目光。\n\n她大大咧咧地在舷窗边的地板上盘腿坐了下来。手指抚上琴弦，一阵极其清脆、毫无章法却极其高亢自由的吉他音符瞬间在空旷的观景甲板上爆开。\n\n外面是死寂、无声、静谧漂流的折射冰晶；里面是乐奈随性且激烈的扫弦。高松灯先是愣了一下，随后一屁股坐在乐奈身边，合着吉他的拍子小声地、一句一句地哼唱起来。"
 mygo_story.482.a:0 "小乐奈！你居然会弹吉他啊！"
 mygo_story.482.a.response:0 "要乐奈连眼皮都没抬一下，指尖疯狂扫弦，嘴里咬着煎茶糖，含糊不清地回了一句：“吉他说，它想唱歌。”"
 mygo_story.482.b:0 "（索性也坐了下来）我也加入！"
 mygo_story.482.b.response:0 "你试着一边拍打着金属墙壁当打击乐，一边跟着灯的声音瞎哼哼。要乐奈听到你的古怪节奏，唇角往上勾了勾，吉他的旋律瞬间变得更加欢快。"
 mygo_story.482.c:0 "音乐和哼唱在甲板上回荡，窗外的荧光渐渐远去……"
 mygo_story.482.c.response:0 "直到观景台逐渐转到看不到冰荧光海的位置，恒星的光芒被方舟的阴影遮挡，这场即兴演出才慢慢平息下来。"

 # 阶段四
 mygo_story.483.name:0 "迷星叫"
 mygo_story.483.desc:0 "要乐奈松开手，将吉他往你怀里一推，站了起来：“肚子饿了。”说完，她就像来时一样，轻快地溜出了观景舱。\n\n灯还坐在地上，她抬起头看着你，星光落在她的眸子里，明亮耀眼：“小爱……虽然我们不知道以前是谁，但只要像现在这样大家在一起，一起走下去，就一定能找到更多关于过去的事情！”\n\n你看向恢复黑暗的深空。"
 mygo_story.483.a:0 "我，我也要弹吗？"
 mygo_story.483.a.response:0 "你抱着吉他，试着拨弄几下琴弦。\n\n果然还是好难听。"