l_simp_chinese:
 # 阶段一
 mygo_story.470.name:0 "查寝"
 mygo_story.470.desc:0 "你正躺在自己舱室的床上无所事事，房间的门突然发出一声刺耳的脆响。\n\n立希手里拿着一块平板电脑，黑着脸大步跨了进来。她的目光甚至没有在你身上停留，而是直接死死地盯着你那堆满了过期零食袋，椅子上还散落着换洗制服的梳妆台。\n\n“爱音，备件库的清单上少了一个电子干扰仪。我查了监控，那个小东西黏在你的衣服上了。它现在在哪？”"
 mygo_story.470.a:0 "Rikki！进女孩子的房间之前要先敲门啊！"
 mygo_story.470.a.response:0 "“哈？！我对你的隐私没兴趣。”立希扬了扬手里的平板电脑，“快点，你的衣服都堆在这了吗？”"
 mygo_story.470.b:0 "怎么可能啦，那种东西能黏在衣服上吗？"
 mygo_story.470.b.response:0 "“不愿意找我就替你来。”椎名立希推开面前堆积的空罐子，“闪开，我自己找。”"
 mygo_story.470.c:0 "（急忙跳下床阻止）等等！你别乱翻我的桌子！"
 mygo_story.470.c.response:0 "你试图用身体挡住桌子，阻止她把你的全部家当翻个底朝天。"

 # 阶段二
 mygo_story.471.name:0 "梦想改造家"
 mygo_story.471.desc:0 "几分钟后，毫无进度的椎名立希看着眼前这间堪比废料堆的房间，深深地叹了一口气。\n\n“你每天就睡在这种地方？”椎名立希把平板电脑往床上一扔，“那我来教你怎么收拾房间。”\n\n还没等你反应过来，她已经开始把地上的衣服粗暴地分类，然后扔进收纳箱里。"
 mygo_story.471.a:0 "别动那个！你动了我就找不见啦——"
 mygo_story.471.a.response:0 "椎名立希头也不回，随手把一件外套拍在你的脸上。"
 mygo_story.471.b:0 "Rikki最好了！那就，顺便帮我把床单也铺一下吧？"
 mygo_story.471.b.response:0 "“千早爱音！你真以为我是来给你当免费女仆的吗？！”椎名立希猛地转过头狠狠瞪了你一眼，但手上的动作倒是完全没有停下来的意思。"
 mygo_story.471.c:0 "（试图抢回自己的衣服）这件我等下还要穿——"
 mygo_story.471.c.response:0 "在争夺衣服的过程中，床底下的某个东西被碰了一下，发出了沉闷的金属撞击声。"

 # 阶段三
 mygo_story.472.name:0 "古老遗产"
 mygo_story.472.desc:0 "椎名立希疑惑地蹲下身，直接从你的床底下拖出了一个落满灰尘的旧铁盒。\n\n“这是什么……”椎名立希一边嘀咕着，一边打开了生锈的锁扣。铁盒盖弹开，露出了里面厚厚的一叠。\n\n你和她同时看清了最上面的那张画——那是线条极其抽象的人物画像，旁边还用极其显眼的艺术字歪歪扭扭地写着：【超级天才爱音酱】。在画像的下面，其他画纸上画着各种奇怪的东西——\n\n包括一根木棍串起来一片柠檬的奇怪物体，旁边的文字说这东西就是迷子号。"
 mygo_story.472.a:0 "（飞扑过去）哇啊啊啊！不准看！快还给我！"
 mygo_story.472.a.response:0 "已经晚了。椎名立希的动作比你更快，她已经把那厚厚的一叠拿在了手里。"
 mygo_story.472.b:0 "……那个，这其实是……这是什么呀我也没见过哦……"
 mygo_story.472.b.response:0 "椎名立希缓缓抬起头，用一种看傻子一样的眼神看着你：“千早爱音，你……还算有艺术细胞？”"
 mygo_story.472.c:0 "可能是我小时候画的吧……但是我完全没印象了！"
 mygo_story.472.c.response:0 "“原来你小时候写字也这么丑吗……”椎名立希的眼神里充满了怀疑。她把那厚厚的一叠画纸重新放回铁盒里，锁上了锁扣。"

 # 阶段四
 mygo_story.473.name:0 "竣工"
 mygo_story.473.desc:0 "椎名立希把铁盒塞回了你的怀里，随后默默地把清理好的收纳箱推到了墙角。房间此刻变得前所未有的整洁干净。\n\n“啊，那个小仪器在这。”椎名立希把它捡起来，拿起平板电脑往门外走去。在踏出门舱的前一刻，她停下脚步，微微侧过头，虽然极力压制，但唇角还是忍不住抽动了一下。\n\n“超级天才爱音酱……”\n\n门舱在眼前缓缓合上，整个房间陷入了死寂。你抱着那个铁盒坐在干净的地板上，觉得自己的尊严……已经消失殆尽。"
 mygo_story.473.a:0 "可恶……Rikki！！！"
 mygo_story.473.a.response:0 "你躺回床上，大脑一片空白。"