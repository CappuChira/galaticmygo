l_simp_chinese:
 mygo_stardust_three_site:0 "碎裂的黑金"
 mygo_stardust_three_site_desc:0 "我们探测到了一个巨大的金属异常信号。"
 site_mygo_three:0 "碎裂的黑金"
 site_mygo_three_intro:0 "我们的科研船探测到了一个巨大的金属异常信号。那是一截飞船残骸，外壳上布满了被高能粒子流切割的惨烈痕迹。"

 mygo_three.1.name:0 "深渊中的黑耀石"
 mygo_three.1.desc:0 "科研团队抵近了这块巨大的残骸。我们在残骸侧面的装甲剥落处，发现了七个由通用语书写的巨大喷漆字母：【CRYCHIC】。其外壳所使用的装甲材料强度较低，我们正在尝试派遣工程队进入残骸内部，寻找更多的线索。"
 mygo_three.1.a:0 "很有趣。"

 mygo_three.2.name:0 "剥离的残骸"
 mygo_three.2.desc:0 "初步探勘结果令我们感到困惑。它边缘的金属撕裂痕迹和爆破残留物表明这并非一艘独立建造的飞船。\n\n残骸的底部接口呈现出极其暴力的金属撕裂状。它原本是连接在某一艘极其庞大的母舰上的，不知出于何种原因，它被强行从母舰上剥离了下来。"
 mygo_three.2.a:0 "无论它是什么，继续深入。"

 mygo_three.3.name:0 "居住区段"
 mygo_three.3.desc:0 "进入内部后，工程团队发现这曾经属于一艘飞船的居住区段。鉴于之前的发现记录，我们将这个残骸的研究优先级调高，并正在尝试将它与母舰进行比对。"
 mygo_three.3.a:0 "难道说？"

 mygo_three.4.name:0 "比对"
 mygo_three.4.desc:0 "比对结果显示，这艘残骸的母舰与我们现在所处的迷子号完全一致。我们正在尝试从残骸中提取黑匣子记录，以便了解它被剥离的原因。"
 mygo_three.4.a:0 "那为什么……飞船的外壳会是CRYCHIC？"

 mygo_three.5.name:0 "秘密集会"
 mygo_three.5.desc:0 "通过半衰期检定，我们将事发时间追溯到了距上一个信标35年左右。当时的飞船不慎遭遇了维生系统全面停摆的危机。食物配给骤降，灯光依次熄灭，绝望的情绪像瘟疫一样在各个甲板蔓延，不少人产生了逃离的念头。"
 mygo_three.5.a:0 "更多的秘密。"

 mygo_three.6.name:0 "决裂"
 mygo_three.6.desc:0 "A3至A7区的工业核心处产生了一次又一次的分离主义者秘密集会。当时的飞船未能处理这些分歧。矛盾越来越重，最终导致了飞船的分裂。"
 mygo_three.6.a:0 "后来呢？"

 mygo_three.7.name:0 "撕裂的火光"
 mygo_three.7.desc:0 "我们复原了那场大分裂的物理进程。多处地方发生交火，最终连接处的侧翼装甲被直接引爆以提供初速，母船因此遭受了极其严重的结构性重创。"
 mygo_three.7.a:0 "那差点毁了整艘母船！"

 mygo_three.8.name:0 "残破的终局"
 mygo_three.8.desc:0 "在我们被称作‘迷子’之前，这艘母船，连同那些完整的记忆与梦想，曾经被命名为CRYCHIC。"
 mygo_three.8.a:0 "我们……是被抛弃的？"

 mygo_three.9.name:0 "遗忘的伤疤"
 mygo_three.9.desc:0 "‘CRYCHIC’是我们真正的旧名。这场事故无疑造成了巨大的损失，我们直到今日仍在持续着对迷子号的修复建设工作。我们强烈怀疑，前代领袖们遭遇了精神层面的毁灭，最终导致了那场将所有人记忆格式化的大清零。而那个带着核心出走的幽灵，不知道如今还是否存在，又在银河系的哪个角落。"
 mygo_three.9.a:0 "继续前进吧。"