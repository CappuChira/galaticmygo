l_simp_chinese:
 # 阶段三本地化
 mygo_story.430.name:0 "加密通讯：底层的雨声"
 mygo_story.430.desc:0 "§H内政总管 【SOYO】§!\n\nANON……不，千早阁下。科学团队刚刚递交的解密报告，我已经在行政终端上看过了。\n\n告诉我，你还知道些什么？我们到底……遗忘了什么？"
 mygo_story.430.a:0 "……"
 mygo_story.430.a.response:0 "……我明白了。你不想说的事情，我不会勉强你。"
 mygo_story.430.b:0 "（沉默）这艘船的秘密，我会查清楚的。"
 mygo_story.430.b.response:0 "是吗……那么，就继续拜托您了。请务必……不要让我失望，千早阁下。"

 # 阶段五本地化
 mygo_story.440.name:0 "通讯接入：内政总管"
 mygo_story.440.desc:0 "§H内政总管 【SOYO】§!\n\n不要出声，先听我说，ANON。我已经用内政主管的权限把那段录音彻底隔离了，小灯也被我提前支开了，不会有第三个人看到它。\n\n（屏幕上的素世她微微低着头，唇角带着一抹甚至有些宠溺的微笑。）\n\n原来……是爱音你做的事情呢。我居然会哭得那么狼狈地去求你……真是不像样呢。\n\n但是，不要紧的哦。请不要露出那种快要坏掉的表情，也不要有什么负担。你当时一定也是为了让我们活下去，为了这艘船的存续，才不得不做出那么痛苦的决定的吧？\n\n过去的事情，我们早晚会全部了解清楚的。现在的你，是那个带着大家在星海里努力活下去的ANON。所以……想开一点吧，我不会怪你的。"
 mygo_story.440.a:0 "真的不怪我吗……素世？"
 mygo_story.440.a.response:0 "没关系的呢。那些痛苦的、会让人坏掉的记忆，就算不要了也没关系。只要现在，你还需要我来帮你管理内政，不就足够了吗？"
 mygo_story.440.b:0 "谢谢你，soyorin……真的谢谢你。"
 mygo_story.440.b.response:0 "都说了……请不要再叫这种奇怪的绰号了。不过，偶尔听一次……似乎也并不坏呢。只要ANON……小爱音，以后不管做什么决定，都绝对不要放开我的手……这就足够了。"