l_simp_chinese:
 # 阶段六后续本地化
 mygo_story.450.name:0 "舰内偶遇：失重的红茶"
 mygo_story.450.desc:0 "时间已经过去了数个周期。\n\n舰桥的全息投影依旧闪烁着冰冷的光芒，但主控台前的那个位置，最近却经常陷入长久的死寂。你发现自己开始害怕触碰那些推杆，哪怕只是规划一条普通的航线，脑海里都会浮现出上一世的自己将大家格式化时的冰冷白光。\n\n今天你又一次在决策中途恍神了。为了逃避这种窒息感，你漫无目的地走在居住区的环形长廊上。走廊尽头是一处狭窄的观景舱，星系中央那颗垂死的白矮星正散发着惨淡的蓝白荧光。\n\n“——在这种地方吹冷风，可不符合执政官的作息表呢，小爱音。”\n\n一抹熟悉的棕色身影不知何时站在了你的身侧。长崎素世手里端着两个保温杯，将其中一个递到了你的面前。"
 mygo_story.450.a:0 "（勉强笑了一下）是soyorin啊……我只是，突然不知道该怎么按下那些指令了。"
 mygo_story.450.a.response:0 "现在的爱音酱，连笑起来都像是在哭呢。因为那些烧毁的数据而害怕了吗？觉得这艘飞船上的所有人，都是被你握在手里的牵线木偶？"
 mygo_story.450.b:0 "如果我再次按下去……你们是不是又会把我忘掉？"
 mygo_story.450.b.response:0 "（将手中的杯子放下，身体微微向你倾斜，伸出双手轻柔却不容拒绝地捧住了你的脸颊。她的手心很温暖。）\n\n不会的。我保证，绝对不会发生那种事。\n\n就算你真的再次按了下去，就算大家把一切都忘了……我们也一定会像现在这样，重新找到你，重新站在你身边。\n\n所以，不要再露出这种表情了。茶要凉了，喝完它，然后……像以前那样，自信地带我们走下去吧，元首阁下？"