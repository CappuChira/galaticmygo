l_simp_chinese:
 # 阶段一
 mygo_story.460.name:0 "下午茶"
 mygo_story.460.desc:0 "为了打破前段时间发掘报告带来的压抑气氛，你决定以执政官的最高名义，举办第一届【红茶与藻类品鉴茶话会】。\n\n此刻，在休息舱的金属料理台前，你正和科学官tomorin大眼瞪小眼。盘子里摆放着你们的劳动成果——一种用合成蛋白质、水培抹茶藻类以及……不知道灯从哪里敲下来的‘富钠矿物质结晶粉末’混合而成的墨绿色糕点。它散发着一种难以言喻的、如同星际废料般的诡异微光。\n\n“那个……小爱。”灯有些不安，“……大家，会喜欢吗？”"
 mygo_story.460.a:0 "放心吧灯！这绝对是超越时代的宇宙神级料理！"
 mygo_story.460.a.response:0 "“超、超越时代吗……”灯的眼睛亮了一下，有些羞涩地笑了起来，“太好了。不过……总觉得这个颜色，很像立希生气时的脸色呢……”"
 mygo_story.460.b:0 "其实……我也有点虚，这东西真的不会吃坏肚子吗？"
 mygo_story.460.b.response:0 "“呜……如果让全舰拉肚子的话，小素世绝对会生气的吧？”"
 mygo_story.460.c:0 "拍张照上传到主控网，起名叫‘ANON PIE’。"
 mygo_story.460.c.response:0 "【系统提示】：您的动态已发送。"
 mygo_story.460.d:0 "不管了！强行接入其他人的终端，命令她们立刻过来吃！"
 mygo_story.460.d.response:0 "……"

 # 阶段二
 mygo_story.461.name:0 "受害者们"
 mygo_story.461.desc:0 "两分钟内，休息舱的气密门被粗暴地推开了。\n\n“千早爱音！你发红色级别的紧急召集令居然是为了——”在看到盘子里那一坨散发着诡异绿光的糕点时，她的声音戛然而止，脸确实变得和糕点一个颜色。\n\n长崎素世紧随其后。她看了一眼料理台，唇角的微笑变得僵硬：“……真是不敢轻易动刀呢。”"
 mygo_story.461.a:0 "rikki，别那么凶嘛，这可是用了精准的配比哦！"
 mygo_story.461.a.response:0 "“哈？！”立希暴躁地揉着太阳穴，“灯，你不要总是跟着这家伙胡闹……”"
 mygo_story.461.b:0 "soyorin，快来尝尝，这绝对是顶级口感！"
 mygo_story.461.b.response:0 "“……”素世的身体却微妙地往后退了一步，“……让小乐奈来试一下？”"
 mygo_story.461.c:0 "乐奈怎么还没来……"
 mygo_story.461.c.response:0 "砰的一声，通风口格栅被粗暴踢开。"

 # 阶段三
 mygo_story.462.name:0 "野猫突袭"
 mygo_story.462.desc:0 "一抹白色的身影从天而降，如同野猫般精准地落在了料理台上。\n\n是乐奈。她那双毫无波澜的眼睛在房间里扫了一圈，最后死死地钉在了那盘墨绿色的糕点上。抽了抽鼻子后，乐奈甚至连招呼都没打，直接伸手抓起最大的一块，在众人的目光中塞进了嘴里。\n\n“喂！野猫！那个不能随便——”立希伸出手试图阻止，但已经来不及了。"
 mygo_story.462.a:0 "（紧张）怎、怎么样？超级好吃的对吧？！"
 mygo_story.462.a.response:0 "乐奈的表情突然皱成了一团。\n“难吃。不是抹茶。”乐奈转过头，死死盯着爱音，“爱音，糖，漱口。”"
 mygo_story.462.b:0 "呜哇！我的心血！rikki你快看她啦！"
 mygo_story.462.b.response:0 "“活该，谁让你做这种怪东西的。”"
 mygo_story.462.c:0 "还有最后一块点心……"
 mygo_story.462.c.response:0 "众人的目光缓缓移到了你的脸上，笑容逐渐深邃。"

 # 阶段四
 mygo_story.463.name:0 "光盘行动"
 mygo_story.463.desc:0 "“好了，小爱音。”素世端起盘子里最后那块散发着微光的糕点，极其优雅地递到了你的嘴边，“就请您怀着激动的心情，全部吃下去吧？”\n\n立希双手抱胸，冷笑着在一旁围观。灯则和乐奈在一旁亮晶晶地看着你。\n\n看着那块闪烁着幽光的糕点，你咽了口唾沫，深知今天这一关是无论如何也躲不过去了。"
 mygo_story.463.a:0 "（闭眼一口闷）……呜哇！真的好难吃啊！"
 mygo_story.463.a.response:0 "随着你痛苦的咀嚼和惨叫，休息舱里爆发出了久违的喧闹声。立希一边骂你笨蛋一边和灯急忙去接过滤水，素世长叹一口气，而在弥留之际，你似乎听到有人在夸你是“有趣的女人”……\n\n不仅点心极其失败，在这一刻，你也离死没多远了……"