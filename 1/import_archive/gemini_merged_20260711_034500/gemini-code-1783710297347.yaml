l_simp_chinese:
 mygo_stardust_two_site:0 "星尘信标：远星的回响"
 mygo_stardust_two_site_desc:0 "我们的科研船在一颗因超新星爆发而严重玻璃化的废土行星上，探测到了异常的地下空洞。深度扫描显示，地表下方存在一个被气密力场完好保护的巨型人工建筑结构。"
 site_mygo_two:0 "星尘信标：远星的回响"
 site_mygo_two_intro:0 "我们的科研船在一颗因超新星爆发而严重玻璃化的废土行星上，探测到了异常的地下空洞。深度扫描显示，地表下方存在一个被气密力场完好保护的巨型人工建筑结构。"

 mygo_two.1.name:0 "地下穹顶"
 mygo_two.1.desc:0 "科研船向废墟派出了地质钻探小队。穿过厚重的玻璃化岩层后，我们进入了一个巨大的地下穹顶。通过结构学分析，该建筑具备极其精密的高频声学工程指标。整个巨构内部呈现标准的同心圆环形阶梯结构，中心区域设有一个升降式主平台，这种设计旨在将中央区域的声音投射给周围的数十万个坐席。这似乎是一处纯粹用于进行某项集体仪式的巨型场所。"
 mygo_two.1.a:0 "纯粹的演出场所？"

 mygo_two.2.name:0 "纸质印刷品"
 mygo_two.2.desc:0 "在类似安检口的废墟区域，我们找到了几个保存完好的真空恒温匣。里面存放着大量高分子聚合物制品。这似乎是某种活动的宣传册。\n\n封面上印着【CRYCHIC】的字样，但在此次记录中，与它并列的还有另外两个团体标志：【Morfonica】以及【Poppin'Party】。文本显示，这里曾是一场被称为“联合Live”的大型文化活动的举办地。"
 mygo_two.2.a:0 "共同live？"

 mygo_two.3.name:0 "光学与声学阵列"
 mygo_two.3.desc:0 "工程团队逆向研究了中央高台的残存设备，发现了一套极其精密的光学全息投影和声学放大阵列。这意味着我们的方舟上也可以设计同样高水平的舞台装置，并且我们或许能重启会场中央的残存供能节点。"
 mygo_two.3.a:0 "尝试恢复！"

 mygo_two.4.name:0 "全息演出的残影"
 mygo_two.4.desc:0 "我们成功通电并读取了部分未损坏的全息演出录像。舞台上闪烁着耀眼的灯光，属于CRYCHIC的成员们与另外两支队伍在台上共同演奏着乐器。\n\n她们在舞台上互相拥抱，强烈的节奏与极具感染力的声纹数据在空旷的废墟中回荡，前线的研究人员报告称，他们感到了一种强烈的时空割裂感。\n\nCRYCHIC在当时还拥有两名陌生的成员。研究人员正在尝试通过全息影像的面部识别技术确认她们的身份。"
 mygo_two.4.a:0 "如此快乐！"

 mygo_two.5.name:0 "FMT文本留档"
 mygo_two.5.desc:0 "在后台区域，我们发掘出了大量粉丝见面会的文本数字留档。这些记录保存了演出结束后，三个团体的成员与现场人员的对话文字。\n\n“在宇宙中流浪，我沿着心之梢去见你们……”署名为高松灯。\n“下一次，大家要一起在更美丽的星云里开演唱会哦！”署名为丰川祥子。\n“闪闪发光心动不已！”\n在那个纪元，这几支方舟舰队在漫长的星际旅途中相互支持、并行航行。"
 mygo_two.5.a:0 "简直像诗一样！"

 mygo_two.6.name:0 "沉寂的联络信道"
 mygo_two.6.desc:0 "在调查的最后阶段，科研人员在调度终端里提取出了一组未加密通讯频率。这是当时【CRYCHIC】用于与【Morfonica】和【Poppin'Party】在深空中协调航线与演出事宜的专属联络通道。\n\n准备好的话，就用这个频段吓她们一跳吧。"
 mygo_two.6.a:0 "开始通讯！"