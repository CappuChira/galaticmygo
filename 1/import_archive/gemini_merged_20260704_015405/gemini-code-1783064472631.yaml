l_english:
 mygo_story.420.name:0 "常规状态听证：军需处"
 mygo_story.420.desc:0 "执政官。粒子推进剂库存仅余 13.7%，熔炼触手的能源核心出现轻微共振。第一、第二常规护卫编队的推进器改装方案已经通过，由于缺乏新型耐热合金，目前只能停留在图纸阶段。如果没有进一步的开采坐标，引擎将于下个恒星周强制降低功率。完毕。"
 mygo_story.420.a:0 "推进器的共振是否影响作战效能？"
 mygo_story.420.a.response:0 "现阶段共振频率处于安全临界值以内，仅会导致巡航速度降低。但若爆发接敌，推进器负荷可能引发结构性崩溃。建议优先扩充耐热合金储备。"
 mygo_story.420.b:0 "获悉。继续执行维修调度。"
 mygo_story.420.b.response:0 "确认指令。我将继续监管动力舱的校准工作。"