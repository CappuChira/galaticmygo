 mygo_story.421.name:0 "系统日志：执政官的私人高频缓存"
 mygo_story.421.desc:0 "“嘶……头又痛了。\n\n就像是有人拿大号抽水机把脑子里的高频缓存区全抽干了一样，只剩下怎么操作这艘破船的基础代码。每次试图去回想为什么这艘飞船是这种掉漆的粉色，或者角落里那把破吉他到底是谁的，维生系统就会疯狂闪红灯，然后神经就会像被针扎一样疼。\n\n昨天我试着问 SOYO 和 TOMORI，我们登船之前到底在干什么……结果她们只是用那种没有焦距的眼神看着我。不仅仅是我，大家的数据面板全是一片空白。没有‘过去’，没有‘故乡’，连这个叫‘ANON’的代号都像是系统随机分配的一样。\n\n算了……反正每天光是对付那些见底的推进剂就已经够头疼了。没有过去就没有过去吧，总比作为一具完整的尸体飘在真空里强……”"
 mygo_story.421.a:0 "【停止录音并关闭终端。】"